*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background-color:var(--bg);
  background-image:var(--kitchen);
  background-repeat:repeat;
  background-size:300px 300px;
  background-position:top left;
  color:var(--ink);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Inter',sans-serif; font-weight:700; margin:0; letter-spacing:-.015em; line-height:1.1}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink)}
a{color:var(--brand)}
.num,.mono{font-variant-numeric:var(--tab)}
::selection{background:var(--brand-soft);color:var(--brand-strong)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;cursor:pointer;position:relative;
  box-shadow:var(--shadow-sm);transition:transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .16s,background .16s,border-color .16s,filter .16s;white-space:nowrap}
.btn:hover{background:var(--panel-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.985);box-shadow:var(--shadow-sm);filter:brightness(.98)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand-strong);color:var(--on-brand);box-shadow:0 8px 18px -8px var(--brand),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 12px 24px -10px var(--brand),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:active{filter:brightness(.97);transform:translateY(0) scale(.985)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn.ghost:active{transform:translateY(0) scale(.985)}
.btn.danger{color:var(--brand)}
.btn.danger:hover{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:0;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-hero{background:
   radial-gradient(120% 120% at 12% 8%, #2c5480 0%, #1d3f61 34%, #16324e 64%, #0e2338 100%);
   color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-hero .brandmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.login-hero .brandmark .logo{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;backdrop-filter:blur(2px)}
.login-hero h1{color:#fff;font-size:clamp(34px,4.6vw,58px);line-height:1.02;max-width:13ch;margin-top:8px;position:relative;z-index:2;letter-spacing:-.02em}
.login-hero p{color:#ffe0d9;max-width:40ch;font-size:15.5px;position:relative;z-index:2}
.login-hero .disc{font-size:12.5px;color:#ffcabf;position:relative;z-index:2}
.login-hero .pie{position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;
  background:conic-gradient(from 18deg, rgba(255,255,255,.11) 0 30deg, transparent 30deg 60deg, rgba(255,255,255,.11) 60deg 90deg, transparent 90deg 120deg, rgba(255,255,255,.11) 120deg 150deg, transparent 150deg 180deg, rgba(255,255,255,.11) 180deg 210deg, transparent 210deg 240deg, rgba(255,255,255,.11) 240deg 270deg, transparent 270deg 300deg, rgba(255,255,255,.11) 300deg 330deg, transparent 330deg 360deg);
  border:2px dashed rgba(255,255,255,.22)}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg)}
.login-card{width:100%;max-width:370px}
.login-card h2{font-size:27px;margin-bottom:5px}
.login-card .sub{color:var(--ink-2);margin-bottom:28px;font-size:14.5px}
.field{margin-bottom:15px}

.nav{flex:1;overflow-y:auto;padding:6px 12px 20px}

.nav a .nav-lab{flex:1;min-width:0}
.nav a .nav-badge{background:var(--brand);color:var(--on-brand);font-size:10.5px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px -2px var(--brand)}

.nav a:hover{background:var(--rail-2);color:var(--rail-ink)}
.nav a.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 8px 18px -10px var(--brand)}

.nav a.active::before{content:none}
.nav .grp{font-size:10.5px;letter-spacing:.08em;color:var(--rail-ink-2);text-transform:uppercase;padding:16px 12px 6px;font-weight:700;opacity:.7}
.side-user{border-top:1px solid var(--rail-line);padding:14px;display:flex;align-items:center;gap:11px}

.topbar .spacer{flex:1}
.content{padding:26px 30px 70px;max-width:1300px;width:100%}
.scrim{display:none}

.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);opacity:.9}
.kpi.good::after{background:var(--basil)} .kpi.bad::after{background:var(--brand)}
.kpi .k-lab{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.kpi .k-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;margin-top:10px;line-height:1;font-variant-numeric:var(--tab);letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.kpi.good .k-val{color:var(--basil)} .kpi.bad .k-val{color:var(--brand)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:16.5px}
.card-head .spacer{flex:1}
.card-body{padding:18px 20px}
.card-body.flush{padding:0}

/* ---------- Table ---------- */

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

function ensureSchema(){
  if(!db) return;
  if(!Array.isArray(db.producoes)) db.producoes=[];
  if(!Array.isArray(db.perdas)) db.perdas=[];
  if(!Array.isArray(db.contagens)) db.contagens=[];
  if(!Array.isArray(db.cotacoes)) db.cotacoes=[];
  (db.cotacoes||[]).forEach(c=>{ if(!c.status) c.status="rascunho"; if(!Array.isArray(c.historico)) c.historico=[]; });
  if(!db.config) db.config={};
  if(db.config.perdaLimite==null) db.config.perdaLimite=5;
  if(db.config.validadeAlerta==null) db.config.validadeAlerta=7;
  if(db.config.baixaVencidoAuto==null) db.config.baixaVencidoAuto=true;
  if(!db.config.desvioLimite) db.config.desvioLimite={bar:5,limpeza:5,descartaveis:5};
  if(!Array.isArray(db.config.conceitos)||!db.config.conceitos.length) db.config.conceitos=["Pizzaria","Petiscaria","Bar"];
  if(db.config.cartaoPadrao==null) db.config.cartaoPadrao=3;
  if(db.config.metaCmvVar==null) db.config.metaCmvVar=2;
  if(db.config.metaMargem==null) db.config.metaMargem=45;
  if(db.config.metaPrime==null) db.config.metaPrime=60;
  if(db.config.numMesas==null) db.config.numMesas=8;
  if(db.config.lugares==null) db.config.lugares=32;
  if(db.config.horasDia==null) db.config.horasDia=6;
  if(!Array.isArray(db.comandas)) db.comandas=[];
  (db.produtos||[]).forEach(p=>{ if(!p.conceito) p.conceito=(db.config.conceitos&&db.config.conceitos[0])||"Geral"; });
  // migrar funções antigas -> novas (gerente→gerência, caixa→operação, cozinha→estoque)
  (db.usuarios||[]).forEach(u=>{ if(u && ROLE_MIGRATE[u.nivel]) u.nivel=ROLE_MIGRATE[u.nivel]; });
}

/* ---------- Domain calc ---------- */
function conceitoDe(p){ const c=(p&&p.conceito)||""; const list=(db.config&&db.config.conceitos)||[]; return c||list[0]||"Geral"; }
function custoProduto(p){
  if(!p) return 0;
  if(p.ficha && p.ficha.length){
    return p.ficha.reduce((s,f)=>{ const i=byId(db.insumos,f.insumoId); return s+(i?(i.custoMedio||0)*num(f.qtd):0); },0);
  }
  return num(p.custoManual);
}
/* Custo total por unidade (insumos + energia + embalagem + outros) — usado só na precificação/exibição */
function custoTotalProduto(p){ if(!p) return 0; return custoProduto(p)+num(p.energia)+num(p.embalagem)+num(p.outros); }
/* Preço que gera a margem desejada considerando as taxas (fração sobre o preço) */
function precoComMargem(custo, fracTaxas, modo, margem){
  const f=num(fracTaxas), m=num(margem)/100;
  if(modo==='custo'){ const d=1-f; return d>0?(custo*(1+m))/d:0; }
  const d=1-f-m; return d>0?custo/d:0; // 'preco'
}
/* Precifica um produto p/ balcão e iFood a partir dos parâmetros salvos */
function precificar(p){
  const ct=custoTotalProduto(p);
  const imp=num(p.imposto!=null?p.imposto:((db.config&&db.config.impostoPercent)||0));
  const cartao=num(p.cartao), modo=p.precoModo||'preco', margem=num(p.margem);
  const temParams = p.margem!=null && p.margem!=="";
  const fB=(imp+cartao)/100;
  const precoB = temParams? precoComMargem(ct,fB,modo,margem) : num(p.preco);
  const lucroB = precoB*(1-fB)-ct;
  const fI=(imp+num(p.ifCom)+num(p.ifTx)+num(p.ifAnt))/100;
  const precoI = temParams? precoComMargem(ct,fI,modo,margem) : num(p.precoIfood);
  const lucroI = precoI*(1-fI)-ct;
  const margemB = precoB>0? lucroB/precoB*100 : 0;
  return {custoTotal:ct, precoB, lucroB, margemB, precoI, lucroI, temParams, temIfood:(num(p.ifCom)+num(p.ifTx)+num(p.ifAnt))>0};
}
function inPeriod(iso, mode){
  if(!iso) return false;
  const t=todayISO();
  if(mode==="dia") return iso===t;
  if(mode==="mes") return iso.slice(0,7)===monthISO();
  if(mode==="ano") return iso.slice(0,4)===yearISO();
  return true; // total
}
function inMonth(iso,ym){ return iso && iso.slice(0,7)===ym; }

function vendaCMV(v){ return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); return s+num(it.qtd)*custoProduto(p); },0); }

/* Baixa direta de estoque na venda (produtos marcados como revenda) */
function baixasDaVenda(itens){
  const map={};
  (itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); if(!p||!p.baixaVenda||!p.ficha) return;
    p.ficha.forEach(f=>{ map[f.insumoId]=(map[f.insumoId]||0)+num(f.qtd)*num(it.qtd); });
  });
  return Object.entries(map).map(([insumoId,qtd])=>({insumoId,qtd}));
}
function aplicarBaixas(baixas,sinal){ (baixas||[]).forEach(b=>{ const i=byId(db.insumos,b.insumoId); if(!i) return; if(temLotes(i)){ if(sinal<0) consumirLotesFIFO(i,num(b.qtd)); else addLote(i,num(b.qtd),""); } else { i.estoque=num(i.estoque)+sinal*num(b.qtd); } }); }
/* Consumo FIFO por validade (mais próxima primeiro; sem validade por último) */
function consumirLotesFIFO(i, qtd){
  if(!temLotes(i)){ i.estoque=num(i.estoque)-num(qtd); return; }
  let rest=num(qtd);
  i.lotes.sort((a,b)=>((a.validade||"9999-12-31").localeCompare(b.validade||"9999-12-31")));
  for(const l of i.lotes){ if(rest<=0) break; const take=Math.min(num(l.qtd),rest); l.qtd=num(l.qtd)-take; rest-=take; }
  i.lotes=i.lotes.filter(l=>num(l.qtd)>1e-9);
  syncEstoqueLotes(i);
}
function addLote(i, qtd, validade){ i.lotes=i.lotes||[]; const id=uid(); i.lotes.push({id,qtd:num(qtd),validade:validade||""}); syncEstoqueLotes(i); return id; }
function reduzirLotePorId(i, loteId, qtd){
  if(!i.lotes||!i.lotes.length){ i.estoque=num(i.estoque)-num(qtd); return; }
  const l=loteId&&i.lotes.find(x=>x.id===loteId);
  if(l){ l.qtd=num(l.qtd)-num(qtd); }
  else { let rest=num(qtd); for(let k=i.lotes.length-1;k>=0&&rest>0;k--){const take=Math.min(num(i.lotes[k].qtd),rest);i.lotes[k].qtd=num(i.lotes[k].qtd)-take;rest-=take;} }
  i.lotes=i.lotes.filter(x=>num(x.qtd)>1e-9); syncEstoqueLotes(i);
}
/* Consumo teórico de insumos de UMA produção (produto × ficha técnica) */
function producaoCustoTeorico(pr){ const p=byId(db.produtos,pr.produtoId); if(!p) return 0; return custoProduto(p)*num(pr.qtd); }
/* Mapa insumoId -> qtd teórica consumida no período (produção × ficha) */
function consumoTeoricoQtd(mode){
  const map={};
  (db.producoes||[]).filter(pr=>inPeriod(pr.data,mode)).forEach(pr=>{
    const p=byId(db.produtos,pr.produtoId); if(!p||!p.ficha) return;
    p.ficha.forEach(f=>{ map[f.insumoId]=(map[f.insumoId]||0)+num(f.qtd)*num(pr.qtd); });
  });
  return map;
}
/* Mapa insumoId -> qtd real enviada à cozinha no período (saídas) */
function consumoRealQtd(mode){
  const map={};
  db.movimentacoes.filter(m=>m.tipo==="saida"&&setorDe(m)==="cozinha"&&inPeriod(m.data,mode)).forEach(m=>{ map[m.insumoId]=(map[m.insumoId]||0)+num(m.qtd); });
  return map;
}
/* ---- Perdas & ocorrências ---- */
const MOTIVOS=["Quebra","Queima","Cortesia","Sobra","Vencido","Outro"];
/* Expande uma perda em consumo de insumos (produto vira insumos via ficha) */
function perdaExpandir(pl){
  if(!pl) return [];
  if(pl.tipo==="produto"){ const p=byId(db.produtos,pl.produtoId); if(!p||!p.ficha) return []; return p.ficha.map(f=>({insumoId:f.insumoId,qtd:num(f.qtd)*num(pl.qtd)})); }
  return [{insumoId:pl.insumoId,qtd:num(pl.qtd)}];
}
function perdaValor(pl){ return perdaExpandir(pl).reduce((s,e)=>{const i=byId(db.insumos,e.insumoId);return s+e.qtd*(i?num(i.custoMedio):0);},0); }
function perdaInsumosQtd(mode){ const map={}; (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).forEach(pl=>{perdaExpandir(pl).forEach(e=>{map[e.insumoId]=(map[e.insumoId]||0)+e.qtd;});}); return map; }
function perdaPorMotivo(mode){ const map={}; (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).forEach(pl=>{map[pl.motivo]=(map[pl.motivo]||0)+perdaValor(pl);}); return map; }
function perdaTotalValor(mode){ return (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).reduce((s,pl)=>s+perdaValor(pl),0); }
/* Reconciliação por insumo: enviado (real) − teórico (produção) − perdas registradas = não explicado */
function varianciaInsumos(mode){
  const real=consumoRealQtd(mode), teo=consumoTeoricoQtd(mode), per=perdaInsumosQtd(mode);
  const ids=new Set([...Object.keys(real),...Object.keys(teo),...Object.keys(per)]);
  const rows=[];
  ids.forEach(id=>{
    const i=byId(db.insumos,id); if(!i) return;
    const qr=real[id]||0, qt=teo[id]||0, qp=per[id]||0, custo=num(i.custoMedio);
    const naoExpl=qr-qt-qp, base=qt+qp;
    const perc = base>0 ? (naoExpl/base*100) : (qr>0? Infinity : 0);
    rows.push({id,nome:i.nome,unidade:i.unidade,qtReal:qr,qtTeo:qt,qtPerda:qp,naoExpl,dr:naoExpl*custo,perc,temBase:base>0});
  });
  return rows.sort((a,b)=>Math.abs(b.dr)-Math.abs(a.dr));
}
/* Classe/rótulo de alerta a partir do % não explicado */
function perdaFlag(perc,temBase){
  const lim=num((db.config&&db.config.perdaLimite)||5);
  if(!temBase) return {cls:"gray",txt:"sem base"};
  const a=Math.abs(perc);
  if(a<=lim) return {cls:"green",txt:"ok"};
  if(a<=lim*3) return {cls:"amber",txt:"atenção"};
  return {cls:"red",txt:"crítico"};
}
/* Situação de desvio de um setor (limite % configurável por setor, sobre o consumo/saídas) */
function setorFlag(desvioR, baseR, setor){
  const lim=num((db.config&&db.config.desvioLimite&&db.config.desvioLimite[setor])||5);
  if(!(baseR>0)) return {cls:Math.abs(desvioR)<0.01?"green":"amber", txt:Math.abs(desvioR)<0.01?"ok":"atenção", perc:0};
  const perc=Math.abs(desvioR)/baseR*100;
  if(perc<=lim) return {cls:"green",txt:"ok",perc};
  if(perc<=lim*3) return {cls:"amber",txt:"atenção",perc};
  return {cls:"red",txt:"crítico",perc};
}

/* ---- Fechamento diário / contagem física da cozinha ---- */
function contagemMapa(dataISO,setor){ setor=setor||"cozinha"; const c=(db.contagens||[]).filter(x=>x.data===dataISO&&setorDe(x)===setor).sort((a,b)=>b.id.localeCompare(a.id))[0]; if(!c) return null; const m={}; (c.itens||[]).forEach(it=>{m[it.insumoId]=num(it.qtd);}); return m; }
function contagemDe(dataISO,setor){ setor=setor||"cozinha"; return (db.contagens||[]).filter(x=>x.data===dataISO&&setorDe(x)===setor).sort((a,b)=>b.id.localeCompare(a.id))[0]||null; }
function nomeUsuario(uid){ const u=byId(db.usuarios,uid); return u?u.nome:"—"; }
function datasComContagem(setor){ setor=setor||"cozinha"; return [...new Set((db.contagens||[]).filter(c=>setorDe(c)===setor).map(c=>c.data))].sort(); }
function ultimaContagemAntes(dataISO,setor){ const ds=datasComContagem(setor).filter(d=>d<dataISO); return ds.length?ds[ds.length-1]:null; }
function enviadoJanela(after,upto){ const m={}; db.movimentacoes.filter(x=>x.tipo==="saida"&&setorDe(x)==="cozinha"&&x.data>(after||"")&&x.data<=upto).forEach(x=>{m[x.insumoId]=(m[x.insumoId]||0)+num(x.qtd);}); return m; }
function teoricoJanela(after,upto){ const m={}; (db.producoes||[]).filter(pr=>pr.data>(after||"")&&pr.data<=upto).forEach(pr=>{const p=byId(db.produtos,pr.produtoId);if(!p||!p.ficha)return;p.ficha.forEach(f=>{m[f.insumoId]=(m[f.insumoId]||0)+num(f.qtd)*num(pr.qtd);});}); return m; }
function perdasJanela(after,upto){ const m={}; (db.perdas||[]).filter(pl=>pl.data>(after||"")&&pl.data<=upto).forEach(pl=>{perdaExpandir(pl).forEach(e=>{m[e.insumoId]=(m[e.insumoId]||0)+e.qtd;});}); return m; }
/* Reconciliação de um dia: sobra anterior + enviado − produção − perdas − contado = desvio */
function reconcileDia(dataISO){
  const cont=contagemMapa(dataISO);
  const prev=ultimaContagemAntes(dataISO);
  const abertura=prev?contagemMapa(prev):null;
  const env=enviadoJanela(prev,dataISO), teo=teoricoJanela(prev,dataISO), per=perdasJanela(prev,dataISO);
  const ids=new Set([...Object.keys(env),...Object.keys(teo),...Object.keys(per),...(abertura?Object.keys(abertura):[]),...(cont?Object.keys(cont):[])]);
  const rows=[];
  ids.forEach(id=>{ const i=byId(db.insumos,id); if(!i) return;
    const ini=abertura?(abertura[id]||0):0, e=env[id]||0, t=teo[id]||0, p=per[id]||0;
    const esperada=ini+e-t-p, contada=cont?(cont[id]||0):0;
    const desvio=cont?(esperada-contada):0, custo=num(i.custoMedio);
    rows.push({id,nome:i.nome,unidade:i.unidade,ini,enviado:e,teorico:t,perdas:p,esperada,contada,desvio,desvioR:desvio*custo,temCont:cont!=null});
  });
  return {data:dataISO,prev,temContagem:cont!=null,rows:rows.sort((a,b)=>a.nome.localeCompare(b.nome))};
}
/* Conciliação de setores sem produção (bar etc.): sobra anterior + entradas − saídas − contado = desvio */
function movJanelaSetor(after,upto,setor,tipo){ const m={}; db.movimentacoes.filter(x=>x.tipo===tipo&&setorDe(x)===setor&&x.data>(after||"")&&x.data<=upto).forEach(x=>{m[x.insumoId]=(m[x.insumoId]||0)+num(x.qtd);}); return m; }
function reconcileSetorDia(dataISO,setor){
  setor=setor||"bar";
  const cont=contagemMapa(dataISO,setor);
  const prev=ultimaContagemAntes(dataISO,setor);
  const abertura=prev?contagemMapa(prev,setor):null;
  const ent=movJanelaSetor(prev,dataISO,setor,"entrada");
  const sai=movJanelaSetor(prev,dataISO,setor,"saida");
  const ids=new Set([...db.insumos.filter(i=>setorDe(i)===setor).map(i=>i.id),...Object.keys(ent),...Object.keys(sai),...(abertura?Object.keys(abertura):[]),...(cont?Object.keys(cont):[])]);
  const rows=[];
  ids.forEach(id=>{ const i=byId(db.insumos,id); if(!i) return;
    const ini=abertura?(abertura[id]||0):0, e=ent[id]||0, s=sai[id]||0;
    const esperada=ini+e-s, contada=cont?(cont[id]||0):0;
    const desvio=cont?(esperada-contada):0, custo=num(i.custoMedio);
    rows.push({id,nome:i.nome,marca:i.marca,unidade:i.unidade,ini,entradas:e,saidas:s,esperada,contada,desvio,desvioR:desvio*custo,baseR:s*custo,temCont:cont!=null});
  });
  return {data:dataISO,prev,temContagem:cont!=null,rows:rows.sort((a,b)=>a.nome.localeCompare(b.nome))};
}
/* Agrega desvios (via fechamentos) num período */
function desvioPeriodo(mode){
  const dias=datasComContagem().filter(d=>inPeriod(d,mode));
  const agg={};
  dias.forEach(d=>{ reconcileDia(d).rows.forEach(r=>{ const a=agg[r.id]=agg[r.id]||{id:r.id,nome:r.nome,unidade:r.unidade,enviado:0,teorico:0,perdas:0,desvio:0,desvioR:0}; a.enviado+=r.enviado;a.teorico+=r.teorico;a.perdas+=r.perdas;a.desvio+=r.desvio;a.desvioR+=r.desvioR; }); });
  return {dias,rows:Object.values(agg).sort((a,b)=>Math.abs(b.desvioR)-Math.abs(a.desvioR))};
}
/* Desvio de um setor (bar/limpeza/descartáveis) num período, via reconcileSetorDia */
function desvioPeriodoSetor(mode,setor){
  const dias=datasComContagem(setor).filter(d=>inPeriod(d,mode));
  const agg={};
  dias.forEach(d=>{ reconcileSetorDia(d,setor).rows.forEach(r=>{ const a=agg[r.id]=agg[r.id]||{id:r.id,nome:r.nome,unidade:r.unidade,entradas:0,saidas:0,desvio:0,desvioR:0,baseR:0}; a.entradas+=r.entradas;a.saidas+=r.saidas;a.desvio+=r.desvio;a.desvioR+=r.desvioR;a.baseR+=(r.baseR||0); }); });
  return {dias,rows:Object.values(agg).sort((a,b)=>Math.abs(b.desvioR)-Math.abs(a.desvioR))};
}
/* Dias do período com movimento mas sem fechamento registrado */
function diasSemContagem(mode){
  const fluxo=new Set();
  db.movimentacoes.filter(m=>m.tipo==="saida"&&setorDe(m)==="cozinha"&&inPeriod(m.data,mode)).forEach(m=>fluxo.add(m.data));
  (db.producoes||[]).filter(pr=>inPeriod(pr.data,mode)).forEach(pr=>fluxo.add(pr.data));
  const cc=new Set(datasComContagem());
  return [...fluxo].filter(d=>!cc.has(d)).sort();
}

function cotTotais(c){
  const res=c.respostas||{}; const out=[];
  (c.fornecedorIds||[]).forEach(fid=>{ const arr=res[fid]; if(!arr) return;
    let tot=0, completo=true;
    (c.itens||[]).forEach((it,idx)=>{ const p=num(arr[idx]); if(p>0) tot+=p*num(it.qtd); else completo=false; });
    const f=byId(db.fornecedores,fid); out.push({fid,nome:f?f.nome:"—",total:tot,completo});
  });
  return out;
}
function melhorFornecedor(c){ const t=cotTotais(c).filter(x=>x.completo&&x.total>0); if(!t.length) return null; return t.sort((a,b)=>a.total-b.total)[0]; }

function cotaStatus(c){ return COTA_STATUS[c.status||"rascunho"]||COTA_STATUS.rascunho; }
function cotaAcoes(c){ const arr=COTA_FLOW[c.status||"rascunho"]||[]; return arr.filter(a=>a.roles.includes(state.user.nivel)); }
function cotaMove(id,to){
  const c=byId(db.cotacoes,id); if(!c) return;
  // persiste os preços digitados (se o modal estiver aberto)
  const qinp=document.querySelectorAll(".ct-q");
  if(qinp.length){ const res={}; qinp.forEach(inp=>{const fid=inp.getAttribute("data-fid");const ix=+inp.getAttribute("data-idx");const v=inp.value===""?null:num(inp.value); if(!res[fid])res[fid]=[]; res[fid][ix]=v;}); c.respostas=res; }
  const def=(COTA_FLOW[c.status||"rascunho"]||[]).find(a=>a.to===to); if(!def) return;
  if(!def.roles.includes(state.user.nivel)){ toast("Sua função não pode executar esta etapa.","err"); return; }
  if(def.need==="fornecedor" && !c.fornecedorEscolhido){ toast("Escolha o fornecedor vencedor antes de submeter.","err"); return; }
  let obs="";
  if(def.obs){ obs=(window.prompt(def.label+" — observação (opcional):","")||"").trim(); }
  const de=c.status||"rascunho";
  if(def.effect==="receber"){ cotaReceber(c); }
  c.status=to;
  if(to==="pedido_emitido"){ c.pedido={data:todayISO(),userId:state.user.id}; }
  if(to==="recebido"){ c.recebimento={data:todayISO(),userId:state.user.id,obs}; }
  if(to==="liberado_pagamento"){ c.pagamento={data:todayISO(),userId:state.user.id,obs}; }
  c.historico=c.historico||[]; c.historico.push({ts:Date.now(),data:todayISO(),userId:state.user.id,de,para:to,obs});
  save(); toast("Etapa registrada: "+ (COTA_STATUS[to]?COTA_STATUS[to].label:to) +".","ok");
  openCotacao(id);
}
/* Recebimento: dá entrada no estoque e atualiza custo médio pelo preço do fornecedor escolhido */
function cotaReceber(c){
  const fid=c.fornecedorEscolhido; const arr=(c.respostas||{})[fid]||[];
  (c.itens||[]).forEach((it,idx)=>{
    const i=byId(db.insumos,it.insumoId); if(!i) return;
    const qtd=num(it.qtd); if(qtd<=0) return;
    const preco=num(arr[idx]);
    // custo médio ponderado (se houver preço do fornecedor)
    if(preco>0){ const estAnt=num(i.estoque); const custoAnt=num(i.custoMedio); const novo=estAnt+qtd; i.custoMedio = novo>0 ? (estAnt*custoAnt + qtd*preco)/novo : preco; }
    // entrada no estoque (respeita lotes)
    if(temLotes(i)) addLote(i,qtd,""); else i.estoque=num(i.estoque)+qtd;
    db.movimentacoes.push({id:uid(),data:todayISO(),tipo:"entrada",insumoId:i.id,qtd,setor:setorDe(i),obs:"Recebimento — "+(c.nome||"cotação"),usuarioId:state.user.id});
  });
}

function printCotacao(id){
  const c=byId(db.cotacoes,id); if(!c) return;
  const emp=(db.config&&db.config.empresa)||"Estabelecimento";
  const suppliers=(c.fornecedorIds||[]).map(fid=>byId(db.fornecedores,fid)).filter(Boolean);
  const respostas=c.respostas||{};
  const grupos={}; (c.itens||[]).forEach((it,idx)=>{const i=byId(db.insumos,it.insumoId);const s=i?setorDe(i):"cozinha";(grupos[s]=grupos[s]||[]).push({it,idx,i});});
  const secOrdem=Object.keys(SETORES).filter(s=>grupos[s]);
  const totS={}; suppliers.forEach(f=>totS[f.id]=0);
  let body="";
  secOrdem.forEach(s=>{
    body+=`<tr class="grp"><td colspan="${2+suppliers.length}"><b>${setorInfo(s).ic} ${esc(setorInfo(s).label)}</b></td></tr>`;
    const sub={}; suppliers.forEach(f=>sub[f.id]=0);
    grupos[s].forEach(({it,idx,i})=>{
      body+=`<tr><td>${esc(i?i.nome:"—")}${i&&i.marca?" ("+esc(i.marca)+")":""}</td><td class="r">${NUM(it.qtd)} ${esc(i?i.unidade:"")}</td>${suppliers.map(f=>{const p=num((respostas[f.id]||[])[idx]); if(p>0) sub[f.id]+=p*num(it.qtd); return `<td class="r">${p>0?BRL(p):"—"}</td>`;}).join("")}</tr>`;
    });
    body+=`<tr class="tot"><td colspan="2">Subtotal ${esc(setorInfo(s).label)}</td>${suppliers.map(f=>{totS[f.id]+=sub[f.id];return `<td class="r">${sub[f.id]>0?BRL(sub[f.id]):"—"}</td>`;}).join("")}</tr>`;
  });
  let best=Infinity,bestFid=null; Object.entries(totS).forEach(([fid,t])=>{if(t>0&&t<best){best=t;bestFid=fid;}});
  const totalRow=`<tr class="tot"><td colspan="2"><b>TOTAL GERAL</b></td>${suppliers.map(f=>`<td class="r"><b>${totS[f.id]>0?BRL(totS[f.id]):"—"}</b>${f.id===bestFid?" ✔":""}</td>`).join("")}</tr>`;
  const st=cotaStatus(c);
  const escolhido=c.fornecedorEscolhido?((byId(db.fornecedores,c.fornecedorEscolhido)||{}).nome||""):"";
  const html=`<div class="rep">
    <h1>${esc(emp)}</h1><div class="rep-sub">Mapa Comparativo de Cotação — ${esc(c.nome||"")}</div>
    <div class="rep-meta"><span><b>Data:</b> ${fmtDate(c.data)}</span><span><b>Etapa:</b> ${esc(st.label)}</span><span><b>Fornecedor escolhido:</b> ${esc(escolhido||"—")}</span><span><b>Menor total:</b> ${bestFid?esc((byId(db.fornecedores,bestFid)||{}).nome||""):"—"}</span></div>
    <table><thead><tr><th>Item</th><th class="r">Qtd</th>${suppliers.map(f=>`<th class="r">${esc(f.nome)}${f.id===c.fornecedorEscolhido?" ★":""}</th>`).join("")}</tr></thead>
    <tbody>${body||`<tr><td colspan="${2+suppliers.length}">Sem itens.</td></tr>`}${totalRow}</tbody></table>
    <div class="sig"><div class="line">Compras</div><div class="line">Gerência</div></div>
    <div class="foot">Kitchen Sync — mapa comparativo gerado automaticamente.</div>
  </div>`;
  let area=document.getElementById("print-area"); if(!area){area=document.createElement("div");area.id="print-area";document.body.appendChild(area);}
  area.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing"); if(window.removeEventListener)window.removeEventListener("afterprint",done);};
  if(window.addEventListener)window.addEventListener("afterprint",done);
  try{if(typeof window.print==="function")window.print();}catch(e){}
  setTimeout(()=>document.body.classList.remove("printing"),2000);
}

function updateCotComparacao(){
  const wrap=document.getElementById("ct-table"); if(!wrap) return;
  const rows=[...wrap.querySelectorAll("tbody tr[data-qty]")];
  const totals={}; wrap.querySelectorAll(".ct-tot").forEach(td=>totals[td.getAttribute("data-fid")]=0);
  const subt={}; wrap.querySelectorAll(".ct-subtot").forEach(td=>{const s=td.getAttribute("data-sec"),f=td.getAttribute("data-fid");(subt[s]=subt[s]||{})[f]=0;});
  rows.forEach(tr=>{ const inputs=[...tr.querySelectorAll(".ct-q")]; const qty=num(tr.getAttribute("data-qty")); const sec=tr.getAttribute("data-sec");
    let min=Infinity; inputs.forEach(inp=>{const v=num(inp.value); if(v>0&&v<min)min=v;});
    inputs.forEach(inp=>{const v=num(inp.value); inp.style.background=(v>0&&v===min)?"var(--basil-soft)":""; if(v>0){const f=inp.getAttribute("data-fid"); totals[f]+=v*qty; if(subt[sec]&&subt[sec][f]!=null) subt[sec][f]+=v*qty;}});
  });
  wrap.querySelectorAll(".ct-subtot").forEach(td=>{const s=td.getAttribute("data-sec"),f=td.getAttribute("data-fid"); const t=(subt[s]&&subt[s][f])||0; td.textContent=t>0?BRL(t):"—";});
  let best=Infinity,bestFid=null; Object.entries(totals).forEach(([fid,t])=>{if(t>0&&t<best){best=t;bestFid=fid;}});
  wrap.querySelectorAll(".ct-tot").forEach(td=>{const fid=td.getAttribute("data-fid");const t=totals[fid];td.textContent=t>0?BRL(t):"—";td.style.color=(fid===bestFid)?"var(--basil)":"";td.style.background=(fid===bestFid)?"var(--basil-soft)":"";});
}

function printSaidaSetor(dataISO, setor){
  setor=setor||"cozinha"; const S=SETORES[setor]||SETORES.cozinha;
  const data=dataISO||todayISO();
  const emp=(db.config&&db.config.empresa)||"Estabelecimento";
  const map={};
  db.movimentacoes.filter(m=>m.tipo==="saida"&&m.data===data&&setorDe(m)===setor).forEach(m=>{map[m.insumoId]=(map[m.insumoId]||0)+num(m.qtd);});
  const rows=Object.entries(map).map(([id,q])=>{const i=byId(db.insumos,id)||{};return {nome:i.nome||"—",un:i.unidade||"",marca:i.marca||"",q};}).sort((a,b)=>a.nome.localeCompare(b.nome));
  const html=`<div class="rep">
    <h1>${esc(emp)}</h1><div class="rep-sub">Lista de Saída — ${esc(S.label)}</div>
    <div class="rep-meta"><span><b>Data:</b> ${fmtDate(data)}</span><span><b>Emitido em:</b> ${fmtDate(todayISO())}</span><span><b>Itens:</b> ${rows.length}</span></div>
    <table><thead><tr><th>Item</th><th>Marca</th><th class="r">Quantidade</th><th style="width:90px">Conferido</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.marca||"—")}</td><td class="r">${NUM(r.q)} ${esc(r.un)}</td><td></td></tr>`).join(""):`<tr><td colspan="4">Sem saídas registradas neste dia.</td></tr>`}</tbody></table>
    <div class="sig"><div class="line">Entregue por (estoque)</div><div class="line">Recebido por (${esc(S.label)})</div></div>
    <div class="foot">Kitchen Sync — lista gerada automaticamente.</div></div>`;
  let area=document.getElementById("print-area"); if(!area){area=document.createElement("div");area.id="print-area";document.body.appendChild(area);}
  area.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing"); if(window.removeEventListener)window.removeEventListener("afterprint",done);};
  if(window.addEventListener)window.addEventListener("afterprint",done);
  try{if(typeof window.print==="function")window.print();}catch(e){}
  setTimeout(()=>document.body.classList.remove("printing"),2000);
}

  </div>
  <div class="card"><div class="card-body flush"><div class="tbl-wrap">
    <table class="tbl"><thead><tr>
      <th>Item</th><th class="r">Sobra anterior</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Sobra esperada</th><th class="r">Sobra contada</th><th class="r">Desvio</th>

function updateFechBarTotals(){
  const rows=document.querySelectorAll("tr[data-ins][data-esp]");
  const setor=state.fechSetorAtual||"bar";
  let tot=0;
  rows.forEach(tr=>{ const esp=num(tr.getAttribute("data-esp")), custo=num(tr.getAttribute("data-custo")), base=num(tr.getAttribute("data-base"));
    const inp=tr.querySelector(".fcb-in"); if(!inp) return;
    const contada=inp.value===""?0:num(inp.value);
    const desv=esp-contada, desvR=desv*custo; tot+=desvR;
    const fl=setorFlag(desvR,base,setor);
    const cell=tr.querySelector(".fcb-desv"); if(cell) cell.innerHTML=`<span class="pill ${fl.cls}">${(desv>0?"+":"")+BRL(desvR)}</span>`;
  });
  const t=document.querySelector("#fechbar-total"); if(t) t.textContent=(tot>0?"+":"")+BRL(tot);
}
function printFechamentoSetor(setor){
  setor=setor||"bar"; const S=setorInfo(setor);
  const data=state.fechBarData||todayISO();
  const rc=reconcileSetorDia(data,setor);
  const cont=contagemMapa(data,setor);
  const emp=(db.config&&db.config.empresa)||"Estabelecimento";
  let totDesvR=0;
  const linhas=rc.rows.map(r=>{const i=byId(db.insumos,r.id)||{};const un=i.unidade||"";const dr=r.desvio*num(i.custoMedio);totDesvR+=dr;return `<tr><td>${esc(r.nome)}</td><td class="r">${NUM(r.ini)} ${esc(un)}</td><td class="r">${NUM(r.entradas)}</td><td class="r">${NUM(r.saidas)}</td><td class="r">${NUM(r.esperada)}</td><td class="r">${NUM(r.contada)}</td><td class="r ${r.desvio>0?'neg':''}">${(r.desvio>0?"+":"")+NUM(r.desvio)} ${esc(un)} (${(dr>0?"+":"")+BRL(dr)})</td></tr>`;}).join("");
  const html=`<div class="rep">
    <h1>${esc(emp)}</h1>
    <div class="rep-sub">Relatório de Fechamento — ${esc(S.label)}</div>
    <div class="rep-meta"><span><b>Data:</b> ${fmtDate(data)}</span><span><b>Emitido em:</b> ${fmtDate(todayISO())}</span><span><b>Situação:</b> ${cont?"Fechado (contagem registrada)":"NÃO FECHADO"}</span><span><b>Fechado por:</b> ${esc(contagemDe(data,setor)?nomeUsuario(contagemDe(data,setor).usuarioId):"—")}</span><span><b>Desvio total:</b> ${(totDesvR>0?"+":"")+BRL(totDesvR)}</span></div>
    <h2>Conciliação — ${esc(S.label)}</h2>
    <table><thead><tr><th>Item</th><th class="r">Sobra ant.</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Desvio</th></tr></thead>
    <tbody>${linhas||`<tr><td colspan="7">Sem movimento neste dia.</td></tr>`}</tbody>
    <tfoot><tr class="tot"><td colspan="6">Desvio total do dia (R$)</td><td class="r">${(totDesvR>0?"+":"")+BRL(totDesvR)}</td></tr></tfoot></table>
    <div class="sig"><div class="line">Conferente da contagem</div><div class="line">Gerente</div></div>
    <div class="foot">Kitchen Sync — relatório gerado automaticamente.</div>
  </div>`;
  let area=document.getElementById("print-area"); if(!area){area=document.createElement("div");area.id="print-area";document.body.appendChild(area);}
  area.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing"); if(window.removeEventListener)window.removeEventListener("afterprint",done);};
  if(window.addEventListener)window.addEventListener("afterprint",done);
  try{if(typeof window.print==="function")window.print();}catch(e){}
  setTimeout(()=>document.body.classList.remove("printing"),2000);
}

/* ============================================================
   MARGENS & KPIs (gestão baseada em dados)
   ============================================================ */
function comissaoVenda(v){
  const canal=(v.canal||"").toLowerCase();
  if(canal.indexOf("ifood")>=0){
    return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); const tx=p?(num(p.ifCom)+num(p.ifTx)+num(p.ifAnt)):0; return s+num(it.qtd)*num(it.preco)*tx/100; },0);
  }
  const pag=(v.pagamento||"").toLowerCase();
  if(pag.indexOf("cart")>=0){
    return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); const tx=(p&&p.cartao!=null)?num(p.cartao):num((db.config&&db.config.cartaoPadrao)||0); return s+num(it.qtd)*num(it.preco)*tx/100; },0);
  }
  return 0;
}
function kpisPeriodo(mode){
  const vendas=db.vendas.filter(v=>inPeriod(v.data,mode));
  const receita=vendas.reduce((s,v)=>s+vendaTotal(v),0);
  const cmvTeorico=vendas.reduce((s,v)=>s+vendaCMV(v),0);
  const imp=num(db.config.impostoPercent)/100;
  const impostos=receita*imp;
  const comissoes=vendas.reduce((s,v)=>s+comissaoVenda(v),0);
  const mc=receita-cmvTeorico-impostos-comissoes;
  let desvioR=0; desvioPeriodo(mode).rows.forEach(r=>desvioR+=r.desvioR);
  Object.keys(SETORES).filter(s=>SETORES[s].fechamento).forEach(s=>{ desvioPeriodoSetor(mode,s).rows.forEach(r=>desvioR+=r.desvioR); });
  const perdas=(db.perdas||[]).filter(p=>inPeriod(p.data,mode)).reduce((s,p)=>s+perdaValor(p),0);
  const vazamento=Math.max(0,desvioR)+perdas;
  const cmvTeoricoPct=receita>0?cmvTeorico/receita*100:0;
  const variacaoPct=receita>0?vazamento/receita*100:0;
  const cmvRealPct=cmvTeoricoPct+variacaoPct;
  const mcPct=receita>0?mc/receita*100:0;
  const nped=vendas.length;
  const pessoas=vendas.reduce((s,v)=>s+num(v.pessoas),0);
  const porConc={};
  vendas.forEach(v=>{ (v.itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); const cn=p?conceitoDe(p):"Geral"; const o=porConc[cn]=porConc[cn]||{conceito:cn,receita:0,cmv:0,qtd:0}; o.receita+=num(it.qtd)*num(it.preco); o.cmv+=num(it.qtd)*custoProduto(p); o.qtd+=num(it.qtd); }); });
  Object.values(porConc).forEach(o=>{ o.impostos=o.receita*imp; o.mc=o.receita-o.cmv-o.impostos; o.cmvPct=o.receita>0?o.cmv/o.receita*100:0; o.mcPct=o.receita>0?o.mc/o.receita*100:0; o.part=receita>0?o.receita/receita*100:0; });
  const porCanal={};
  vendas.forEach(v=>{ const cn=v.canal||"Balcão"; const o=porCanal[cn]=porCanal[cn]||{canal:cn,receita:0,cmv:0,comissoes:0,nped:0}; o.receita+=vendaTotal(v); o.cmv+=vendaCMV(v); o.comissoes+=comissaoVenda(v); o.nped++; });
  Object.values(porCanal).forEach(o=>{ o.impostos=o.receita*imp; o.mc=o.receita-o.cmv-o.impostos-o.comissoes; o.mcPct=o.receita>0?o.mc/o.receita*100:0; o.part=receita>0?o.receita/receita*100:0; });
  return {vendas,receita,cmvTeorico,impostos,comissoes,mc,mcPct,cmvTeoricoPct,variacaoPct,cmvRealPct,vazamento,desvioR,perdas,nped,pessoas,
    ticketPed:nped>0?receita/nped:0, ticketPes:pessoas>0?receita/pessoas:0,
    porConc:Object.values(porConc).sort((a,b)=>b.receita-a.receita),
    porCanal:Object.values(porCanal).sort((a,b)=>b.receita-a.receita)};
}
function menuEngineering(mode){
  const vendas=db.vendas.filter(v=>inPeriod(v.data,mode));
  const agg={};
  vendas.forEach(v=>(v.itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); if(!p) return; const a=agg[p.id]=agg[p.id]||{id:p.id,nome:p.nome,conceito:conceitoDe(p),qtd:0,receita:0,custo:0}; a.qtd+=num(it.qtd); a.receita+=num(it.qtd)*num(it.preco); a.custo+=num(it.qtd)*custoProduto(p); }));
  const rows=Object.values(agg); if(!rows.length) return {rows:[]};
  rows.forEach(r=>{ r.mcUnit=r.qtd>0?(r.receita-r.custo)/r.qtd:0; });
  const med=arr=>{const a=arr.slice().sort((x,y)=>x-y);return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0;};
  const medQ=med(rows.map(r=>r.qtd)), medM=med(rows.map(r=>r.mcUnit));
  rows.forEach(r=>{ const altaPop=r.qtd>=medQ, altaMar=r.mcUnit>=medM; r.classe=altaPop&&altaMar?"Estrela":altaPop&&!altaMar?"Cavalo de batalha":!altaPop&&altaMar?"Enigma":"Abacaxi"; r.cls=altaPop&&altaMar?"green":altaPop&&!altaMar?"amber":!altaPop&&altaMar?"gray":"red"; });
  return {rows:rows.sort((a,b)=>b.receita-a.receita),medQ,medM};
}
function salaoKpis(mode){
  const cfg=db.config||{};
  const mesas=num(cfg.numMesas)||0, lugares=num(cfg.lugares)||0, horasDia=num(cfg.horasDia)||0;
  const vs=db.vendas.filter(v=>inPeriod(v.data,mode) && (v.canal||"Balcão")==="Salão");
  const receitaSalao=vs.reduce((s,v)=>s+vendaTotal(v),0);
  const pessoas=vs.reduce((s,v)=>s+num(v.pessoas),0);
  const diaDe=ts=>{ try{ return new Date(ts).toISOString().slice(0,10); }catch(e){ return ""; } };
  const cds=(db.comandas||[]).filter(c=>c.status==="fechada"&&c.fechamento&&inPeriod(diaDe(c.fechamento),mode));
  const comandas=cds.length;
  const perms=cds.map(c=>(c.fechamento-c.abertura)/60000).filter(m=>m>0&&m<24*60);
  const permMin=perms.length?perms.reduce((a,b)=>a+b,0)/perms.length:0;
  const dias=new Set(); vs.forEach(v=>dias.add(v.data)); cds.forEach(c=>dias.add(diaDe(c.fechamento)));
  const diasOper=Math.max(1,dias.size);
  const giro= mesas>0 ? comandas/(mesas*diasOper) : (comandas>0?comandas/diasOper:0);
  const seatHours=lugares*horasDia*diasOper;
  const revpash= seatHours>0 ? receitaSalao/seatHours : 0;
  return {mesas,lugares,horasDia,receitaSalao,pessoas,comandas,permMin,diasOper,giro,revpash,ticketPes:pessoas>0?receitaSalao/pessoas:0,temMesas:(mesas>0||lugares>0)};
}

function formUser(u){
  const cloud = !!cloudActive();
  u=u||{ativo:true,nivel:"operacao"};
  openModal("Funcionário",`
    <div class="form-grid">
      <div class="field full"><label>Nome completo *</label><input class="input" id="u-nome" value="${esc(u.nome||"")}"></div>
      ${cloud
        ? `<div class="field full"><label>E-mail (conta de acesso)</label><input class="input" id="u-login" value="${esc(u.login||"")}" readonly style="opacity:.65"></div>`
        : `<div class="field"><label>Login *</label><input class="input" id="u-login" value="${esc(u.login||"")}"></div>
           <div class="field"><label>Senha ${u.id?"(deixe em branco p/ manter)":"*"}</label><input class="input" id="u-senha" type="text" placeholder="${u.id?"••••••":""}"></div>`}
      <div class="field"><label>Função *</label><select class="input" id="u-nivel">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.nivel===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>Salário mensal (R$)</label><input class="input" id="u-sal" type="number" step="0.01" value="${u.salario!=null?u.salario:0}"></div>
      <div class="field"><label>Telefone</label><input class="input" id="u-tel" value="${esc(u.tel||"")}"></div>
      <div class="field"><label class="inl"><input type="checkbox" id="u-ativo" ${u.ativo!==false?"checked":""}> Acesso ativo</label></div>
    </div>
    <div class="muted" style="font-size:12px" id="u-role-desc">${esc(ROLES_DESC[u.nivel]||"")}</div>`,
    ()=>{ const nome=$("#u-nome").value.trim();
      if(!nome){toast("Informe o nome.","err");return false;}
      if(cloud){
        if(!u.id){ toast("Novos usuários entram com a própria conta; eles aparecem aqui após o primeiro acesso.","err"); return false; }
        const ex=byId(db.usuarios,u.id); Object.assign(ex,{nome,nivel:$("#u-nivel").value,salario:num($("#u-sal").value),tel:$("#u-tel").value.trim(),ativo:$("#u-ativo").checked}); if(ex.id===state.user.id)state.user=ex;
        save(); toast("Acesso atualizado.","ok"); return true;
      }
      const login=$("#u-login").value.trim().toLowerCase(),senha=$("#u-senha").value;
      if(!login){toast("Informe o login.","err");return false;}
      if(db.usuarios.some(x=>(x.login||"").toLowerCase()===login&&x.id!==u.id)){toast("Já existe usuário com esse login.","err");return false;}
      if(!u.id&&!senha){toast("Defina uma senha.","err");return false;}
      const o={nome,login,nivel:$("#u-nivel").value,salario:num($("#u-sal").value),tel:$("#u-tel").value.trim(),ativo:$("#u-ativo").checked};
      if(u.id){const ex=byId(db.usuarios,u.id);Object.assign(ex,o);if(senha)ex.senha=senha;if(ex.id===state.user.id)state.user=ex;}
      else{o.id=uid();o.senha=senha;db.usuarios.push(o);}
      save(); toast("Funcionário salvo.","ok"); return true; });
}

      const nome=$("#uc-nome").value.trim();
      const email=($("#uc-email").value||"").trim().toLowerCase();
      const senha=$("#uc-senha").value||"";
      const nivel=$("#uc-nivel").value;
      const salario=num($("#uc-sal").value);
      const tel=$("#uc-tel").value.trim();
      if(!nome){toast("Informe o nome.","err");return false;}
      if(!email||email.indexOf("@")<1){toast("Informe um e-mail válido.","err");return false;}
      if(senha.length<6){toast("A senha provisória precisa ter ao menos 6 caracteres.","err");return false;}
      if(db.usuarios.some(x=>(x.login||"").toLowerCase()===email)){toast("Já existe um funcionário com esse e-mail.","err");return false;}
      let resp;
      try{
        resp=await SB.client.functions.invoke("admin-create-user",{body:{email,password:senha}});
      }catch(e){ toast("Não foi possível criar agora (sem conexão com o servidor).","err"); return false; }
      const data=resp&&resp.data, error=resp&&resp.error;
      if(error){
        let msg="Falha ao criar a conta.";
        try{ if(error.context&&error.context.json){ const j=await error.context.json(); if(j&&j.error) msg=j.error; } }catch(_){}
        if(msg==="Falha ao criar a conta." && error.message) msg=error.message;
        toast(msg,"err"); return false;
      }
      if(data&&data.error){ toast(data.error,"err"); return false; }
      const newId=data&&data.id;
      if(!newId){ toast("Resposta inesperada do servidor.","err"); return false; }
      if(!db.usuarios.some(x=>x.id===newId)){
        db.usuarios.push({id:newId,login:email,senha:"",nome,nivel,salario,tel,ativo:true,cloud:true});
      }
      save();
      toast("Funcionário criado. Ele já pode entrar com o e-mail e a senha provisória.","ok");
      return true;
    });
  setTimeout(()=>{ const s=$("#uc-nivel"); const d=$("#uc-role-desc"); if(s&&d){ s.addEventListener("change",()=>{ d.textContent=ROLES_DESC[s.value]||""; }); } },0);
}

/* ============================================================
   MODAL system
   ============================================================ */
let modalSave=null;
function openModal(title,body,onSave,size,readonly){
  const ex=$("#modal"); if(ex) ex.remove();
  modalSave=onSave;
  const foot = readonly
    ? `<button class="btn" data-act="modal-close">Fechar</button>`
    : `<button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="modal-save">Salvar</button>`;
  const wrap=document.createElement("div");
  wrap.className="backdrop"; wrap.id="modal";
  wrap.innerHTML=`<div class="modal ${size==="wide"?"wide":""}">
    <div class="modal-head"><h3>${esc(title)}</h3><div class="spacer"></div><button class="btn icon ghost" data-act="modal-close">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("mousedown",e=>{ if(e.target===wrap) closeModal(); });
  const first=wrap.querySelector("input,select,textarea"); if(first) setTimeout(()=>first.focus(),30);
}
function closeModal(){ const m=$("#modal"); if(m) m.remove(); modalSave=null; }
async function trySave(){ if(!modalSave){closeModal();return;} const btn=document.querySelector("#modal [data-act='modal-save']"); let prev; if(btn){ prev=btn.textContent; } let ok=modalSave(); if(ok&&typeof ok.then==="function"){ if(btn){ btn.disabled=true; btn.textContent="Aguarde…"; } try{ ok=await ok; }catch(e){ ok=false; } if(btn){ btn.disabled=false; if(prev!=null) btn.textContent=prev; } } if(ok!==false){ closeModal(); render(); } }

/* ---------- Toast ---------- */
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300);},2200); }

/* ---------- Confirm (simple) ---------- */
function confirmDel(msg,fn){ if(confirm(msg)){ fn(); save(); render(); } }

function afterRender(){
  const sb=$("#searchbox");

  const dm=$("#dre-month"); if(dm) dm.addEventListener("change",e=>{state.dreMonth=e.target.value;render();});
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-view]");
  if(nav){ state.view=nav.getAttribute("data-view"); state.search=""; state.sidebarOpen=false; render(); return; }
  const seg=e.target.closest("[data-seg] button");
  if(seg){ const key=seg.parentElement.getAttribute("data-seg"); state.period[key]=seg.getAttribute("data-p"); render(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.getAttribute("data-act"); const id=a.getAttribute("data-id"); const idx=a.getAttribute("data-idx"); const setor=a.getAttribute("data-setor")||"cozinha";
  switch(act){
    case "login": doLogin(); break;
    case "sb-login": doSbAuth(); break;
    case "sb-toggle": state.authMode = (state.authMode==="signup"?"login":"signup"); renderAuth(); break;
    case "reload": if(typeof location!=="undefined") location.reload(); break;
    case "logout":
      if(typeof SB!=="undefined" && SB.on){ if(confirm("Sair da conta?")){ SB.client.auth.signOut().then(()=>{ state.user=null; renderAuth(); }).catch(()=>{ state.user=null; renderAuth(); }); } }
      else if(confirm("Sair do sistema?")){ state.user=null; render(); }
      break;
    case "theme": toggleTheme(); break;
    case "open-side": state.sidebarOpen=true; render(); break;
    case "close-side": state.sidebarOpen=false; render(); break;
    case "modal-close": closeModal(); break;
    case "modal-save": trySave(); break;

    /* fornecedores */
    case "add-fornecedor": formFornecedor(); break;
    case "edit-fornecedor": formFornecedor(byId(db.fornecedores,id)); break;
    case "del-fornecedor": confirmDel("Excluir este fornecedor?",()=>{db.fornecedores=db.fornecedores.filter(x=>x.id!==id);}); break;

    /* insumos */
    case "add-insumo": formInsumo(); break;
    case "edit-insumo": formInsumo(byId(db.insumos,id)); break;
    case "del-insumo": confirmDel("Excluir este insumo?",()=>{db.insumos=db.insumos.filter(x=>x.id!==id);}); break;

    /* compras */
    case "add-compra": formCompra(); break;
    case "view-compra": viewCompra(id); break;
    case "del-compra": confirmDel("Excluir esta compra? (o estoque não será revertido automaticamente)",()=>{db.compras=db.compras.filter(x=>x.id!==id);}); break;
    case "add-item-compra": readDraftCompra(); draftItens.push({insumoId:db.insumos[0].id,qtd:1,custoUnit:db.insumos[0].custoMedio||0}); renderDraftCompra(); break;
    case "rm-item-compra": readDraftCompra(); draftItens.splice(+idx,1); renderDraftCompra(); break;

    /* movimentacao */
    case "mov-entrada": formMov("entrada", setor); break;
    case "mov-saida": formMov("saida", setor); break;
    case "print-saida": printSaidaSetor(null, setor); break;

    /* cotações */
    case "add-cotacao": if(can("cotacoes"))formCotacao(); break;
    case "open-cotacao": openCotacao(id); break;
    case "cota-move": cotaMove(id, a.getAttribute("data-to")); break;
    case "print-cotacao": printCotacao(id); break;
    case "del-cotacao": confirmDel("Excluir esta cotação?",()=>{db.cotacoes=db.cotacoes.filter(x=>x.id!==id);}); break;
    case "add-item-cota": { readDraftCota(); const pool=db.insumos.filter(x=>cotaFiltro==="todos"||setorDe(x)===cotaFiltro); const def=(pool[0]||db.insumos[0]); draftCota.push({insumoId:def.id,qtd:1}); renderDraftCota(); } break;
    case "add-setor-cota": { readDraftCota(); if(cotaFiltro==="todos"){toast("Escolha um setor para adicionar todos.","err");break;} const jah=new Set(draftCota.map(x=>x.insumoId)); const novos=db.insumos.filter(x=>setorDe(x)===cotaFiltro && !jah.has(x.id)); if(!novos.length){toast("Nenhum item novo neste setor.","err");break;} novos.forEach(x=>{ const falta=num(x.minimo)-num(x.estoque); draftCota.push({insumoId:x.id, qtd: falta>0?Math.ceil(falta):1}); }); renderDraftCota(); toast(novos.length+" item(ns) do setor "+setorInfo(cotaFiltro).label+" adicionados.","ok"); } break;
    case "rm-item-cota": readDraftCota(); draftCota.splice(+idx,1); renderDraftCota(); break;
    case "add-lote": readDraftLotes(); draftLotes.push({id:uid(),qtd:1,validade:""}); renderDraftLotes(); break;
    case "rm-lote": readDraftLotes(); draftLotes.splice(+idx,1); renderDraftLotes(); break;
    case "del-mov": confirmDel("Estornar esta movimentação? O estoque será revertido.",()=>{const m=byId(db.movimentacoes,id);if(m){const ins=byId(db.insumos,m.insumoId);if(ins){ if(temLotes(ins)){ if(m.tipo==="saida"){ addLote(ins,num(m.qtd),""); } else { reduzirLotePorId(ins,m.loteId,num(m.qtd)); } } else { ins.estoque=num(ins.estoque)+(m.tipo==="saida"?num(m.qtd):-num(m.qtd)); } }}db.movimentacoes=db.movimentacoes.filter(x=>x.id!==id);}); break;

    /* fechamento diário */
    case "save-fechamento": { if(!can("fechamento"))break; const data=state.fechData||todayISO();
      const itens=[...document.querySelectorAll(".fc-in")].map(inp=>({insumoId:inp.getAttribute("data-ins"),qtd:inp.value===""?0:num(inp.value)}));
      db.contagens=(db.contagens||[]).filter(c=>!(c.data===data&&setorDe(c)==="cozinha"));
      db.contagens.push({id:uid(),data,setor:"cozinha",itens,obs:"",usuarioId:state.user.id});
      save(); toast("Fechamento do dia "+fmtDate(data)+" salvo.","ok"); render(); } break;
    case "print-fechamento": printFechamento(); break;
    case "save-fechamento-bar": { if(!(can(setor)||can("fechamento")))break; const data=state.fechBarData||todayISO();
      const itens=[...document.querySelectorAll(".fcb-in")].map(inp=>({insumoId:inp.getAttribute("data-ins"),qtd:inp.value===""?0:num(inp.value)}));
      db.contagens=(db.contagens||[]).filter(c=>!(c.data===data&&setorDe(c)===setor));
      db.contagens.push({id:uid(),data,setor,itens,obs:"",usuarioId:state.user.id});
      save(); toast("Fechamento ("+setorInfo(setor).label+") do dia "+fmtDate(data)+" salvo.","ok"); render(); } break;
    case "print-fechamento-bar": printFechamentoSetor(setor); break;

    /* perdas */
    case "add-perda": if(can("perdas"))formPerda(); break;
    case "del-perda": confirmDel("Excluir este registro de perda?",()=>{db.perdas=db.perdas.filter(x=>x.id!==id);}); break;

    /* produção */
    case "add-producao": if(can("producao"))formProducao(); break;
    case "del-producao": confirmDel("Excluir este registro de produção?",()=>{db.producoes=db.producoes.filter(x=>x.id!==id);}); break;

    /* produtos */
    case "add-produto": formProduto(); break;
    case "edit-produto": formProduto(byId(db.produtos,id)); break;
    case "del-produto": confirmDel("Excluir este produto?",()=>{db.produtos=db.produtos.filter(x=>x.id!==id);}); break;
    case "add-item-ficha": readDraftFicha(); draftItens.push({insumoId:db.insumos[0].id,qtd:1}); renderDraftFicha(); updatePrecPreview(); break;
    case "rm-item-ficha": readDraftFicha(); draftItens.splice(+idx,1); renderDraftFicha(); updatePrecPreview(); break;
    case "usar-preco-sugerido": { const s=window.__precSug||{}; if($("#p-preco")&&s.balcao) $("#p-preco").value=s.balcao; if($("#p-precoifood")&&s.ifood) $("#p-precoifood").value=s.ifood; toast("Preços sugeridos aplicados.","ok"); } break;

    /* vendas */
    case "nova-venda": if(can("vendas"))formVenda(); break;
    case "del-venda": confirmDel("Excluir esta venda?",()=>{const v=byId(db.vendas,id);if(v&&v.baixas)aplicarBaixas(v.baixas,1);db.vendas=db.vendas.filter(x=>x.id!==id);}); break;
    case "add-item-venda": readDraftVenda(); {const a2=db.produtos.filter(p=>p.ativo!==false);draftItens.push({produtoId:a2[0].id,qtd:1,preco:a2[0].preco});} renderDraftVenda(); break;
    case "rm-item-venda": readDraftVenda(); draftItens.splice(+idx,1); renderDraftVenda(); break;
    case "nova-comanda": if(can("comandas"))formComanda(); break;
    case "add-comanda-itens": addComandaItens(id); break;
    case "fechar-comanda": fecharComanda(id); break;
    case "del-comanda": confirmDel("Cancelar/excluir esta comanda? (não gera venda)",()=>{db.comandas=db.comandas.filter(x=>x.id!==id);}); break;
    case "export-vendas": exportVendas(); break;

    /* despesas */
    case "add-despesa": formDespesa(); break;
    case "edit-despesa": formDespesa(byId(db.despesas,id)); break;
    case "del-despesa": confirmDel("Excluir esta despesa?",()=>{db.despesas=db.despesas.filter(x=>x.id!==id);}); break;

    /* dre */
    case "export-dre": exportDRE(); break;
    case "export-desvios": exportDesvios(); break;
    case "export-vencimentos": exportVencimentos(); break;
    case "export-estoque": exportEstoqueSetor(); break;

    /* users */
    case "add-user": formUser(); break;
    case "add-user-cloud": formUserCloud(); break;
    case "edit-user": formUser(byId(db.usuarios,id)); break;
    case "del-user": confirmDel("Excluir este funcionário?",()=>{db.usuarios=db.usuarios.filter(x=>x.id!==id);}); break;

    /* config */
    case "save-config": db.config.empresa=$("#cf-empresa").value.trim()||"Meu estabelecimento"; db.config.impostoPercent=num($("#cf-imposto").value);
      { const v=$("#cf-validade"); if(v) db.config.validadeAlerta=Math.max(0,Math.round(num(v.value))); }
      { const b=$("#cf-baixavenc"); if(b) db.config.baixaVencidoAuto=b.checked; }
      { const lc=$("#cf-lim-cozinha"); if(lc) db.config.perdaLimite=num(lc.value); }
      db.config.desvioLimite=db.config.desvioLimite||{};
      { const x=$("#cf-lim-bar"); if(x) db.config.desvioLimite.bar=num(x.value); }
      { const x=$("#cf-lim-limpeza"); if(x) db.config.desvioLimite.limpeza=num(x.value); }
      { const x=$("#cf-lim-descartaveis"); if(x) db.config.desvioLimite.descartaveis=num(x.value); }
      { const x=$("#cf-conceitos"); if(x){ const arr=x.value.split(",").map(s=>s.trim()).filter(Boolean); if(arr.length) db.config.conceitos=arr; } }
      { const x=$("#cf-cartao"); if(x) db.config.cartaoPadrao=num(x.value); }
      { const x=$("#cf-metavar"); if(x) db.config.metaCmvVar=num(x.value); }
      { const x=$("#cf-metamar"); if(x) db.config.metaMargem=num(x.value); }
      { const x=$("#cf-metaprime"); if(x) db.config.metaPrime=num(x.value); }
      { const x=$("#cf-mesas"); if(x) db.config.numMesas=num(x.value); }
      { const x=$("#cf-lugares"); if(x) db.config.lugares=num(x.value); }
      { const x=$("#cf-horas"); if(x) db.config.horasDia=num(x.value); }
      save(); toast("Configurações salvas.","ok"); render(); break;
    case "export-all": download("backup-fornoecaixa-"+todayISO()+".json",JSON.stringify(db,null,2)); toast("Backup gerado.","ok"); break;
    case "reset-demo": if(confirm("Isto substitui TODOS os dados pelos dados de exemplo. Continuar?")){ db=seed(); save(); state.user=db.usuarios[0]; toast("Dados de exemplo recarregados.","ok"); render(); } break;
    case "wipe": if(confirm("Apagar TODOS os dados? Esta ação não pode ser desfeita.")){ db=seed(); db.fornecedores=[];db.insumos=[];db.produtos=[];db.compras=[];db.vendas=[];db.movimentacoes=[];db.producoes=[];db.perdas=[];db.contagens=[];db.cotacoes=[];db.despesas=[]; db.config.demo=false; save(); toast("Dados apagados (mantido o usuário admin).","ok"); render(); } break;
  }
});

/* ---------- Exports ---------- */
function exportVendas(){
  const rows=[["Data","Itens","Pagamento","CMV","Total"]];
  [...db.vendas].sort((a,b)=>a.data.localeCompare(b.data)).forEach(v=>{
    rows.push([fmtDate(v.data),(v.itens||[]).map(it=>{const p=byId(db.produtos,it.produtoId);return `${it.qtd}x ${p?p.nome:""}`;}).join(" | "),v.pagamento||"",vendaCMV(v).toFixed(2),vendaTotal(v).toFixed(2)]);
  });
  download("vendas-"+todayISO()+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"));
  toast("CSV de vendas gerado.","ok");
}
function exportDRE(){
  const ym=state.dreMonth;
  const vendasM=db.vendas.filter(v=>inMonth(v.data,ym));
  const receita=vendasM.reduce((s,v)=>s+vendaTotal(v),0);
  const imposto=receita*num(db.config.impostoPercent)/100;
  const cmv=vendasM.reduce((s,v)=>s+vendaCMV(v),0);
  const despTot=db.despesas.filter(d=>inMonth(d.data,ym)).reduce((s,d)=>s+num(d.valor),0);
  const folha=db.usuarios.filter(u=>u.ativo&&num(u.salario)>0).reduce((s,u)=>s+num(u.salario),0);
  const rows=[["DRE",ym],["Receita bruta",receita.toFixed(2)],["Impostos",(-imposto).toFixed(2)],["Receita liquida",(receita-imposto).toFixed(2)],["CMV",(-cmv).toFixed(2)],["Lucro bruto",(receita-imposto-cmv).toFixed(2)],["Despesas operacionais",(-despTot).toFixed(2)],["Folha",(-folha).toFixed(2)],["Resultado",(receita-imposto-cmv-despTot-folha).toFixed(2)]];
  download("dre-"+ym+".csv",rows.map(r=>r.join(";")).join("\n"));
  toast("CSV do DRE gerado.","ok");
}
function exportDesvios(){
  const mode=state.period.analises;
  const lab=mode==="dia"?"dia":mode==="mes"?"mes":mode==="ano"?"ano":"total";
  const rows=[["Setor","Item","Unidade","Entradas/Enviado","Saidas/Consumo","Perdas","Desvio (qtd)","Desvio (R$)"]];
  desvioPeriodo(mode).rows.forEach(r=>{rows.push(["Cozinha",r.nome,r.unidade||"",NUM(r.enviado),NUM(r.teorico),NUM(r.perdas),NUM(r.desvio),r.desvioR.toFixed(2)]);});
  Object.keys(SETORES).filter(k=>SETORES[k].fechamento).forEach(setor=>{
    desvioPeriodoSetor(mode,setor).rows.forEach(r=>{rows.push([setorInfo(setor).label,r.nome,r.unidade||"",NUM(r.entradas),NUM(r.saidas),"",NUM(r.desvio),r.desvioR.toFixed(2)]);});
  });
  if(rows.length===1){ toast("Sem fechamentos no período para exportar.","err"); return; }
  download("desvios-"+lab+"-"+todayISO()+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"));

function exportVencimentos(){
  const rows=[["Setor","Item","Marca","Validade","Dias","Quantidade","Unidade","Situacao"]];

  db.insumos.forEach(i=>lotesDe(i).forEach(l=>{ if(l.validade){ const d=diasAte(l.validade); lista.push({i,l,d}); } }));
  lista.sort((a,b)=>a.d-b.d);

/* ---------- Baixa automática de vencidos (registra perda "Vencido") ---------- */
function processarVencidos(){
  if(db.config && db.config.baixaVencidoAuto===false) return 0;
  let n=0;
  (db.insumos||[]).forEach(i=>{
    if(i.lotes && i.lotes.length){
      const vivos=[];
      i.lotes.forEach(l=>{ const dd=diasAte(l.validade); if(l.validade && dd!==null && dd<0 && num(l.qtd)>0){
        db.perdas=db.perdas||[]; db.perdas.push({id:uid(),data:l.validade,tipo:"insumo",insumoId:i.id,qtd:num(l.qtd),motivo:"Vencido",obs:"Baixa automática por vencimento (lote)",usuarioId:(state.user&&state.user.id)||null}); n++;
      } else { vivos.push(l); } });
      i.lotes=vivos; syncEstoqueLotes(i);
    } else {
      const dd=diasAte(i.validade);
      if(dd!==null && dd<0 && num(i.estoque)>0){
        db.perdas=db.perdas||[]; db.perdas.push({id:uid(),data:i.validade,tipo:"insumo",insumoId:i.id,qtd:num(i.estoque),motivo:"Vencido",obs:"Baixa automática por vencimento",usuarioId:(state.user&&state.user.id)||null});
        i.estoque=0; i.validade=""; n++;
      }
    }
  });
  if(n) save();
  return n;
}

/* ============================================================
   NUVEM — banco compartilhado (db) + identidade (user)
   Modo nuvem quando publicado; senão, modo local (localStorage).
   ============================================================ */
function emptyDb(){ return {config:{},usuarios:[],fornecedores:[],insumos:[],produtos:[],compras:[],movimentacoes:[],producoes:[],perdas:[],contagens:[],cotacoes:[],vendas:[],despesas:[],comandas:[]}; }
function cloudActive(){ if(typeof SB!=="undefined" && SB.on) return SB; if(typeof CLOUD!=="undefined" && CLOUD.on) return CLOUD; return null; }
function syncIndicatorHTML(){
  const A=cloudActive(); if(!A) return "";
  const map={idle:["gray","☁︎ nuvem"],syncing:["amber","⟳ sincronizando…"],synced:["green","☁︎ sincronizado"],error:["red","⚠︎ falha ao sincronizar"],offline:["red","⚠︎ sem conexão"]};
  const st=map[A.status]||map.idle;
  return `<span id="sync-ind" class="pill ${st[0]}" title="Dados compartilhados entre os aparelhos" style="margin-right:6px">${st[1]}</span>`;
}
const CLOUD = {
  on:false, db:null, user:null, uid:null, isOwner:false, canWrite:true, myName:"",
  cols:["config","usuarios","fornecedores","insumos","produtos","compras","movimentacoes","producoes","perdas","contagens","cotacoes","vendas","despesas","comandas"],
  hashes:{}, subs:[], pushTimer:null, status:"idle",
  docPath(c){ return "state/"+c; },
  hash(x){ try{ const s=JSON.stringify(x); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return s.length+":"+h; }catch(e){ return "e"+Math.random(); } },
  pack(c){ return c==="config" ? {config:db.config||{}} : {rows:db[c]||[]}; },
  unpack(c,data){ if(!data) return; if(c==="config"){ db.config=data.config||{}; } else { db[c]=Array.isArray(data.rows)?data.rows:[]; } },
  async init(){
    let cdb=null;
    try{ cdb = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }catch(e){ cdb=null; }
    if(!cdb) return false;
    this.db=cdb; this.on=true;
    try{ this.user = await window.claude.use("user"); }catch(e){ this.user=null; }
    return true;
  },
  async whoami(){
    if(this.user){
      try{ this.uid = await this.user.id(); }catch(e){}
      try{ this.isOwner = await this.user.isOwner(); }catch(e){}
      try{ const cw = await this.user.can("data.write"); this.canWrite = (cw!==false); }catch(e){}
      try{ const me = await this.user.me(); this.myName = (me&&me.name)||""; }catch(e){}
    }
    return this.uid;
  },
  async loadAll(){
    const results={}; let any=false;
    for(const c of this.cols){ try{ const s=await this.db.doc(this.docPath(c)).get(); if(s.exists){ results[c]=s.data(); any=true; } }catch(e){} }
    if(!any){
      let lease={acquired:true};
      try{ lease = await this.db.doc("state/_seedlock").acquire({holder:(this.uid||"boot"),ttlMs:20000}); }catch(e){}
      let already=false; try{ already=(await this.db.doc(this.docPath("config")).get()).exists; }catch(e){}
      if(lease.acquired && !already){
        db=seed(); ensureSchema(); await this.pushAll();
      } else {
        for(const c of this.cols){ try{ const s=await this.db.doc(this.docPath(c)).get(); if(s.exists) results[c]=s.data(); }catch(e){} }
        db=emptyDb(); this.cols.forEach(c=>this.unpack(c,results[c])); ensureSchema();
      }
    } else {
      db=emptyDb(); this.cols.forEach(c=>this.unpack(c,results[c])); ensureSchema();
    }
    this.cols.forEach(c=>{ this.hashes[c]=this.hash(this.pack(c)); });
  },
  async pushAll(){ for(const c of this.cols){ try{ await this.db.doc(this.docPath(c)).set(this.pack(c)); this.hashes[c]=this.hash(this.pack(c)); }catch(e){} } },
  push(){
    if(!this.on) return;
    if(!this.canWrite){ return; }
    clearTimeout(this.pushTimer);
    this.setStatus("syncing");
    this.pushTimer=setTimeout(async ()=>{
      let err=false;
      for(const c of this.cols){ const h=this.hash(this.pack(c)); if(h!==this.hashes[c]){ try{ await this.db.doc(this.docPath(c)).set(this.pack(c)); this.hashes[c]=h; }catch(e){ err=true; } } }
      this.setStatus(err?"error":"synced");
    }, 450);
  },
  subscribeAll(){
    for(const c of this.cols){
      try{
        const un=this.db.doc(this.docPath(c)).onSnapshot(snap=>{
          if(!snap.exists) return;
          const data=snap.data();
          const h=this.hash(c==="config"?{config:data.config||{}}:{rows:Array.isArray(data.rows)?data.rows:[]});
          if(h===this.hashes[c]) return;               // eco do nosso próprio write / sem mudança
          this.unpack(c,data); this.hashes[c]=h; ensureSchema();
          this.setStatus("synced");
          if(state.user && !document.querySelector(".modal-back")){ try{ render(); }catch(e){} }
        }, e=>{});
        this.subs.push(un);
      }catch(e){}
    }
  },
  setStatus(s){ this.status=s; const el=document.getElementById("sync-ind"); if(el){ const t=document.createElement("div"); t.innerHTML=syncIndicatorHTML(); if(t.firstElementChild) el.replaceWith(t.firstElementChild); } }
};
const SB = {
  on:false, client:null, uid:null, email:"", canWrite:true,
  cols:["config","usuarios","fornecedores","insumos","produtos","compras","movimentacoes","producoes","perdas","contagens","cotacoes","vendas","despesas","comandas"],
  hashes:{}, pushTimer:null, status:"idle",
  configured(){ return typeof SUPA_URL==="string" && SUPA_URL && typeof SUPA_KEY==="string" && SUPA_KEY && typeof supabase!=="undefined" && supabase.createClient; },
  async init(){ if(!this.configured()) return false; try{ this.client=supabase.createClient(SUPA_URL,SUPA_KEY); this.on=true; return true; }catch(e){ return false; } },
  async session(){ try{ const {data}=await this.client.auth.getSession(); return data.session||null; }catch(e){ return null; } },
  async loadAll(){
    const results={}; let any=false;
    try{ const {data,error}=await this.client.from("app_state").select("k,data"); if(!error&&data){ data.forEach(r=>{ results[r.k]=r.data; any=true; }); } }catch(e){}
    if(!any){ db=emptyDb(); ensureSchema(); await this.pushAll(); }
    else { db=emptyDb(); this.cols.forEach(c=>CLOUD.unpack(c,results[c])); ensureSchema(); }
    this.cols.forEach(c=>{ this.hashes[c]=CLOUD.hash(CLOUD.pack(c)); });
  },
  async pushAll(){ for(const c of this.cols){ try{ await this.client.from("app_state").upsert({k:c,data:CLOUD.pack(c),updated_at:new Date().toISOString()}); this.hashes[c]=CLOUD.hash(CLOUD.pack(c)); }catch(e){} } },
  push(){
    if(!this.on) return;
    clearTimeout(this.pushTimer); this.setStatus("syncing");
    this.pushTimer=setTimeout(async ()=>{
      let err=false;
      for(const c of this.cols){ const h=CLOUD.hash(CLOUD.pack(c)); if(h!==this.hashes[c]){ try{ const {error}=await this.client.from("app_state").upsert({k:c,data:CLOUD.pack(c),updated_at:new Date().toISOString()}); if(error){err=true;} else {this.hashes[c]=h;} }catch(e){err=true;} } }
      this.setStatus(err?((typeof navigator!=="undefined"&&navigator.onLine===false)?"offline":"error"):"synced");
    },450);
  },
  subscribeAll(){
    try{
      this.client.channel("app_state_ch").on("postgres_changes",{event:"*",schema:"public",table:"app_state"},payload=>{
        const row=payload.new||payload.old; if(!row||!row.k) return;
        const c=row.k; if(this.cols.indexOf(c)<0) return;
        const data=payload.new?payload.new.data:null; if(!data) return;
        const h=CLOUD.hash(c==="config"?{config:data.config||{}}:{rows:Array.isArray(data.rows)?data.rows:[]});
        if(h===this.hashes[c]) return;
        CLOUD.unpack(c,data); this.hashes[c]=h; ensureSchema(); this.setStatus("synced");
        if(state.user && !document.querySelector(".modal-back")){ try{render();}catch(e){} }
      }).subscribe(st=>{ if(st==="SUBSCRIBED"){ this.setStatus("synced"); } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ this.setStatus("offline"); } });
    }catch(e){}
  },
  setStatus(s){ this.status=s; const el=document.getElementById("sync-ind"); if(el){ const t=document.createElement("div"); t.innerHTML=syncIndicatorHTML(); if(t.firstElementChild) el.replaceWith(t.firstElementChild); } }
};

async function sbEnter(session){
  SB.uid=session.user.id; SB.email=session.user.email||"";
  db.usuarios=db.usuarios||[];
  let u=db.usuarios.find(x=>x.id===SB.uid);
  if(!u){
    const primeiro = db.usuarios.length===0;
    u={id:SB.uid,login:SB.email,senha:"",nome:(SB.email.split("@")[0]||"Novo membro"),nivel:(primeiro?"admin":"operacao"),ativo:(primeiro?true:false),cloud:true};
    db.usuarios.push(u); save();
  }

  if(u.nivel==="admin"){ const nv=processarVencidos(); if(nv>0) setTimeout(()=>toast(nv+" item(ns) vencido(s) tiveram baixa automática (perda: Vencido).","err"),800); }

}

async function doSbAuth(){
  const email=($("#lg-email").value||"").trim(), senha=$("#lg-senha").value||"";
  const errBox=$("#loginErr"); const btn=$("#auth-primary");
  if(!email||!senha){ if(errBox) errBox.innerHTML='<div class="login-err">Preencha e-mail e senha.</div>'; return; }
  if(btn){ btn.textContent="Aguarde…"; btn.disabled=true; }
  try{
    if(state.authMode==="signup"){
      const {error}=await SB.client.auth.signUp({email,password:senha});
      if(error) throw error;
      const {data,error:e2}=await SB.client.auth.signInWithPassword({email,password:senha});
      if(e2){ state.authMode="login"; renderAuth("Conta criada! Se o projeto exigir confirmação de e-mail, confirme e entre."); return; }
      await sbBootData(); await sbEnter(data.session); return;
    }
    const {data,error}=await SB.client.auth.signInWithPassword({email,password:senha});
    if(error) throw error;
    await sbBootData(); await sbEnter(data.session); return;
  }catch(err){
    renderAuth((err&&err.message)?err.message:"Falha na autenticação.");
  }
}
async function cloudEnter(){
  await CLOUD.whoami();
  db.usuarios = db.usuarios || [];
  let u = CLOUD.uid ? db.usuarios.find(x=>x.id===CLOUD.uid) : null;
  if(!u){
    if(!CLOUD.uid){
      state.user = {id:"anon",nome:CLOUD.myName||"Visitante",nivel:"caixa",ativo:true,cloud:true};
    } else {
      u = {id:CLOUD.uid, login:(CLOUD.myName||"membro"), senha:"", nome:CLOUD.myName||"Novo membro", nivel:(CLOUD.isOwner?"admin":"operacao"), ativo:(CLOUD.isOwner?true:false), cloud:true};
      db.usuarios.push(u); save(); state.user=u;
    }
  } else {
    if(CLOUD.myName && u.nome!==CLOUD.myName){ u.nome=CLOUD.myName; save(); }
    state.user=u;
  }
  if(state.user && state.user.ativo===false){ renderNoAccess(); return; }
  state.view="dashboard"; render();
}

      <h2>Verifique a conexão</h2>
      <div class="sub">Confira, no topo do arquivo, se as chaves do Supabase estão corretas:</div>
      <ul style="font-size:13px;color:var(--ink-2);line-height:1.7;margin:8px 0 4px;padding-left:18px">
        <li><b>SUPA_URL</b> — o <i>Project URL</i> (Settings → API)</li>
        <li><b>SUPA_KEY</b> — a chave <i>anon public</i></li>
        <li>A tabela <b>app_state</b> e as políticas criadas (SQL)</li>
        <li>Sua conexão com a internet</li>
      </ul>
      <button class="btn primary" data-act="reload" style="width:100%;justify-content:center;margin-top:8px">Tentar novamente</button>
    </div></div></div>`;
}

/* ---------- Boot ---------- */
(async function boot(){
  applyTheme();
  // chaves do Supabase pela metade → erro claro
  if((typeof SUPA_URL==="string"&&SUPA_URL&&!(typeof SUPA_KEY==="string"&&SUPA_KEY)) || (typeof SUPA_KEY==="string"&&SUPA_KEY&&!(typeof SUPA_URL==="string"&&SUPA_URL))){
    renderConfigError("Faltou preencher uma das chaves do Supabase — preencha SUPA_URL e SUPA_KEY no topo do arquivo."); return;
  }
  // 1) Supabase (hospedado no seu domínio) → 2) Claude db (publicado) → 3) local
  let mode="local";
  try{ if(SB.configured() && await SB.init()) mode="sb"; }catch(e){}
  if(mode==="local"){ try{ if(await CLOUD.init()) mode="cloud"; }catch(e){} }
  if(mode!=="local" && typeof window.addEventListener==="function"){
    window.addEventListener("offline",()=>{ const A=cloudActive(); if(A) A.setStatus("offline"); });
    window.addEventListener("online",()=>{ const A=cloudActive(); if(A){ A.setStatus("syncing"); if(A.push) A.push(); } });
  }

  if(mode==="sb"){
    $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--ink-3);font-family:'Bricolage Grotesque',sans-serif">☁︎ Conectando…</div>`;
    try{
      const sess=await SB.session();
      if(!sess){ renderAuth(); }
      else { await sbBootData(); await sbEnter(sess); }
      try{ SB.client.auth.onAuthStateChange((ev,s2)=>{ if(ev==="SIGNED_OUT"){ state.user=null; renderAuth(); } }); }catch(e){}
    }catch(e){ renderConfigError("Não foi possível conectar ao Supabase. Verifique as chaves (SUPA_URL / anon key), se o SQL foi executado e sua internet."); }
  } else if(mode==="cloud"){
    $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--ink-3);font-family:'Bricolage Grotesque',sans-serif">☁︎ Conectando à nuvem…</div>`;
    try{
      await CLOUD.loadAll();
      if(CLOUD.isOwner && CLOUD.canWrite){ const nv=processarVencidos(); if(nv>0) setTimeout(()=>toast(nv+" item(ns) vencido(s) tiveram baixa automática (perda: Vencido).","err"),800); }
      CLOUD.subscribeAll(); CLOUD.setStatus("synced");
      await cloudEnter();
    }catch(e){ $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--brand);padding:20px;text-align:center">Não foi possível conectar à nuvem. Recarregue a página.</div>`; }
  } else {
    load();
    { const nv=processarVencidos(); if(nv>0) setTimeout(()=>toast(nv+" item(ns) vencido(s) tiveram baixa automática (perda: Vencido).","err"),500); }
    render();
  }
})();
</script>
</body>
</html>
