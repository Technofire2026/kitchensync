*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background-color:var(--bg);
  background-image:var(--kitchen);
  background-repeat:repeat;
  background-size:300px 300px;
  background-position:top left;
  color:var(--ink);
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Inter',sans-serif; font-weight:700; margin:0; letter-spacing:-.015em; line-height:1.1}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink)}
a{color:var(--brand)}
.num,.mono{font-variant-numeric:var(--tab)}
::selection{background:var(--brand-soft);color:var(--brand-strong)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;cursor:pointer;position:relative;
  box-shadow:var(--shadow-sm);transition:transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .16s,background .16s,border-color .16s,filter .16s;white-space:nowrap}
.btn:hover{background:var(--panel-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.985);box-shadow:var(--shadow-sm);filter:brightness(.98)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand-strong);color:var(--on-brand);box-shadow:0 8px 18px -8px var(--brand),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 12px 24px -10px var(--brand),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:active{filter:brightness(.97);transform:translateY(0) scale(.985)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--panel-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn.ghost:active{transform:translateY(0) scale(.985)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:transparent;color:var(--danger-strong)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:0;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-hero{background:
   radial-gradient(120% 120% at 12% 8%, #2f6bff 0%, #1c4fd6 32%, #122f86 64%, #0a1f4d 100%);
   color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-hero .brandmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.login-hero .brandmark .logo{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;backdrop-filter:blur(2px)}
.login-hero h1{color:#fff;font-size:clamp(34px,4.6vw,58px);line-height:1.02;max-width:13ch;margin-top:8px;position:relative;z-index:2;letter-spacing:-.02em}
.login-hero p{color:#d7e4ff;max-width:40ch;font-size:15.5px;position:relative;z-index:2}
.login-hero .disc{font-size:12.5px;color:#bcd1ff;position:relative;z-index:2}
.login-hero .pie{position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;
  background:conic-gradient(from 18deg, rgba(255,255,255,.11) 0 30deg, transparent 30deg 60deg, rgba(255,255,255,.11) 60deg 90deg, transparent 90deg 120deg, rgba(255,255,255,.11) 120deg 150deg, transparent 150deg 180deg, rgba(255,255,255,.11) 180deg 210deg, transparent 210deg 240deg, rgba(255,255,255,.11) 240deg 270deg, transparent 270deg 300deg, rgba(255,255,255,.11) 300deg 330deg, transparent 330deg 360deg);
  border:2px dashed rgba(255,255,255,.22)}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg)}
.login-card{width:100%;max-width:370px}
.login-card h2{font-size:27px;margin-bottom:5px}
.login-card .sub{color:var(--ink-2);margin-bottom:28px;font-size:14.5px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);outline:none;transition:border-color .14s,box-shadow .14s}
.input:hover{border-color:var(--ink-3)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
textarea.input{resize:vertical;min-height:70px}
.login-err{background:var(--danger-soft);color:var(--danger-strong);padding:10px 13px;border-radius:9px;font-size:13px;margin-bottom:14px;font-weight:600}
.login-hint{margin-top:20px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:15px;line-height:1.6}
@media(max-width:820px){.login-wrap{grid-template-columns:1fr}.login-hero{display:none}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--rail-2),var(--rail) 34%);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px}
.side-brand .logo{width:44px;height:44px;border-radius:12px;background:transparent;display:grid;place-items:center;overflow:hidden;padding:0;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}.side-brand .logo img{width:100%;height:100%;object-fit:contain;display:block}.login-hero .brandmark .loginlogo{width:280px;max-width:82%;height:auto;background:transparent;border-radius:0;padding:0;box-shadow:none}
.side-brand .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;line-height:1;color:#fff;letter-spacing:-.01em}
.side-brand .tg{font-size:11px;color:var(--rail-ink-2);margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 20px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--rail-2);border-radius:8px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--rail-ink-2);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:background .14s,color .14s}
.nav a .nav-lab{flex:1;min-width:0}
.nav a .nav-badge{background:var(--brand);color:var(--on-brand);font-size:10.5px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px -2px var(--brand)}
.nav a .ic{width:22px;text-align:center;font-size:16px}
.nav a:hover{background:var(--rail-2);color:var(--rail-ink)}
.nav a.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 8px 18px -10px var(--brand)}
.nav a.active .ic{filter:none}
.nav a.active::before{content:none}
.nav .grp{font-size:10.5px;letter-spacing:.08em;color:var(--rail-ink-2);text-transform:uppercase;padding:16px 12px 6px;font-weight:700;opacity:.7}
.side-user{border-top:1px solid var(--rail-line);padding:14px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif}
.side-user .un{font-weight:600;font-size:13px;line-height:1.25;color:var(--rail-ink)}
.side-user .ur{font-size:11.5px;color:var(--rail-ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:17px 30px;border-bottom:1px solid var(--line);background:var(--bg);background:color-mix(in srgb,var(--bg) 82%, transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.topbar .menu-btn{display:none}
.tb-brand{display:none;align-items:center;gap:9px;text-decoration:none;cursor:pointer}
.tb-logo{width:34px;height:34px;border-radius:9px;display:block;box-shadow:0 6px 14px -7px rgba(12,26,46,.55)}
.tb-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--ink);line-height:1}
.tb-name b{color:var(--brand);font-weight:800}
.side-theme{display:none}
.ct-q.scanned{background:var(--brand-soft);border-color:var(--brand);font-weight:700}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.prod-btn{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;cursor:pointer;transition:transform .1s,box-shadow .14s,border-color .14s}
.prod-btn:hover{border-color:var(--brand);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.prod-btn:active{transform:scale(.97)}
.prod-btn .pn{font-weight:600;font-size:13px;line-height:1.25;color:var(--ink)}
.prod-btn .pp{font-weight:700;font-size:13px;color:var(--brand)}
.cmd-list{display:flex;flex-direction:column}
.cmd-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mesa-card{transition:transform .12s,box-shadow .16s} .mesa-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pweye-wrap{position:relative;display:block}
.pweye-wrap input{padding-right:42px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:.65;line-height:1;padding:4px}
.pweye:hover{opacity:1}
.fld-st{font-size:11.5px;color:var(--ink-3);margin-top:4px;min-height:14px}
.fld-st.ok{color:var(--basil)} .fld-st.err{color:var(--danger)}
.bell-badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px -2px rgba(0,0,0,.4)}
.avlist{display:flex;flex-direction:column;gap:8px}
.avitem{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel)}
.avitem.unread{border-color:var(--brand);background:var(--brand-soft)}
.avitem .avtx{font-size:14px;line-height:1.5}
.avitem .avmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px}
.page-title{font-size:23px}
.page-sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.topbar .spacer{flex:1}
.content{padding:26px 30px 70px;max-width:1300px;width:100%}
.scrim{display:none}

/* ---------- Cards / KPI ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 19px;box-shadow:var(--shadow);overflow:hidden;transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);opacity:.9}
.kpi.good::after{background:var(--basil)} .kpi.bad::after{background:var(--danger)}
.kpi .k-lab{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.kpi .k-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;margin-top:10px;line-height:1;font-variant-numeric:var(--tab);letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.kpi.good .k-val{color:var(--basil)} .kpi.bad .k-val{color:var(--danger)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:16.5px}
.card-head .spacer{flex:1}
.card-body{padding:18px 20px}
.card-body.flush{padding:0}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .1s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:var(--tab)}
table.tbl td.c,table.tbl th.c{text-align:center}
.strong{font-weight:600}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.pill.red{background:var(--danger-soft);color:var(--danger-strong);border-color:transparent}
.pill.green{background:var(--basil-soft);color:var(--basil);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.gray{color:var(--ink-3);background:var(--panel-2)}
.rowacts{display:flex;gap:4px;justify-content:flex-end}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty h4{font-size:16.5px;color:var(--ink-2);margin-bottom:5px}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar .spacer{flex:1}
.search{position:relative}
.search input{padding-left:34px;min-width:220px}
.search::before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.55}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);border-radius:7px;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
label.inl{font-size:12.5px;color:var(--ink-2);font-weight:600;display:inline-flex;align-items:center;gap:8px}
label.inl input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}

/* ---------- Modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,16,34,.58);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:19px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:19px}
.modal-head .spacer{flex:1}
.modal-body{padding:22px 24px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:15px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;background:var(--panel-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}

/* ---------- Line items editor ---------- */
.items-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.items-tbl th{font-size:11px;color:var(--ink-3);text-align:left;padding:4px 6px;font-weight:600}
.items-tbl td{padding:3px 4px}
.items-tbl select,.items-tbl input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.items-tbl select:focus,.items-tbl input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.items-tbl .rmv{color:var(--brand);border:none;background:transparent;font-size:18px;padding:0 6px}
.subtotal{text-align:right;font-weight:700;font-variant-numeric:var(--tab);padding:8px 6px 2px;font-size:15px}

/* ---------- Bars (charts) ---------- */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:160px 1fr auto;align-items:center;gap:14px;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--panel-2);border-radius:7px;height:24px;overflow:hidden;border:1px solid var(--line-2)}
.bar-fill{height:100%;border-radius:6px;background:var(--brand);min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-fill.g{background:var(--basil)}
.bar-fill.a{background:var(--amber)}
.bar-val{font-variant-numeric:var(--tab);font-weight:700;min-width:84px;text-align:right}

/* ---------- DRE ---------- */
.dre{width:100%;border-collapse:collapse;font-size:14px}
.dre td{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.dre td.r{text-align:right;font-variant-numeric:var(--tab)}
.dre tr.sub td{color:var(--ink-2)}
.dre tr.total td{font-weight:700;background:var(--panel-2);border-top:1px solid var(--line)}
.dre tr.result td{font-weight:700;font-size:16px;background:var(--brand-soft);color:var(--brand-strong)}
.dre tr.result.pos td{background:var(--basil-soft);color:var(--basil)}
.dre .lvl{padding-left:34px}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:11px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:pop .16s}
.toast.ok{background:var(--basil);color:#fff} .toast.err{background:var(--brand);color:#fff}

.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:262px;transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 50px rgba(0,0,0,.4)}
  .sidebar.open{transform:none}
  .topbar{padding:12px 16px;background:var(--panel);background:color-mix(in srgb,var(--panel) 92%, transparent)}
  .topbar .tb-brand{display:inline-flex}
  .topbar .tb-titles{display:none}
  .topbar .tb-theme{display:none}
  .topbar #sync-ind{display:none}
  .topbar .menu-btn{display:inline-flex;width:48px;height:44px;border-radius:12px;font-size:21px;justify-content:center;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--ink)}
  .topbar .menu-btn:active{background:var(--panel-2)}
  .side-theme{display:inline-flex}
  .content{padding:18px 16px 70px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
  .scrim.show{display:block}
}

/* ---- Relatório de fechamento (impressão) ---- */
#print-area{display:none}
.rep{font-family:Inter,system-ui,sans-serif;color:#111;background:#fff;padding:24px 28px;max-width:900px;margin:0 auto}
.rep h1{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin:0 0 2px}
.rep .rep-sub{color:#444;font-size:13px;margin-bottom:2px}
.rep .rep-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;margin:10px 0 14px}
.rep h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
.rep table{width:100%;border-collapse:collapse;font-size:12px}
.rep th,.rep td{border:1px solid #bbb;padding:5px 7px;text-align:left}
.rep td.r,.rep th.r{text-align:right}
.rep tr.tot td{font-weight:700;background:#f2f2f2}
.rep .neg{color:#000;font-weight:700}
.rep .sig{display:flex;flex-wrap:wrap;gap:26px;margin-top:40px}
.rep .sig .line{flex:1 1 200px;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:12px}
.rep .foot{margin-top:24px;font-size:11px;color:#666}
@media print{
  body.printing>*{display:none!important}
  body.printing #print-area{display:block!important}
  #print-area{display:block}
  @page{margin:14mm}
}
/* ===== PWA / instalado no celular: áreas seguras (notch) e sem seleção acidental ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.btn,.seg button,.nav a,.pill{-webkit-tap-highlight-color:transparent}
@media (display-mode:standalone){
  .topbar{padding-top:calc(14px + env(safe-area-inset-top))}
  .sidebar{padding-top:env(safe-area-inset-top)}
  .content{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .toast-wrap{bottom:calc(24px + env(safe-area-inset-bottom))}
}
@media(max-width:560px){
  .content{padding:18px 15px 60px}
  .topbar{padding:12px 15px}
  .modal-body{padding:18px 16px}
  .modal-head{padding:16px 18px}
  .modal-foot{padding:13px 18px}
  .toolbar .search input{min-width:0;width:100%}
  .search{flex:1 1 100%}
  .page-title{font-size:19px}
}
/* ===== Barra de atalhos inferior (celular) — estilo app ===== */
.tabbar{display:none}
@media(max-width:860px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:48;
    background:color-mix(in srgb,var(--panel) 95%, transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);box-shadow:0 -6px 20px -12px rgba(12,26,46,.4);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:8px 2px 7px;color:var(--ink-3);text-decoration:none;font-size:10px;font-weight:600;
    -webkit-tap-highlight-color:transparent;cursor:pointer;min-width:0;transition:color .14s}
  .tabbar .tab .ti{font-size:19px;line-height:1}
  .tabbar .tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar .tab.on{color:var(--brand)}
  .tabbar .tab.on .ti{transform:translateY(-1px)}
  .content{padding-bottom:86px!important}
  .toast-wrap{bottom:96px}
}
@media(max-width:860px) and (display-mode:standalone){
  .content{padding-bottom:calc(86px + env(safe-area-inset-bottom))!important}
  .toast-wrap{bottom:calc(96px + env(safe-area-inset-bottom))}
}

  if(i && i.lotes && i.lotes.length) return i.lotes.map(l=>({id:l.id,qtd:num(l.qtd),validade:l.validade||""}));

function ensureSchema(){
  if(!db) return;
  if(!Array.isArray(db.producoes)) db.producoes=[];
  if(!Array.isArray(db.perdas)) db.perdas=[];
  if(!Array.isArray(db.contagens)) db.contagens=[];
  if(!Array.isArray(db.cotacoes)) db.cotacoes=[];
  if(!Array.isArray(db.notificacoes)) db.notificacoes=[];
  (db.cotacoes||[]).forEach(c=>{ if(!c.status) c.status="rascunho"; if(!Array.isArray(c.historico)) c.historico=[]; });
  if(!db.config) db.config={};
  if(db.config.perdaLimite==null) db.config.perdaLimite=5;
  if(db.config.validadeAlerta==null) db.config.validadeAlerta=7;
  if(db.config.baixaVencidoAuto==null) db.config.baixaVencidoAuto=true;
  if(!db.config.desvioLimite) db.config.desvioLimite={bar:5,limpeza:5,descartaveis:5};
  if(!Array.isArray(db.config.conceitos)||!db.config.conceitos.length) db.config.conceitos=["Pizzaria","Petiscaria","Bar"];
  if(db.config.cartaoPadrao==null) db.config.cartaoPadrao=3;
  if(db.config.taxaServico==null) db.config.taxaServico=10;
  if(db.config.metaCmvVar==null) db.config.metaCmvVar=2;
  if(db.config.metaMargem==null) db.config.metaMargem=45;
  if(db.config.metaPrime==null) db.config.metaPrime=60;
  if(db.config.numMesas==null) db.config.numMesas=8;
  if(db.config.lugares==null) db.config.lugares=32;
  if(db.config.horasDia==null) db.config.horasDia=6;
  if(!Array.isArray(db.comandas)) db.comandas=[];
  if(!Array.isArray(db.caixas)) db.caixas=[];
  if(!Array.isArray(db.entregas)) db.entregas=[];
  (db.produtos||[]).forEach(p=>{ if(!p.conceito) p.conceito=(db.config.conceitos&&db.config.conceitos[0])||"Geral"; });
  // migrar funções antigas -> novas (gerente→gerência, caixa→operação, cozinha→estoque)
  (db.usuarios||[]).forEach(u=>{ if(u && ROLE_MIGRATE[u.nivel]) u.nivel=ROLE_MIGRATE[u.nivel]; });
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ db=JSON.parse(raw); ensureSchema(); return; } }catch(e){}
  db=seed(); ensureSchema(); save();
}

/* ---------- Domain calc ---------- */
function conceitoDe(p){ const c=(p&&p.conceito)||""; const list=(db.config&&db.config.conceitos)||[]; return c||list[0]||"Geral"; }
function custoProduto(p){
  if(!p) return 0;
  if(p.ficha && p.ficha.length){
    return p.ficha.reduce((s,f)=>{ const i=byId(db.insumos,f.insumoId); return s+(i?(i.custoMedio||0)*num(f.qtd):0); },0);
  }
  return num(p.custoManual);
}
/* Custo total por unidade (insumos + energia + embalagem + outros) — usado só na precificação/exibição */
function custoTotalProduto(p){ if(!p) return 0; return custoProduto(p)+num(p.energia)+num(p.embalagem)+num(p.outros); }
/* Preço que gera a margem desejada considerando as taxas (fração sobre o preço) */
function precoComMargem(custo, fracTaxas, modo, margem){
  const f=num(fracTaxas), m=num(margem)/100;
  if(modo==='custo'){ const d=1-f; return d>0?(custo*(1+m))/d:0; }
  const d=1-f-m; return d>0?custo/d:0; // 'preco'
}
/* Precifica um produto p/ balcão e iFood a partir dos parâmetros salvos */
function precificar(p){
  const ct=custoTotalProduto(p);
  const imp=num(p.imposto!=null?p.imposto:((db.config&&db.config.impostoPercent)||0));
  const cartao=num(p.cartao), modo=p.precoModo||'preco', margem=num(p.margem);
  const temParams = p.margem!=null && p.margem!=="";
  const fB=(imp+cartao)/100;
  const precoB = temParams? precoComMargem(ct,fB,modo,margem) : num(p.preco);
  const lucroB = precoB*(1-fB)-ct;
  const fI=(imp+num(p.ifCom)+num(p.ifTx)+num(p.ifAnt))/100;
  const precoI = temParams? precoComMargem(ct,fI,modo,margem) : num(p.precoIfood);
  const lucroI = precoI*(1-fI)-ct;
  const margemB = precoB>0? lucroB/precoB*100 : 0;
  return {custoTotal:ct, precoB, lucroB, margemB, precoI, lucroI, temParams, temIfood:(num(p.ifCom)+num(p.ifTx)+num(p.ifAnt))>0};
}
function inPeriod(iso, mode){
  if(!iso) return false;
  const t=todayISO();
  if(mode==="dia") return iso===t;
  if(mode==="mes") return iso.slice(0,7)===monthISO();
  if(mode==="ano") return iso.slice(0,4)===yearISO();
  return true; // total
}
function inMonth(iso,ym){ return iso && iso.slice(0,7)===ym; }
function vendaTotal(v){ return (v.itens||[]).reduce((s,it)=>s+num(it.qtd)*num(it.preco),0); }
function vendaCMV(v){ return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); return s+num(it.qtd)*custoProduto(p); },0); }
function compraTotal(c){ return (c.itens||[]).reduce((s,it)=>s+num(it.qtd)*num(it.custoUnit),0); }
/* Baixa direta de estoque na venda (produtos marcados como revenda) */
function baixasDaVenda(itens){
  const map={};
  (itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); if(!p||!p.baixaVenda||!p.ficha) return;
    p.ficha.forEach(f=>{ map[f.insumoId]=(map[f.insumoId]||0)+num(f.qtd)*num(it.qtd); });
  });
  return Object.entries(map).map(([insumoId,qtd])=>({insumoId,qtd}));
}
function aplicarBaixas(baixas,sinal){ (baixas||[]).forEach(b=>{ const i=byId(db.insumos,b.insumoId); if(!i) return; if(temLotes(i)){ if(sinal<0) consumirLotesFIFO(i,num(b.qtd)); else addLote(i,num(b.qtd),""); } else { i.estoque=num(i.estoque)+sinal*num(b.qtd); } }); }
/* Consumo FIFO por validade (mais próxima primeiro; sem validade por último) */
function consumirLotesFIFO(i, qtd){
  if(!temLotes(i)){ i.estoque=num(i.estoque)-num(qtd); return; }
  let rest=num(qtd);
  i.lotes.sort((a,b)=>((a.validade||"9999-12-31").localeCompare(b.validade||"9999-12-31")));
  for(const l of i.lotes){ if(rest<=0) break; const take=Math.min(num(l.qtd),rest); l.qtd=num(l.qtd)-take; rest-=take; }
  i.lotes=i.lotes.filter(l=>num(l.qtd)>1e-9);
  syncEstoqueLotes(i);
}
function addLote(i, qtd, validade){ i.lotes=i.lotes||[]; const id=uid(); i.lotes.push({id,qtd:num(qtd),validade:validade||""}); syncEstoqueLotes(i); return id; }
function reduzirLotePorId(i, loteId, qtd){
  if(!i.lotes||!i.lotes.length){ i.estoque=num(i.estoque)-num(qtd); return; }
  const l=loteId&&i.lotes.find(x=>x.id===loteId);
  if(l){ l.qtd=num(l.qtd)-num(qtd); }
  else { let rest=num(qtd); for(let k=i.lotes.length-1;k>=0&&rest>0;k--){const take=Math.min(num(i.lotes[k].qtd),rest);i.lotes[k].qtd=num(i.lotes[k].qtd)-take;rest-=take;} }
  i.lotes=i.lotes.filter(x=>num(x.qtd)>1e-9); syncEstoqueLotes(i);
}
/* Consumo teórico de insumos de UMA produção (produto × ficha técnica) */
function producaoCustoTeorico(pr){ const p=byId(db.produtos,pr.produtoId); if(!p) return 0; return custoProduto(p)*num(pr.qtd); }
/* Mapa insumoId -> qtd teórica consumida no período (produção × ficha) */
function consumoTeoricoQtd(mode){
  const map={};
  (db.producoes||[]).filter(pr=>inPeriod(pr.data,mode)).forEach(pr=>{
    const p=byId(db.produtos,pr.produtoId); if(!p||!p.ficha) return;
    p.ficha.forEach(f=>{ map[f.insumoId]=(map[f.insumoId]||0)+num(f.qtd)*num(pr.qtd); });
  });
  return map;
}
/* Mapa insumoId -> qtd real enviada à cozinha no período (saídas) */
function consumoRealQtd(mode){
  const map={};
  db.movimentacoes.filter(m=>m.tipo==="saida"&&setorDe(m)==="cozinha"&&inPeriod(m.data,mode)).forEach(m=>{ map[m.insumoId]=(map[m.insumoId]||0)+num(m.qtd); });
  return map;
}
/* ---- Perdas & ocorrências ---- */
const MOTIVOS=["Quebra","Queima","Cortesia","Sobra","Vencido","Outro"];
/* Expande uma perda em consumo de insumos (produto vira insumos via ficha) */
function perdaExpandir(pl){
  if(!pl) return [];
  if(pl.tipo==="produto"){ const p=byId(db.produtos,pl.produtoId); if(!p||!p.ficha) return []; return p.ficha.map(f=>({insumoId:f.insumoId,qtd:num(f.qtd)*num(pl.qtd)})); }
  return [{insumoId:pl.insumoId,qtd:num(pl.qtd)}];
}
function perdaValor(pl){ return perdaExpandir(pl).reduce((s,e)=>{const i=byId(db.insumos,e.insumoId);return s+e.qtd*(i?num(i.custoMedio):0);},0); }
function perdaInsumosQtd(mode){ const map={}; (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).forEach(pl=>{perdaExpandir(pl).forEach(e=>{map[e.insumoId]=(map[e.insumoId]||0)+e.qtd;});}); return map; }
function perdaPorMotivo(mode){ const map={}; (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).forEach(pl=>{map[pl.motivo]=(map[pl.motivo]||0)+perdaValor(pl);}); return map; }
function perdaTotalValor(mode){ return (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).reduce((s,pl)=>s+perdaValor(pl),0); }
/* Reconciliação por insumo: enviado (real) − teórico (produção) − perdas registradas = não explicado */
function varianciaInsumos(mode){
  const real=consumoRealQtd(mode), teo=consumoTeoricoQtd(mode), per=perdaInsumosQtd(mode);
  const ids=new Set([...Object.keys(real),...Object.keys(teo),...Object.keys(per)]);
  const rows=[];
  ids.forEach(id=>{
    const i=byId(db.insumos,id); if(!i) return;
    const qr=real[id]||0, qt=teo[id]||0, qp=per[id]||0, custo=num(i.custoMedio);
    const naoExpl=qr-qt-qp, base=qt+qp;
    const perc = base>0 ? (naoExpl/base*100) : (qr>0? Infinity : 0);
    rows.push({id,nome:i.nome,unidade:i.unidade,qtReal:qr,qtTeo:qt,qtPerda:qp,naoExpl,dr:naoExpl*custo,perc,temBase:base>0});
  });
  return rows.sort((a,b)=>Math.abs(b.dr)-Math.abs(a.dr));
}
/* Classe/rótulo de alerta a partir do % não explicado */
function perdaFlag(perc,temBase){
  const lim=num((db.config&&db.config.perdaLimite)||5);
  if(!temBase) return {cls:"gray",txt:"sem base"};
  const a=Math.abs(perc);
  if(a<=lim) return {cls:"green",txt:"ok"};
  if(a<=lim*3) return {cls:"amber",txt:"atenção"};
  return {cls:"red",txt:"crítico"};
}
/* Situação de desvio de um setor (limite % configurável por setor, sobre o consumo/saídas) */
function setorFlag(desvioR, baseR, setor){
  const lim=num((db.config&&db.config.desvioLimite&&db.config.desvioLimite[setor])||5);
  if(!(baseR>0)) return {cls:Math.abs(desvioR)<0.01?"green":"amber", txt:Math.abs(desvioR)<0.01?"ok":"atenção", perc:0};
  const perc=Math.abs(desvioR)/baseR*100;
  if(perc<=lim) return {cls:"green",txt:"ok",perc};
  if(perc<=lim*3) return {cls:"amber",txt:"atenção",perc};
  return {cls:"red",txt:"crítico",perc};
}

/* ---- Fechamento diário / contagem física da cozinha ---- */
function contagemMapa(dataISO,setor){ setor=setor||"cozinha"; const c=(db.contagens||[]).filter(x=>x.data===dataISO&&setorDe(x)===setor).sort((a,b)=>b.id.localeCompare(a.id))[0]; if(!c) return null; const m={}; (c.itens||[]).forEach(it=>{m[it.insumoId]=num(it.qtd);}); return m; }
function contagemDe(dataISO,setor){ setor=setor||"cozinha"; return (db.contagens||[]).filter(x=>x.data===dataISO&&setorDe(x)===setor).sort((a,b)=>b.id.localeCompare(a.id))[0]||null; }
function nomeUsuario(uid){ const u=byId(db.usuarios,uid); return u?u.nome:"—"; }
function datasComContagem(setor){ setor=setor||"cozinha"; return [...new Set((db.contagens||[]).filter(c=>setorDe(c)===setor).map(c=>c.data))].sort(); }
function ultimaContagemAntes(dataISO,setor){ const ds=datasComContagem(setor).filter(d=>d<dataISO); return ds.length?ds[ds.length-1]:null; }
function enviadoJanela(after,upto){ const m={}; db.movimentacoes.filter(x=>x.tipo==="saida"&&setorDe(x)==="cozinha"&&x.data>(after||"")&&x.data<=upto).forEach(x=>{m[x.insumoId]=(m[x.insumoId]||0)+num(x.qtd);}); return m; }
function teoricoJanela(after,upto){ const m={}; (db.producoes||[]).filter(pr=>pr.data>(after||"")&&pr.data<=upto).forEach(pr=>{const p=byId(db.produtos,pr.produtoId);if(!p||!p.ficha)return;p.ficha.forEach(f=>{m[f.insumoId]=(m[f.insumoId]||0)+num(f.qtd)*num(pr.qtd);});}); return m; }
function perdasJanela(after,upto){ const m={}; (db.perdas||[]).filter(pl=>pl.data>(after||"")&&pl.data<=upto).forEach(pl=>{perdaExpandir(pl).forEach(e=>{m[e.insumoId]=(m[e.insumoId]||0)+e.qtd;});}); return m; }
/* Reconciliação de um dia: sobra anterior + enviado − produção − perdas − contado = desvio */
function reconcileDia(dataISO){
  const cont=contagemMapa(dataISO);
  const prev=ultimaContagemAntes(dataISO);
  const abertura=prev?contagemMapa(prev):null;
  const env=enviadoJanela(prev,dataISO), teo=teoricoJanela(prev,dataISO), per=perdasJanela(prev,dataISO);
  const ids=new Set([...Object.keys(env),...Object.keys(teo),...Object.keys(per),...(abertura?Object.keys(abertura):[]),...(cont?Object.keys(cont):[])]);
  const rows=[];
  ids.forEach(id=>{ const i=byId(db.insumos,id); if(!i) return;
    const ini=abertura?(abertura[id]||0):0, e=env[id]||0, t=teo[id]||0, p=per[id]||0;
    const esperada=ini+e-t-p, contada=cont?(cont[id]||0):0;
    const desvio=cont?(esperada-contada):0, custo=num(i.custoMedio);
    rows.push({id,nome:i.nome,unidade:i.unidade,ini,enviado:e,teorico:t,perdas:p,esperada,contada,desvio,desvioR:desvio*custo,temCont:cont!=null});
  });
  return {data:dataISO,prev,temContagem:cont!=null,rows:rows.sort((a,b)=>a.nome.localeCompare(b.nome))};
}
/* Conciliação de setores sem produção (bar etc.): sobra anterior + entradas − saídas − contado = desvio */
function movJanelaSetor(after,upto,setor,tipo){ const m={}; db.movimentacoes.filter(x=>x.tipo===tipo&&setorDe(x)===setor&&x.data>(after||"")&&x.data<=upto).forEach(x=>{m[x.insumoId]=(m[x.insumoId]||0)+num(x.qtd);}); return m; }
function reconcileSetorDia(dataISO,setor){
  setor=setor||"bar";
  const cont=contagemMapa(dataISO,setor);
  const prev=ultimaContagemAntes(dataISO,setor);
  const abertura=prev?contagemMapa(prev,setor):null;
  const ent=movJanelaSetor(prev,dataISO,setor,"entrada");
  const sai=movJanelaSetor(prev,dataISO,setor,"saida");
  const ids=new Set([...db.insumos.filter(i=>setorDe(i)===setor).map(i=>i.id),...Object.keys(ent),...Object.keys(sai),...(abertura?Object.keys(abertura):[]),...(cont?Object.keys(cont):[])]);
  const rows=[];
  ids.forEach(id=>{ const i=byId(db.insumos,id); if(!i) return;
    const ini=abertura?(abertura[id]||0):0, e=ent[id]||0, s=sai[id]||0;
    const esperada=ini+e-s, contada=cont?(cont[id]||0):0;
    const desvio=cont?(esperada-contada):0, custo=num(i.custoMedio);
    rows.push({id,nome:i.nome,marca:i.marca,unidade:i.unidade,ini,entradas:e,saidas:s,esperada,contada,desvio,desvioR:desvio*custo,baseR:s*custo,temCont:cont!=null});
  });
  return {data:dataISO,prev,temContagem:cont!=null,rows:rows.sort((a,b)=>a.nome.localeCompare(b.nome))};
}
/* Agrega desvios (via fechamentos) num período */
function desvioPeriodo(mode){
  const dias=datasComContagem().filter(d=>inPeriod(d,mode));
  const agg={};
  dias.forEach(d=>{ reconcileDia(d).rows.forEach(r=>{ const a=agg[r.id]=agg[r.id]||{id:r.id,nome:r.nome,unidade:r.unidade,enviado:0,teorico:0,perdas:0,desvio:0,desvioR:0}; a.enviado+=r.enviado;a.teorico+=r.teorico;a.perdas+=r.perdas;a.desvio+=r.desvio;a.desvioR+=r.desvioR; }); });
  return {dias,rows:Object.values(agg).sort((a,b)=>Math.abs(b.desvioR)-Math.abs(a.desvioR))};
}
/* Desvio de um setor (bar/limpeza/descartáveis) num período, via reconcileSetorDia */
function desvioPeriodoSetor(mode,setor){
  const dias=datasComContagem(setor).filter(d=>inPeriod(d,mode));
  const agg={};
  dias.forEach(d=>{ reconcileSetorDia(d,setor).rows.forEach(r=>{ const a=agg[r.id]=agg[r.id]||{id:r.id,nome:r.nome,unidade:r.unidade,entradas:0,saidas:0,desvio:0,desvioR:0,baseR:0}; a.entradas+=r.entradas;a.saidas+=r.saidas;a.desvio+=r.desvio;a.desvioR+=r.desvioR;a.baseR+=(r.baseR||0); }); });
  return {dias,rows:Object.values(agg).sort((a,b)=>Math.abs(b.desvioR)-Math.abs(a.desvioR))};
}
/* Dias do período com movimento mas sem fechamento registrado */
function diasSemContagem(mode){
  const fluxo=new Set();
  db.movimentacoes.filter(m=>m.tipo==="saida"&&setorDe(m)==="cozinha"&&inPeriod(m.data,mode)).forEach(m=>fluxo.add(m.data));
  (db.producoes||[]).filter(pr=>inPeriod(pr.data,mode)).forEach(pr=>fluxo.add(pr.data));
  const cc=new Set(datasComContagem());
  return [...fluxo].filter(d=>!cc.has(d)).sort();
}

function tabbar(){

  const extras=prio.filter(id=>can(id)).slice(0,3);

function cotTotais(c){
  const res=c.respostas||{}; const out=[];
  (c.fornecedorIds||[]).forEach(fid=>{ const arr=res[fid]; if(!arr) return;
    let tot=0, completo=true;
    (c.itens||[]).forEach((it,idx)=>{ const p=num(arr[idx]); if(p>0) tot+=p*num(it.qtd); else completo=false; });
    const f=byId(db.fornecedores,fid); out.push({fid,nome:f?f.nome:"—",total:tot,completo});
  });
  return out;
}
function melhorFornecedor(c){ const t=cotTotais(c).filter(x=>x.completo&&x.total>0); if(!t.length) return null; return t.sort((a,b)=>a.total-b.total)[0]; }

/* ---------- Fluxo de aprovação de compras (SOP) ---------- */
const COTA_STATUS = {
  rascunho:            {label:"Requisição",            cls:"gray",  step:3},

const COTA_FLOW = {
  rascunho:            [{to:"em_cotacao",           label:"Enviar para cotação",              roles:["operacao","compras","gerencia","admin"]}],
  em_cotacao:          [{to:"aguardando_aprovacao", label:"Submeter à Gerência",              roles:["compras","gerencia","admin"], need:"fornecedor"}],
  aguardando_aprovacao:[{to:"aprovado",            label:"Aprovar compra",                   roles:["gerencia","admin"]},
                        {to:"reprovado",           label:"Reprovar",                         roles:["gerencia","admin"], danger:true, obs:true}],
  aprovado:            [{to:"pedido_emitido",       label:"Emitir pedido ao fornecedor",      roles:["compras","admin"]}],
  reprovado:           [{to:"em_cotacao",           label:"Reabrir cotação",                  roles:["compras","gerencia","admin"]}],
  pedido_emitido:      [{to:"recebido",             label:"Registrar recebimento (dar entrada)", roles:["estoque","gerencia","admin"], effect:"receber", obs:true}],
  recebido:            [{to:"liberado_pagamento",   label:"Liberar pagamento",                roles:["financeiro","admin"], obs:true}],
  liberado_pagamento:  [{to:"concluido",            label:"Concluir",                         roles:["financeiro","gerencia","admin"]}]
};
function cotaStatus(c){ return COTA_STATUS[c.status||"rascunho"]||COTA_STATUS.rascunho; }
function cotaAcoes(c){ const arr=COTA_FLOW[c.status||"rascunho"]||[]; return arr.filter(a=>a.roles.includes(state.user.nivel)); }
function cotaMove(id,to){
  const c=byId(db.cotacoes,id); if(!c) return;
  // persiste os preços digitados (se o modal estiver aberto)
  const qinp=document.querySelectorAll(".ct-q");
  if(qinp.length){ const res={}; qinp.forEach(inp=>{const fid=inp.getAttribute("data-fid");const ix=+inp.getAttribute("data-idx");const v=inp.value===""?null:num(inp.value); if(!res[fid])res[fid]=[]; res[fid][ix]=v;}); c.respostas=res; }
  const def=(COTA_FLOW[c.status||"rascunho"]||[]).find(a=>a.to===to); if(!def) return;
  if(!def.roles.includes(state.user.nivel)){ toast("Sua função não pode executar esta etapa.","err"); return; }
  if(def.need==="fornecedor" && !c.fornecedorEscolhido){ toast("Escolha o fornecedor vencedor antes de submeter.","err"); return; }
  let obs="";
  if(def.obs){ obs=(window.prompt(def.label+" — observação (opcional):","")||"").trim(); }
  const de=c.status||"rascunho";
  if(def.effect==="receber"){ cotaReceber(c); }
  c.status=to;
  if(to==="pedido_emitido"){ c.pedido={data:todayISO(),userId:state.user.id}; }
  if(to==="recebido"){ c.recebimento={data:todayISO(),userId:state.user.id,obs}; }
  if(to==="liberado_pagamento"){ c.pagamento={data:todayISO(),userId:state.user.id,obs}; }
  c.historico=c.historico||[]; c.historico.push({ts:Date.now(),data:todayISO(),userId:state.user.id,de,para:to,obs});
  notificarProximaEtapa(c,to);
  save(); toast("Etapa registrada: "+ (COTA_STATUS[to]?COTA_STATUS[to].label:to) +".","ok");
  openCotacao(id);
}

/* Toca bip + vibra quando chega aviso novo com o app aberto */
function checkNovosAvisos(){
  if(!state.user){ state.avisoBaseline=null; state.avisoUser=null; return; }
  const cur=avisosNaoLidos().length;
  if(state.avisoUser!==state.user.id){ state.avisoUser=state.user.id; state.avisoBaseline=cur; return; }
  if(state.avisoBaseline==null){ state.avisoBaseline=cur; return; }
  if(cur>state.avisoBaseline){ tocarAviso(); toast("🔔 Novo aviso: uma cotação chegou para você.","ok"); }
  state.avisoBaseline=cur;
}
function tocarAviso(){
  try{ if(navigator.vibrate) navigator.vibrate([90,50,90]); }catch(e){}
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    if(!window.__ac){ window.__ac=new Ctx(); }
    const ctx=window.__ac; if(ctx.state==="suspended"){ try{ctx.resume();}catch(e){} }
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.connect(g); g.connect(ctx.destination);
    const t=ctx.currentTime; g.gain.setValueAtTime(0.0001,t);
    o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1320,t+0.12);
    g.gain.exponentialRampToValueAtTime(0.28,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.start(t); o.stop(t+0.24);
  }catch(e){}
}
function notificarProximaEtapa(c, to){
  try{
    const acts=COTA_FLOW[to]||[];
    if(!acts.length) return; // etapa final — ninguém a avisar
    const roles=[...new Set(acts.flatMap(a=>a.roles||[]))];
    const labels=[...new Set(acts.map(a=>a.label))].join(" / ");
    const etapa=(COTA_STATUS[to]?COTA_STATUS[to].label:to);
    notificar("Cotação “"+(c.nome||"sem nome")+"” chegou em "+etapa+". Ação pendente: "+labels+".", roles, c.id, "compra");
  }catch(e){}
}
function avisosNaoLidos(){
  const u=state.user; if(!u) return [];
  return (db.notificacoes||[]).filter(n=>(n.roles||[]).includes(u.nivel) && !((n.lidaPor||[]).includes(u.id)));
}
function bellHTML(){
  const n=avisosNaoLidos().length;
  return `<button class="btn ghost icon tb-bell" data-act="avisos" title="Avisos" style="position:relative">🔔${n?`<span class="bell-badge">${n>9?"9+":n}</span>`:""}</button>`;
}
function abrirAvisos(){
  const u=state.user; if(!u) return;
  const mine=(db.notificacoes||[]).filter(n=>(n.roles||[]).includes(u.nivel)).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,60);
  const body = mine.length ? `<div class="avlist">`+mine.map(n=>{
      const unread=!((n.lidaPor||[]).includes(u.id));

/* Recebimento: dá entrada no estoque e atualiza custo médio pelo preço do fornecedor escolhido */
function cotaReceber(c){
  const fid=c.fornecedorEscolhido; const arr=(c.respostas||{})[fid]||[];
  (c.itens||[]).forEach((it,idx)=>{
    const i=byId(db.insumos,it.insumoId); if(!i) return;
    const qtd=num(it.qtd); if(qtd<=0) return;
    const preco=num(arr[idx]);
    // custo médio ponderado (se houver preço do fornecedor)
    if(preco>0){ const estAnt=num(i.estoque); const custoAnt=num(i.custoMedio); const novo=estAnt+qtd; i.custoMedio = novo>0 ? (estAnt*custoAnt + qtd*preco)/novo : preco; }
    // entrada no estoque (respeita lotes)
    if(temLotes(i)) addLote(i,qtd,""); else i.estoque=num(i.estoque)+qtd;
    db.movimentacoes.push({id:uid(),data:todayISO(),tipo:"entrada",insumoId:i.id,qtd,setor:setorDe(i),obs:"Recebimento — "+(c.nome||"cotação"),usuarioId:state.user.id});
  });
}

function printCotacao(id){

  const secOrdem=Object.keys(SETORES).filter(s=>grupos[s]);

    body+=`<tr class="grp"><td colspan="${2+suppliers.length}"><b>${setorInfo(s).ic} ${esc(setorInfo(s).label)}</b></td></tr>`;

  </div>`;
  let area=document.getElementById("print-area"); if(!area){area=document.createElement("div");area.id="print-area";document.body.appendChild(area);}
  area.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing"); if(window.removeEventListener)window.removeEventListener("afterprint",done);};
  if(window.addEventListener)window.addEventListener("afterprint",done);

/* Lê a proposta de um fornecedor por foto e preenche a coluna dele via IA */
function scanProposta(cid, fid){
  const c=byId(db.cotacoes,cid); if(!c) return;
  if(!(typeof SB!=="undefined" && SB.on)){ toast("A leitura por IA só funciona na versão na nuvem (Supabase).","err"); return; }
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,application/pdf"; inp.multiple=true; inp.style.display="none";
  document.body.appendChild(inp);
  inp.addEventListener("change", async ()=>{
    const files=[...(inp.files||[])]; inp.remove();
    if(!files.length) return;
    const forn=byId(db.fornecedores,fid);
    const btns=[...document.querySelectorAll('[data-act="scan-proposta"][data-fid="'+fid+'"]')];
    const prev=btns[0]?btns[0].textContent:""; btns.forEach(b=>{ b.disabled=true; b.textContent="⏳ Lendo…"; });
    toast("Lendo a proposta com IA… leva alguns segundos.","ok");
    try{
      const images=[];
      for(const f of files){
        const isPdf = (f.type==="application/pdf") || /\.pdf$/i.test(f.name||"");
        if(isPdf){
          if(f.size>9*1024*1024){ toast("O PDF “"+(f.name||"")+"” é grande demais (máx. ~9 MB). Envie um PDF menor ou fotos.","err"); continue; }
          const d=await readFileDataURL(f); if(d) images.push(d);
        } else {
          const d=await downscaleImage(f,1568,0.82); if(d) images.push(d);
        }
      }
      if(!images.length){ toast("Não consegui ler o arquivo. Tente uma foto nítida ou um PDF menor.","err"); return; }
      const itens=(c.itens||[]).map((it,idx)=>{ const i=byId(db.insumos,it.insumoId); return {idx, nome:(i?i.nome:""), marca:(i&&i.marca)||"", unidade:(i?i.unidade:""), qtd:num(it.qtd)}; });
      const {data,error}=await SB.client.functions.invoke("analisar-proposta",{body:{fornecedor:(forn?forn.nome:""), itens, images}});
      let msg=null;
      if(error){ msg="Não foi possível ler a proposta."; try{ if(error.context&&error.context.json){ const j=await error.context.json(); if(j&&j.error) msg=j.error; } }catch(_){} }
      else if(data&&data.error){ msg=data.error; }
      if(msg){ toast(msg,"err"); return; }
      let n=0;
      (data&&Array.isArray(data.itens)?data.itens:[]).forEach(r=>{
        if(r && r.encontrado && r.preco!=null && !isNaN(r.preco)){
          const el=document.querySelector('.ct-q[data-fid="'+fid+'"][data-idx="'+r.idx+'"]');
          if(el){ el.value=(Math.round(r.preco*100)/100); el.classList.add("scanned"); n++; }
        }
      });
      if(typeof updateCotComparacao==="function") updateCotComparacao();
      toast(n?("Proposta lida: "+n+" item(ns) preenchido(s). Confira os valores em azul e ajuste se preciso."):"A IA não encontrou preços legíveis. Tente uma foto mais nítida e reta.", n?"ok":"err");
    }catch(e){ toast("Erro ao ler a proposta. Verifique a conexão e tente novamente.","err"); }
    finally{ btns.forEach(b=>{ b.disabled=false; if(prev) b.textContent=prev; }); }
  });
  inp.click();
}
function readFileDataURL(file){
  return new Promise(res=>{ try{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(file); }catch(e){ res(null); } });
}
function downscaleImage(file, maxEdge, quality){
  return new Promise(res=>{
    try{
      const url=URL.createObjectURL(file); const img=new Image();
      img.onload=()=>{ try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const scale=Math.min(1,(maxEdge||1568)/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const d=cv.toDataURL("image/jpeg", quality||0.82);
        URL.revokeObjectURL(url); res(d);
      }catch(e){ res(null); } };
      img.onerror=()=>{ res(null); };
      img.src=url;
    }catch(e){ res(null); }
  });
}
function updateCotComparacao(){
  const wrap=document.getElementById("ct-table"); if(!wrap) return;
  const rows=[...wrap.querySelectorAll("tbody tr[data-qty]")];
  const totals={}; wrap.querySelectorAll(".ct-tot").forEach(td=>totals[td.getAttribute("data-fid")]=0);
  const subt={}; wrap.querySelectorAll(".ct-subtot").forEach(td=>{const s=td.getAttribute("data-sec"),f=td.getAttribute("data-fid");(subt[s]=subt[s]||{})[f]=0;});
  rows.forEach(tr=>{ const inputs=[...tr.querySelectorAll(".ct-q")]; const qty=num(tr.getAttribute("data-qty")); const sec=tr.getAttribute("data-sec");
    let min=Infinity; inputs.forEach(inp=>{const v=num(inp.value); if(v>0&&v<min)min=v;});
    inputs.forEach(inp=>{const v=num(inp.value); inp.style.background=(v>0&&v===min)?"var(--basil-soft)":""; if(v>0){const f=inp.getAttribute("data-fid"); totals[f]+=v*qty; if(subt[sec]&&subt[sec][f]!=null) subt[sec][f]+=v*qty;}});
  });
  wrap.querySelectorAll(".ct-subtot").forEach(td=>{const s=td.getAttribute("data-sec"),f=td.getAttribute("data-fid"); const t=(subt[s]&&subt[s][f])||0; td.textContent=t>0?BRL(t):"—";});
  let best=Infinity,bestFid=null; Object.entries(totals).forEach(([fid,t])=>{if(t>0&&t<best){best=t;bestFid=fid;}});
  wrap.querySelectorAll(".ct-tot").forEach(td=>{const fid=td.getAttribute("data-fid");const t=totals[fid];td.textContent=t>0?BRL(t):"—";td.style.color=(fid===bestFid)?"var(--basil)":"";td.style.background=(fid===bestFid)?"var(--basil-soft)":"";});
}

async function buscaCNPJ(){
  const el=$("#f-cnpj"); if(!el) return; const d=(el.value||"").replace(/\D/g,""); const st=$("#f-cnpj-st");
  if(d.length!==14){ if(st&&el.value.trim()){ st.className="fld-st err"; st.textContent="CNPJ deve ter 14 dígitos."; } return; }
  if(st){ st.className="fld-st"; st.textContent="buscando…"; }
  try{
    const r=await fetch("https://brasilapi.com.br/api/cnpj/v1/"+d); if(!r.ok) throw 0; const j=await r.json();
    const seOk=(id,v)=>{ const e=$(id); if(e&&v) e.value=v; };
    const seVazio=(id,v)=>{ const e=$(id); if(e&&v&&!e.value.trim()) e.value=v; };
    seVazio("#f-nome", j.razao_social||j.nome_fantasia||"");
    seOk("#f-cep",(j.cep||"").toString()); seOk("#f-endereco",j.logradouro||""); seOk("#f-numero",(j.numero||"").toString()); seOk("#f-bairro",j.bairro||""); seOk("#f-cidade",j.municipio||""); seOk("#f-uf",(j.uf||"").toUpperCase());
    seVazio("#f-tel",(j.ddd_telefone_1||"").toString()); seVazio("#f-email",(j.email||"").toLowerCase());
    if(st){ st.className="fld-st ok"; st.textContent="✓ dados preenchidos — confira e ajuste"; }
  }catch(e){ if(st){ st.className="fld-st err"; st.textContent="CNPJ não encontrado — preencha manualmente."; } }
}
async function buscaCEP(){
  const el=$("#f-cep"); if(!el) return; const d=(el.value||"").replace(/\D/g,""); const st=$("#f-cep-st");
  if(d.length!==8){ if(st&&el.value.trim()){ st.className="fld-st err"; st.textContent="CEP deve ter 8 dígitos."; } return; }

        const tot=prevQ+addQ; ins.estoque=tot; ins.custoMedio= tot>0? (prevQ*prevC+addQ*addC)/tot : addC; });
      db.compras.push({id:uid(),data,fornecedorId,itens:itens.map(it=>({insumoId:it.insumoId,qtd:num(it.qtd),custoUnit:num(it.custoUnit)}))});
      save(); toast("Compra registrada e estoque atualizado.","ok"); return true;
    },"wide");
  renderDraftCompra();
}

function printSaidaSetor(dataISO, setor){

  const map={};
  db.movimentacoes.filter(m=>m.tipo==="saida"&&m.data===data&&setorDe(m)===setor).forEach(m=>{map[m.insumoId]=(map[m.insumoId]||0)+num(m.qtd);});
  const rows=Object.entries(map).map(([id,q])=>{const i=byId(db.insumos,id)||{};return {nome:i.nome||"—",un:i.unidade||"",marca:i.marca||"",q};}).sort((a,b)=>a.nome.localeCompare(b.nome));
  const html=`<div class="rep">

    <div class="rep-meta"><span><b>Data:</b> ${fmtDate(data)}</span><span><b>Emitido em:</b> ${fmtDate(todayISO())}</span><span><b>Itens:</b> ${rows.length}</span></div>

    <div class="sig"><div class="line">Entregue por (estoque)</div><div class="line">Recebido por (${esc(S.label)})</div></div>
    <div class="foot">Kitchen Sync — lista gerada automaticamente.</div></div>`;
  let area=document.getElementById("print-area"); if(!area){area=document.createElement("div");area.id="print-area";document.body.appendChild(area);}
  area.innerHTML=html; document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing"); if(window.removeEventListener)window.removeEventListener("afterprint",done);};

function vFechamento(){
  const data=state.fechData||todayISO();
  const rc=reconcileDia(data);
  const rmap={}; rc.rows.forEach(r=>rmap[r.id]=r);
  const existente=contagemMapa(data);
  const jaFechado=existente!=null;

    const r=rmap[i.id]||{ini:0,enviado:0,teorico:0,perdas:0,esperada:0};
    const esp=r.esperada;
    const val=existente&&existente[i.id]!=null?existente[i.id]:null;
    const contada=val!=null?val:0;
    const desv=esp-contada, custo=num(i.custoMedio);
    const base=r.teorico+r.perdas, perc=base>0?desv/base*100:0;
    const fl=perdaFlag(perc,base>0);

      <td class="strong">${esc(i.nome)}</td>

      <td class="r fc-desv" data-ins="${i.id}"><span class="pill ${fl.cls}">${(desv>0?"+":"")+BRL(desv*custo)}</span></td></tr>`;

  const contRec=contagemDe(data);
  const fechadoPor=contRec?nomeUsuario(contRec.usuarioId):null;
  // histórico de fechamentos
  const hist=datasComContagem().sort((a,b)=>b.localeCompare(a)).slice(0,14).map(dd=>{
    const rcx=reconcileDia(dd); let dr=0; rcx.rows.forEach(r=>dr+=r.desvioR);

  return `

      <label class="muted" style="font-size:13px">Dia do fechamento</label>

    </div>
    <div class="spacer"></div>
    <span class="pill">Desvio do dia: <b id="fech-total">${(totDesv>0?"+":"")+BRL(totDesv)}</b></span>
    <button class="btn ghost" data-act="print-fechamento">🖨 Relatório</button>

  </div>
  <div class="card"><div class="card-body flush"><div class="tbl-wrap">
    <table class="tbl"><thead><tr>
      <th>Insumo</th><th class="r">Sobra anterior</th><th class="r">Enviado (+aditivos)</th><th class="r">Consumo produção</th><th class="r">Perdas</th><th class="r">Sobra esperada</th><th class="r">Sobra contada</th><th class="r">Desvio</th>

  </div></div></div>
  <div class="muted" style="font-size:12.5px;margin-top:10px">Conta por insumo: <b>sobra anterior + enviado − consumo da produção − perdas − sobra contada = desvio</b>. “Enviado” já inclui os aditivos do dia (toda saída lançada em <b>Cozinha (Ent/Saída)</b>). Desvio positivo (vermelho) = faltou na contagem → investigar. Perto de zero (verde) = conciliado. A sobra contada de hoje vira a <b>sobra anterior</b> de amanhã.</div>
  ${hist.length?`<div class="card" style="margin-top:14px"><div class="card-head"><h3>📜 Fechamentos recentes</h3></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">

/* ===== NFC-e (cupom fiscal) via Focus NFe — emissão e status ===== */
function sbOnline(){ return (typeof SB!=="undefined" && SB.on && SB.client); }
function nfcePill(v){
  const s=v.nfce&&v.nfce.status;
  if(!s) return `<span class="pill gray">sem nota</span>`;
  if(s==="autorizada") return `<span class="pill green">NFC-e${v.nfce.numero?(" nº "+esc(String(v.nfce.numero))):""}</span>`;
  if(s==="processando") return `<span class="pill amber">emitindo…</span>`;
  if(s==="cancelada") return `<span class="pill red">cancelada</span>`;
  if(s==="erro") return `<span class="pill red" title="${esc(v.nfce.mensagem||"")}">rejeitada</span>`;
  return `<span class="pill">${esc(s)}</span>`;
}
function nfceAcoesHTML(v){
  if(!can("vendas")||!moduloAtivo("fiscal")) return "";
  const s=v.nfce&&v.nfce.status;
  if(s==="autorizada") return v.nfce.url_danfce?`<button class="btn sm ghost" data-act="nfce-ver" data-id="${v.id}">Cupom</button>`:"";
  if(s==="processando") return `<button class="btn sm ghost" data-act="nfce-status" data-id="${v.id}">Atualizar</button>`;
  return `<button class="btn sm ghost" data-act="emitir-nfce" data-id="${v.id}">Emitir</button>`;
}
function formEmitirNFCe(id){
  const v=byId(db.vendas,id); if(!v) return;
  if(!sbOnline()){ toast("A emissão fiscal funciona na versão online (Supabase).","err"); return; }
  const fisc=(db.config&&db.config.fiscal)||{};
  const tk=(fisc.ambiente==="producao")?fisc.tokenProd:fisc.tokenHomolog;

async function emitirNFCe(id,cpf,nome){
  const v=byId(db.vendas,id); if(!v) return;
  if(!sbOnline()){ toast("Disponível na versão online.","err"); return; }
  v.nfce={status:"processando",ref:v.id}; save(); render();
  const pagamentos=(v.pagamentos&&v.pagamentos.length)?v.pagamentos:[{forma:v.pagamento||"Dinheiro",valor:vendaTotal(v)}];
  try{
    const {data,error}=await SB.client.functions.invoke("emitir-nfce",{body:{action:"emitir",ref:v.id,itens:(v.itens||[]),pagamentos,canal:v.canal||"",cpf:cpf||"",nome:nome||""}});
    if(error) throw error;
    if(data&&data.error){ v.nfce={status:"erro",mensagem:data.error,ref:v.id}; save(); render(); toast("Falha: "+data.error,"err"); return; }
    v.nfce=data; save(); render();
    if(data.status==="autorizada") toast("NFC-e autorizada!"+(data.numero?(" Nº "+data.numero):""),"ok");
    else if(data.status==="erro") toast("Rejeitada: "+(data.mensagem||"veja os detalhes"),"err");
    else toast("NFC-e em processamento — toque em “Atualizar” em instantes.","ok");
  }catch(e){ v.nfce={status:"erro",mensagem:String((e&&e.message)||e),ref:v.id}; save(); render(); toast("Erro ao emitir. Confira Configurações → Fiscal.","err"); }
}

/* ============================================================
   MARGENS & KPIs (gestão baseada em dados)
   ============================================================ */
function comissaoVenda(v){
  const canal=(v.canal||"").toLowerCase();
  if(canal.indexOf("ifood")>=0){
    return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); const tx=p?(num(p.ifCom)+num(p.ifTx)+num(p.ifAnt)):0; return s+num(it.qtd)*num(it.preco)*tx/100; },0);
  }
  const pag=(v.pagamento||"").toLowerCase();
  if(pag.indexOf("cart")>=0){
    return (v.itens||[]).reduce((s,it)=>{ const p=byId(db.produtos,it.produtoId); const tx=(p&&p.cartao!=null)?num(p.cartao):num((db.config&&db.config.cartaoPadrao)||0); return s+num(it.qtd)*num(it.preco)*tx/100; },0);
  }
  return 0;
}
function kpisPeriodo(mode){
  const vendas=db.vendas.filter(v=>inPeriod(v.data,mode));
  const receita=vendas.reduce((s,v)=>s+vendaTotal(v),0);
  const cmvTeorico=vendas.reduce((s,v)=>s+vendaCMV(v),0);
  const imp=num(db.config.impostoPercent)/100;
  const impostos=receita*imp;
  const comissoes=vendas.reduce((s,v)=>s+comissaoVenda(v),0);
  const mc=receita-cmvTeorico-impostos-comissoes;
  let desvioR=0; desvioPeriodo(mode).rows.forEach(r=>desvioR+=r.desvioR);
  Object.keys(SETORES).filter(s=>SETORES[s].fechamento).forEach(s=>{ desvioPeriodoSetor(mode,s).rows.forEach(r=>desvioR+=r.desvioR); });
  const perdas=(db.perdas||[]).filter(p=>inPeriod(p.data,mode)).reduce((s,p)=>s+perdaValor(p),0);
  const vazamento=Math.max(0,desvioR)+perdas;
  const cmvTeoricoPct=receita>0?cmvTeorico/receita*100:0;
  const variacaoPct=receita>0?vazamento/receita*100:0;
  const cmvRealPct=cmvTeoricoPct+variacaoPct;
  const mcPct=receita>0?mc/receita*100:0;
  const nped=vendas.length;
  const pessoas=vendas.reduce((s,v)=>s+num(v.pessoas),0);
  const porConc={};
  vendas.forEach(v=>{ (v.itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); const cn=p?conceitoDe(p):"Geral"; const o=porConc[cn]=porConc[cn]||{conceito:cn,receita:0,cmv:0,qtd:0}; o.receita+=num(it.qtd)*num(it.preco); o.cmv+=num(it.qtd)*custoProduto(p); o.qtd+=num(it.qtd); }); });
  Object.values(porConc).forEach(o=>{ o.impostos=o.receita*imp; o.mc=o.receita-o.cmv-o.impostos; o.cmvPct=o.receita>0?o.cmv/o.receita*100:0; o.mcPct=o.receita>0?o.mc/o.receita*100:0; o.part=receita>0?o.receita/receita*100:0; });
  const porCanal={};
  vendas.forEach(v=>{ const cn=v.canal||"Balcão"; const o=porCanal[cn]=porCanal[cn]||{canal:cn,receita:0,cmv:0,comissoes:0,nped:0}; o.receita+=vendaTotal(v); o.cmv+=vendaCMV(v); o.comissoes+=comissaoVenda(v); o.nped++; });
  Object.values(porCanal).forEach(o=>{ o.impostos=o.receita*imp; o.mc=o.receita-o.cmv-o.impostos-o.comissoes; o.mcPct=o.receita>0?o.mc/o.receita*100:0; o.part=receita>0?o.receita/receita*100:0; });
  return {vendas,receita,cmvTeorico,impostos,comissoes,mc,mcPct,cmvTeoricoPct,variacaoPct,cmvRealPct,vazamento,desvioR,perdas,nped,pessoas,
    ticketPed:nped>0?receita/nped:0, ticketPes:pessoas>0?receita/pessoas:0,
    porConc:Object.values(porConc).sort((a,b)=>b.receita-a.receita),
    porCanal:Object.values(porCanal).sort((a,b)=>b.receita-a.receita)};
}
function menuEngineering(mode){
  const vendas=db.vendas.filter(v=>inPeriod(v.data,mode));
  const agg={};
  vendas.forEach(v=>(v.itens||[]).forEach(it=>{ const p=byId(db.produtos,it.produtoId); if(!p) return; const a=agg[p.id]=agg[p.id]||{id:p.id,nome:p.nome,conceito:conceitoDe(p),qtd:0,receita:0,custo:0}; a.qtd+=num(it.qtd); a.receita+=num(it.qtd)*num(it.preco); a.custo+=num(it.qtd)*custoProduto(p); }));
  const rows=Object.values(agg); if(!rows.length) return {rows:[]};
  rows.forEach(r=>{ r.mcUnit=r.qtd>0?(r.receita-r.custo)/r.qtd:0; });
  const med=arr=>{const a=arr.slice().sort((x,y)=>x-y);return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0;};
  const medQ=med(rows.map(r=>r.qtd)), medM=med(rows.map(r=>r.mcUnit));
  rows.forEach(r=>{ const altaPop=r.qtd>=medQ, altaMar=r.mcUnit>=medM; r.classe=altaPop&&altaMar?"Estrela":altaPop&&!altaMar?"Cavalo de batalha":!altaPop&&altaMar?"Enigma":"Abacaxi"; r.cls=altaPop&&altaMar?"green":altaPop&&!altaMar?"amber":!altaPop&&altaMar?"gray":"red"; });
  return {rows:rows.sort((a,b)=>b.receita-a.receita),medQ,medM};
}
function salaoKpis(mode){
  const cfg=db.config||{};
  const mesas=num(cfg.numMesas)||0, lugares=num(cfg.lugares)||0, horasDia=num(cfg.horasDia)||0;
  const vs=db.vendas.filter(v=>inPeriod(v.data,mode) && (v.canal||"Balcão")==="Salão");
  const receitaSalao=vs.reduce((s,v)=>s+vendaTotal(v),0);
  const pessoas=vs.reduce((s,v)=>s+num(v.pessoas),0);
  const diaDe=ts=>{ try{ return new Date(ts).toISOString().slice(0,10); }catch(e){ return ""; } };
  const cds=(db.comandas||[]).filter(c=>c.status==="fechada"&&c.fechamento&&inPeriod(diaDe(c.fechamento),mode));
  const comandas=cds.length;
  const perms=cds.map(c=>(c.fechamento-c.abertura)/60000).filter(m=>m>0&&m<24*60);
  const permMin=perms.length?perms.reduce((a,b)=>a+b,0)/perms.length:0;
  const dias=new Set(); vs.forEach(v=>dias.add(v.data)); cds.forEach(c=>dias.add(diaDe(c.fechamento)));
  const diasOper=Math.max(1,dias.size);
  const giro= mesas>0 ? comandas/(mesas*diasOper) : (comandas>0?comandas/diasOper:0);
  const seatHours=lugares*horasDia*diasOper;
  const revpash= seatHours>0 ? receitaSalao/seatHours : 0;
  return {mesas,lugares,horasDia,receitaSalao,pessoas,comandas,permMin,diasOper,giro,revpash,ticketPes:pessoas>0?receitaSalao/pessoas:0,temMesas:(mesas>0||lugares>0)};
}
/* ---------- Mesas / Comandas ---------- */
function comandaTotal(c){ return (c.itens||[]).reduce((s,it)=>s+num(it.qtd)*num(it.preco),0); }
function taxaServicoPct(){ const t=(db.config&&db.config.taxaServico); return t==null?10:num(t); }
function comandaServicoVal(c){ return (c.servicoOn===false)?0:comandaTotal(c)*taxaServicoPct()/100; }
function comandaTotalGeral(c){ return comandaTotal(c)+comandaServicoVal(c); }
function comandaPend(c){ return (c.itens||[]).filter(it=>it.status==="novo").length; }

function formPagamentoComanda(id){
  const c=byId(db.comandas,id); if(!c) return;
  if(!(c.itens||[]).length){ toast("Adicione itens antes de cobrar.","err"); return; }
  const total=comandaTotalGeral(c); const porPessoa=c.pessoas>0?total/c.pessoas:total;

        <input class="input" id="pg-valor" type="number" step="0.01" placeholder="Valor" style="max-width:120px">

      </div>
    </div>
    <div id="pg-lista"></div>
    <div id="pg-resumo" class="muted" style="font-size:13px;margin-top:8px"></div>`,
    ()=>{ const pago=draftPag.reduce((s,p)=>s+num(p.valor),0);
      if(draftPag.length===0){ // pagamento simples: usa a forma selecionada pelo total
        const f=$("#pg-forma").value; draftPag=[{forma:f,valor:total}];
      }
      const pg=draftPag.reduce((s,p)=>s+num(p.valor),0);
      if(pg+0.009<total){ toast("Falta "+BRL(total-pg)+" para cobrir o total.","err"); return false; }
      fecharComanda(id, draftPag.slice()); return true; },"");

}
function atualizaPagResumo(id){
  const c=byId(db.comandas,id); if(!c) return; const total=comandaTotalGeral(c);
  const lista=$("#pg-lista"); if(lista){ lista.innerHTML=draftPag.map((p,i)=>`<div class="hstack" style="justify-content:space-between;background:var(--panel-2);border-radius:8px;padding:7px 10px;margin-top:6px"><span>${esc(p.forma)}</span><span class="hstack" style="gap:10px"><b>${BRL(p.valor)}</b><button class="rmv" data-act="pg-rm" data-i="${i}">×</button></span></div>`).join(""); }
  const pago=draftPag.reduce((s,p)=>s+num(p.valor),0); const rest=total-pago;
  const r=$("#pg-resumo"); if(r){ r.innerHTML = draftPag.length? (rest>0.009?`Falta: <b style="color:var(--danger)">${BRL(rest)}</b>`:(rest<-0.009?`Troco: <b style="color:var(--basil)">${BRL(-rest)}</b>`:`<b style="color:var(--basil)">Pagamento completo ✓</b>`)) : `Sem pagamentos ainda — ao confirmar, cobra ${BRL(total)} na forma selecionada.`; }
  const vi=$("#pg-valor"); if(vi&&!vi.value&&rest>0) vi.placeholder="Restante "+BRL(rest);
}
function fecharComanda(id, pagamentos){
  const c=byId(db.comandas,id); if(!c||c.status!=="aberta") return;
  if(!(c.itens||[]).length){ toast("Adicione itens antes de fechar.","err"); return; }
  c.status="fechada"; c.fechamento=Date.now(); c.pagamentos=pagamentos||[];
  const itensN=c.itens.map(it=>({produtoId:it.produtoId,qtd:num(it.qtd),preco:num(it.preco)}));
  const baixas=baixasDaVenda(itensN); aplicarBaixas(baixas,-1);
  const permMin=Math.round((c.fechamento-c.abertura)/60000);
  const formas=(pagamentos&&pagamentos.length)?[...new Set(pagamentos.map(p=>p.forma))].join(" + "):"Outro";
  const cxA=caixaAberto();
  db.vendas.push({id:uid(),data:todayISO(),ts:Date.now(),pagamento:formas,canal:"Salão",pessoas:num(c.pessoas),mesa:c.mesa,permanenciaMin:permMin,comandaId:c.id,itens:itensN,baixas,servico:comandaServicoVal(c),pagamentos:pagamentos||[],caixaId:cxA?cxA.id:null});
  state.comandaId=null; save(); toast("Mesa fechada — venda de salão registrada.","ok"); render();
}

/* ===== Caixa / PDV de balcão — abertura, sangria/suprimento e fechamento ===== */
function caixaAberto(){ return (db.caixas||[]).find(c=>c.status==="aberto")||null; }
function vendaDinheiro(v){
  if(Array.isArray(v.pagamentos)&&v.pagamentos.length) return v.pagamentos.filter(p=>/dinheiro/i.test(p.forma||"")).reduce((s,p)=>s+num(p.valor),0);
  return /dinheiro/i.test(v.pagamento||"")?vendaTotal(v):0;
}
function caixaResumo(cx){
  const vendas=(db.vendas||[]).filter(v=>v.caixaId===cx.id);
  const dinheiro=vendas.reduce((s,v)=>s+vendaDinheiro(v),0);
  const receita=vendas.reduce((s,v)=>s+vendaTotal(v),0);
  const supr=(cx.movimentos||[]).filter(m=>m.tipo==="suprimento").reduce((s,m)=>s+num(m.valor),0);
  const sang=(cx.movimentos||[]).filter(m=>m.tipo==="sangria").reduce((s,m)=>s+num(m.valor),0);
  const esperado=num(cx.fundoInicial)+dinheiro+supr-sang;
  return {vendas,nped:vendas.length,dinheiro,receita,outras:receita-dinheiro,supr,sang,esperado};
}

async function buscaCEPEntrega(){
  const el=$("#e-cep"); if(!el) return; const d=(el.value||"").replace(/\D/g,""); const st=$("#e-cep-st");
  if(d.length!==8){ if(st&&el.value.trim()){ st.className="fld-st err"; st.textContent="CEP deve ter 8 dígitos."; } return; }
  if(st){ st.className="fld-st"; st.textContent="buscando…"; }
  try{
    const r=await fetch("https://viacep.com.br/ws/"+d+"/json/"); if(!r.ok) throw 0; const j=await r.json(); if(j.erro) throw 0;
    const seOk=(id,v)=>{ const e=$(id); if(e&&v) e.value=v; };
    seOk("#e-endereco",j.logradouro||""); seOk("#e-bairro",j.bairro||""); seOk("#e-cidade",j.localidade||""); seOk("#e-uf",(j.uf||"").toUpperCase());
    if(st){ st.className="fld-st ok"; st.textContent="✓ endereço preenchido"; }
  }catch(e){ if(st){ st.className="fld-st err"; st.textContent="CEP não encontrado."; } }
}

function qrSVG(text,cell){
  try{ const q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:cell||4,margin:2,scalable:true}); }
  catch(e){ return `<div class="muted" style="font-size:11px">QR indisponível</div>`; }
}
function cardapioTenantId(){ return (typeof SB!=="undefined" && SB.on && SB.tenantId) ? SB.tenantId : null; }
function cardapioBaseURL(){ return location.origin+location.pathname; }
function cardapioLink(mesa){ const b=cardapioBaseURL(); const t=cardapioTenantId(); return b+"?m="+encodeURIComponent(t||"")+(mesa?("&mesa="+encodeURIComponent(mesa)):""); }

function vAnalises(){
  const mode=state.period.analises;
  const vendasP=db.vendas.filter(v=>inPeriod(v.data,mode));
  // rank produtos
  const rank={};
  vendasP.forEach(v=>(v.itens||[]).forEach(it=>{const p=byId(db.produtos,it.produtoId);if(!p)return;
    rank[p.id]=rank[p.id]||{nome:p.nome,qtd:0,rec:0,luc:0};
    rank[p.id].qtd+=num(it.qtd); rank[p.id].rec+=num(it.qtd)*num(it.preco); rank[p.id].luc+=num(it.qtd)*(num(it.preco)-custoProduto(p));}));
  const arr=Object.values(rank);
  const vend=[...arr].sort((a,b)=>b.qtd-a.qtd).slice(0,8);
  const luc=[...arr].sort((a,b)=>b.luc-a.luc).slice(0,8);
  const maxV=Math.max(1,...vend.map(x=>x.qtd)), maxL=Math.max(1,...luc.map(x=>x.luc));
  // custo por fornecedor
  const comprasP=db.compras.filter(c=>inPeriod(c.data,mode));
  const forn={}; comprasP.forEach(c=>{forn[c.fornecedorId]=(forn[c.fornecedorId]||0)+compraTotal(c);});
  const fornArr=Object.entries(forn).map(([id,v])=>({nome:(byId(db.fornecedores,id)||{}).nome||"—",v})).sort((a,b)=>b.v-a.v);
  const maxF=Math.max(1,...fornArr.map(x=>x.v));
  // daily: insumos p/ cozinha (real) vs produção (real) vs consumo teórico vs perdas vs vendas
  const days={};
  const dobj=d=>(days[d]=days[d]||{ins:0,prodItens:0,teo:0,perda:0,vend:0});
  db.movimentacoes.filter(m=>m.tipo==="saida"&&setorDe(m)==="cozinha"&&inPeriod(m.data,mode)).forEach(m=>{const i=byId(db.insumos,m.insumoId);dobj(m.data).ins+=num(m.qtd)*(i?num(i.custoMedio):0);});
  (db.producoes||[]).filter(pr=>inPeriod(pr.data,mode)).forEach(pr=>{const o=dobj(pr.data);o.prodItens+=num(pr.qtd);o.teo+=producaoCustoTeorico(pr);});
  (db.perdas||[]).filter(pl=>inPeriod(pl.data,mode)).forEach(pl=>{dobj(pl.data).perda+=perdaValor(pl);});
  vendasP.forEach(v=>{dobj(v.data).vend+=vendaTotal(v);});
  const dayRows=Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,31);
  // controle de perdas por insumo (período)
  const varRows=varianciaInsumos(mode);
  const totReal=varRows.reduce((s,r)=>s+r.qtReal*num((byId(db.insumos,r.id)||{}).custoMedio),0);
  const totTeo=varRows.reduce((s,r)=>s+r.qtTeo*num((byId(db.insumos,r.id)||{}).custoMedio),0);
  const totPerda=perdaTotalValor(mode);
  const totNaoExpl=totReal-totTeo-totPerda;
  const baseTot=totTeo+totPerda;
  const temProducao=(db.producoes||[]).some(pr=>inPeriod(pr.data,mode));
  // perdas por motivo
  const porMotivo=perdaPorMotivo(mode);
  const motArr=Object.entries(porMotivo).map(([m,v])=>({m,v})).sort((a,b)=>b.v-a.v);
  const maxM=Math.max(1,...motArr.map(x=>x.v));
  // desvio via fechamentos (contagem física)
  const dp=desvioPeriodo(mode);
  const pend=diasSemContagem(mode);
  const totDesvioR=dp.rows.reduce((s,r)=>s+r.desvioR,0);
  const baseDesvio=dp.rows.reduce((s,r)=>{const i=byId(db.insumos,r.id)||{};return s+(r.teorico+r.perdas)*num(i.custoMedio);},0);
  const temFechamento=dp.dias.length>0;
  // consolidado: cozinha + setores com fechamento
  const setoresF=Object.keys(SETORES).filter(k=>SETORES[k].fechamento);
  const dsSet=setoresF.map(s=>{const dpS=desvioPeriodoSetor(mode,s);return {s,tot:dpS.rows.reduce((a,r)=>a+r.desvioR,0),base:dpS.rows.reduce((a,r)=>a+(r.baseR||0),0),dias:dpS.dias.length};}).filter(x=>x.dias>0);
  const consolidado=totDesvioR+dsSet.reduce((a,x)=>a+x.tot,0);
  const temAlgumFech=temFechamento||dsSet.length>0;
  const diaDesvioR={}; const diaBaseR={};
  dp.dias.forEach(d=>{const rc=reconcileDia(d);let dr=0,bs=0;rc.rows.forEach(r=>{const i=byId(db.insumos,r.id);const c=i?num(i.custoMedio):0;dr+=r.desvio*c;bs+=(r.teorico+r.perdas)*c;});diaDesvioR[d]=dr;diaBaseR[d]=bs;});

  const lab=mode==="dia"?"hoje":mode==="mes"?"neste mês":mode==="ano"?"neste ano":"no total";

    <div class="seg" data-seg="analises">
