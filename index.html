      <button data-p="mes" class="${mode==="mes"?"on":""}">Mês</button>
      <button data-p="ano" class="${mode==="ano"?"on":""}">Ano</button>
      <button data-p="total" class="${mode==="total"?"on":""}">Tudo</button>
    </div>
  </div>
  ${temAlgumFech?`<div class="card" style="margin-bottom:14px"><div class="card-body">
    <div class="hstack" style="align-items:center;gap:16px;flex-wrap:wrap">
      <div>
        <div class="muted" style="font-size:12px">Desvio consolidado — todos os setores (${lab})</div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:${consolidado>0?"var(--brand)":consolidado<0?"var(--basil)":"inherit"}">${(consolidado>0?"+":"")+BRL(consolidado)}</div>
      </div>
      <div class="spacer"></div>
      <div class="hstack" style="gap:8px;flex-wrap:wrap">
        ${temFechamento?`<span class="pill ${Math.abs(totDesvioR)<1?"green":Math.abs(totDesvioR)<20?"amber":"red"}">🔥 Cozinha: <b>${(totDesvioR>0?"+":"")+BRL(totDesvioR)}</b></span>`:""}
        ${dsSet.map(x=>`<span class="pill ${setorFlag(x.tot,x.base,x.s).cls}">${setorInfo(x.s).ic} ${esc(setorInfo(x.s).label)}: <b>${(x.tot>0?"+":"")+BRL(x.tot)}</b></span>`).join("")}
        <button class="btn ghost" data-act="export-desvios">⤓ CSV desvios</button>
      </div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Soma dos desvios apurados nos fechamentos de cozinha e demais setores no período. Positivo (laranja) = faltou na contagem → investigar.</div>
  </div>`:""}
  <div class="two-col">
    <div class="card"><div class="card-head"><h3>🏆 Mais vendidos</h3><div class="spacer"></div><span class="muted">${lab}</span></div>
      <div class="card-body">${vend.length?`<div class="bars">${vend.map(x=>`
        <div class="bar-row"><div class="lab">${esc(x.nome)}</div><div class="bar-track"><div class="bar-fill" style="width:${x.qtd/maxV*100}%"></div></div><div class="bar-val">${NUM(x.qtd)} un</div></div>`).join("")}</div>`:emptyBox("📉","Sem dados","Sem vendas no período.")}</div></div>
    <div class="card"><div class="card-head"><h3>💰 Mais lucrativos</h3><div class="spacer"></div><span class="muted">${lab}</span></div>
      <div class="card-body">${luc.length?`<div class="bars">${luc.map(x=>`
        <div class="bar-row"><div class="lab">${esc(x.nome)}</div><div class="bar-track"><div class="bar-fill g" style="width:${Math.max(0,x.luc)/maxL*100}%"></div></div><div class="bar-val">${BRL(x.luc)}</div></div>`).join("")}</div>`:emptyBox("📉","Sem dados","Sem vendas no período.")}</div></div>
  </div>

  <div class="card" style="margin-top:14px"><div class="card-head"><h3>🚚 Custo de compras por fornecedor</h3><div class="spacer"></div><span class="muted">${lab}</span></div>
    <div class="card-body">${fornArr.length?`<div class="bars">${fornArr.map(x=>`
      <div class="bar-row"><div class="lab">${esc(x.nome)}</div><div class="bar-track"><div class="bar-fill a" style="width:${x.v/maxF*100}%"></div></div><div class="bar-val">${BRL(x.v)}</div></div>`).join("")}</div>`:emptyBox("🛒","Sem compras","Sem compras registradas no período.")}</div></div>

  <div class="card" style="margin-top:14px"><div class="card-head"><h3>📅 Insumos p/ cozinha × produção × vendas (por dia)</h3></div>
    <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Dia</th><th class="r">Insumos p/ cozinha (R$)</th><th class="r">Produção (itens)</th><th class="r">Consumo teórico (R$)</th><th class="r">Perdas (R$)</th><th class="r">Vendas (R$)</th><th class="r">Desvio (contagem)</th></tr></thead>
      <tbody>${dayRows.length?dayRows.map(([d,o])=>{let cell;if(diaDesvioR[d]!==undefined){const dr=diaDesvioR[d];const base=diaBaseR[d]||0;const perc=base>0?dr/base*100:0;const fl=perdaFlag(perc,base>0);cell=`<span class="pill ${fl.cls}" title="Sobra anterior + enviado − produção − perdas − contagem">${(dr>0?"+":"")+BRL(dr)}${base>0?" ("+(dr>0?"+":"")+NUM(perc,0)+"%)":""}</span>`;}else{cell='<span class="pill gray" title="Faça o Fechamento Diário deste dia">aguardando fechamento</span>';}return `<tr><td class="mono">${fmtDate(d)}</td><td class="r">${BRL(o.ins)}</td><td class="r">${NUM(o.prodItens)}</td><td class="r">${o.teo>0?BRL(o.teo):'<span class="muted">—</span>'}</td><td class="r">${o.perda>0?BRL(o.perda):'<span class="muted">—</span>'}</td><td class="r strong">${BRL(o.vend)}</td><td class="r">${cell}</td></tr>`;}).join(""):`<tr><td colspan="7">${emptyBox("📊","Sem dados diários","Registre saídas para a cozinha, produção e vendas.")}</td></tr>`}</tbody>
    </table></div></div></div>
  <div class="muted" style="font-size:12.5px;margin-top:10px">O <b>desvio</b> vem do <b>Fechamento Diário</b> (contagem física): sobra anterior + enviado − consumo da produção − perdas − sobra contada. Dias sem fechamento aparecem como “aguardando fechamento”.</div>

  ${motArr.length?`<div class="card" style="margin-top:14px"><div class="card-head"><h3>🧾 Perdas por motivo</h3><div class="spacer"></div><span class="muted">${lab} · total ${BRL(totPerda)}</span></div>
    <div class="card-body"><div class="bars">${motArr.map(x=>`
      <div class="bar-row"><div class="lab">${esc(x.m)}</div><div class="bar-track"><div class="bar-fill a" style="width:${x.v/maxM*100}%"></div></div><div class="bar-val">${BRL(x.v)}</div></div>`).join("")}</div></div></div>`:""}

  <div class="card" style="margin-top:14px"><div class="card-head"><h3>⚖️ Controle de perdas e desvios (por insumo)</h3><div class="spacer"></div><span class="muted">${lab}</span></div>
    <div class="card-body">
      ${temFechamento?`
      <div class="hstack" style="gap:14px;flex-wrap:wrap;margin-bottom:12px">
        <div class="pill">Enviado à cozinha: <b>${BRL(dp.rows.reduce((s,r)=>{const i=byId(db.insumos,r.id)||{};return s+r.enviado*num(i.custoMedio);},0))}</b></div>
        <div class="pill">Consumo produção: <b>${BRL(dp.rows.reduce((s,r)=>{const i=byId(db.insumos,r.id)||{};return s+r.teorico*num(i.custoMedio);},0))}</b></div>
        <div class="pill">Perdas justificadas: <b>${BRL(dp.rows.reduce((s,r)=>{const i=byId(db.insumos,r.id)||{};return s+r.perdas*num(i.custoMedio);},0))}</b></div>
        <div class="pill ${perdaFlag(baseDesvio>0?totDesvioR/baseDesvio*100:0,baseDesvio>0).cls}">Desvio (contagem): <b>${(totDesvioR>0?"+":"")+BRL(totDesvioR)}${baseDesvio>0?" ("+(totDesvioR>0?"+":"")+NUM(totDesvioR/baseDesvio*100,0)+"%)":""}</b></div>
      </div>
      ${pend.length?`<div class="pill amber" style="margin-bottom:10px">⚠️ ${pend.length} dia(s) sem fechamento não entram no desvio: ${pend.map(fmtDate).join(", ")}</div>`:""}
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Insumo</th><th class="r">Enviado à cozinha</th><th class="r">Consumo produção</th><th class="r">Perdas registradas</th><th class="r">Desvio (qtd)</th><th class="r">Desvio (R$)</th><th>Situação</th></tr></thead>
        <tbody>${dp.rows.length?dp.rows.map(r=>{const i=byId(db.insumos,r.id)||{};const base=r.teorico+r.perdas;const perc=base>0?r.desvio/base*100:0;const fl=perdaFlag(perc,base>0);return `<tr>
          <td class="strong">${esc(r.nome)}</td>
          <td class="r">${NUM(r.enviado)} ${esc(r.unidade||"")}</td>
          <td class="r">${r.teorico>0?NUM(r.teorico)+" "+esc(r.unidade||""):'<span class="muted">—</span>'}</td>
          <td class="r">${r.perdas>0?NUM(r.perdas)+" "+esc(r.unidade||""):'<span class="muted">—</span>'}</td>
          <td class="r" style="color:${r.desvio>0?"var(--brand)":r.desvio<0?"var(--basil)":"inherit"}">${(r.desvio>0?"+":"")+NUM(r.desvio)} ${esc(r.unidade||"")}</td>
          <td class="r strong" style="color:${r.desvioR>0?"var(--brand)":r.desvioR<0?"var(--basil)":"inherit"}">${(r.desvioR>0?"+":"")+BRL(r.desvioR)}</td>
          <td><span class="pill ${fl.cls}">${fl.txt}</span></td></tr>`;}).join(""):`<tr><td colspan="7">${emptyBox("✅","Tudo conciliado","Nenhum desvio nos fechamentos do período.")}</td></tr>`}</tbody>
      </table></div>
      <div class="muted" style="font-size:12.5px;margin-top:10px">Fórmula por insumo: <b>sobra anterior + enviado − consumo da produção − perdas − sobra contada = desvio</b>. Positivo (vermelho) = faltou na contagem física → investigar desvio. Perto de zero (verde) = conciliado. Negativo = contagem/perdas acima do esperado. Limite de alerta: ${NUM((db.config&&db.config.perdaLimite)||5)}% (ajustável em Configurações). Os desvios vêm dos fechamentos diários; a conclusão (perda x furto) exige conferência humana.</div>`
      :(temProducao?`
      <div class="pill amber" style="margin-bottom:10px">Sem fechamento no período — números provisórios (assumem sobra zero na cozinha). Faça o <b>Fechamento Diário</b> para apurar o desvio real.</div>
      <div class="hstack" style="gap:14px;flex-wrap:wrap;margin-bottom:12px">
        <div class="pill">Enviado à cozinha: <b>${BRL(totReal)}</b></div>
        <div class="pill">Consumo teórico: <b>${BRL(totTeo)}</b></div>
        <div class="pill">Perdas justificadas: <b>${BRL(totPerda)}</b></div>
        <div class="pill ${perdaFlag(baseTot>0?totNaoExpl/baseTot*100:0,baseTot>0).cls}">A conferir: <b>${(totNaoExpl>0?"+":"")+BRL(totNaoExpl)}</b></div>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Insumo</th><th class="r">Enviado</th><th class="r">Consumo teórico</th><th class="r">Perdas</th><th class="r">A conferir (qtd)</th><th class="r">A conferir (R$)</th><th>Situação</th></tr></thead>
        <tbody>${varRows.map(r=>{const fl=perdaFlag(r.perc,r.temBase);return `<tr>
          <td class="strong">${esc(r.nome)}</td>
          <td class="r">${NUM(r.qtReal)} ${esc(r.unidade||"")}</td>
          <td class="r">${r.qtTeo>0?NUM(r.qtTeo)+" "+esc(r.unidade||""):'<span class="muted">—</span>'}</td>
          <td class="r">${r.qtPerda>0?NUM(r.qtPerda)+" "+esc(r.unidade||""):'<span class="muted">—</span>'}</td>
          <td class="r" style="color:${r.naoExpl>0?"var(--brand)":r.naoExpl<0?"var(--basil)":"inherit"}">${(r.naoExpl>0?"+":"")+NUM(r.naoExpl)} ${esc(r.unidade||"")}</td>
          <td class="r strong" style="color:${r.dr>0?"var(--brand)":r.dr<0?"var(--basil)":"inherit"}">${(r.dr>0?"+":"")+BRL(r.dr)}</td>
          <td><span class="pill ${fl.cls}">${fl.txt}</span></td></tr>`;}).join("")}</tbody>
      </table></div>`
      :emptyBox("🍳","Registre a produção","Sem produção lançada no período. Registre em <b>Produção</b>, as <b>Perdas</b> e faça o <b>Fechamento Diário</b> para apurar desvios."))}
    </div></div>
  ${(()=>{
    const setores=Object.keys(SETORES).filter(k=>SETORES[k].fechamento);
    const blocks=setores.map(setor=>{
      const S=setorInfo(setor); const dpS=desvioPeriodoSetor(mode,setor);
      if(!dpS.dias.length) return "";
      const tot=dpS.rows.reduce((s,r)=>s+r.desvioR,0);
      const baseTotS=dpS.rows.reduce((s,r)=>s+(r.baseR||0),0);
      const clsT=setorFlag(tot,baseTotS,setor).cls;
      const rows=dpS.rows.map(r=>{const fl=setorFlag(r.desvioR,r.baseR,setor);const cls=fl.cls;return `<tr>
        <td class="strong">${esc(r.nome)}</td>
        <td class="r">${NUM(r.entradas)} ${esc(r.unidade||"")}</td>
        <td class="r">${NUM(r.saidas)} ${esc(r.unidade||"")}</td>
        <td class="r" style="color:${r.desvio>0?"var(--brand)":r.desvio<0?"var(--basil)":"inherit"}">${(r.desvio>0?"+":"")+NUM(r.desvio)} ${esc(r.unidade||"")}</td>
        <td class="r strong" style="color:${r.desvioR>0?"var(--brand)":r.desvioR<0?"var(--basil)":"inherit"}">${(r.desvioR>0?"+":"")+BRL(r.desvioR)}</td>
        <td><span class="pill ${cls}">${fl.txt}</span></td></tr>`;}).join("");
      return `<div class="card" style="margin-top:14px"><div class="card-head"><h3>${S.ic} Desvios — ${esc(S.label)}</h3><div class="spacer"></div><span class="pill ${clsT}">Total: ${(tot>0?"+":"")+BRL(tot)}</span> <span class="muted" style="margin-left:8px">${dpS.dias.length} fechamento(s)</span></div>
        <div class="card-body flush"><div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Item</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Desvio (qtd)</th><th class="r">Desvio (R$)</th><th>Situação</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="6">${emptyBox(S.ic,"Sem desvios","Nada a conferir no período.")}</td></tr>`}</tbody>
        </table></div></div></div>`;
    }).filter(Boolean).join("");
    return blocks?`<h3 style="margin:24px 4px 2px;font-family:'Bricolage Grotesque',sans-serif;font-size:16px">Desvios mensais por setor</h3>${blocks}<div class="muted" style="font-size:12.5px;margin-top:8px">Cada setor concilia por <b>sobra anterior + entradas − saídas − sobra contada</b>, a partir do <b>Fechamento Bar/Setor</b>. Só aparecem setores com fechamento registrado no período.</div>`:"";
  })()}`;
}

  ${toolbar("Buscar funcionário…", soAdmin?(sbCloud?`<button class="btn primary" data-act="add-user-cloud">＋ Novo funcionário</button>`:(!cloud?`<button class="btn primary" data-act="add-user">＋ Novo funcionário</button>`:"")):"")}

    <tbody>${list.length?list.map(u=>`
      <tr><td class="strong">${esc(u.nome)} ${u.id===state.user.id?'<span class="pill">você</span>':""}</td>

      <td><div class="rowacts">
        ${soAdmin?`<button class="btn sm ghost" data-act="edit-user" data-id="${u.id}">Editar</button>`:""}
        ${(soAdmin && u.id!==state.user.id)?`<button class="btn sm ghost danger" data-act="del-user" data-id="${u.id}">${cloud?"Remover":"Excluir"}</button>`:""}

    </tbody></table>
  </div></div></div>
  <div class="card" style="margin-top:14px"><div class="card-body">
    <h3 style="font-size:15px;margin-bottom:10px">Funções e responsabilidades (conforme o fluxo da operação)</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Função</th><th>Responsabilidades</th></tr></thead><tbody>
      ${Object.keys(ROLES).map(k=>`<tr><td><span class="pill">${ROLES[k]}</span></td><td class="muted">${esc(ROLES_DESC[k]||"")}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:8px">As telas que cada função enxerga já seguem essas responsabilidades. Ajuste a função da pessoa acima para conceder o acesso certo.</div>
  </div></div>`;
}
function formUser(u){
  const cloud = !!cloudActive();
  u=u||{ativo:true,nivel:"operacao"};
  openModal("Funcionário",`
    <div class="form-grid">
      <div class="field full"><label>Nome completo *</label><input class="input" id="u-nome" value="${esc(u.nome||"")}"></div>
      ${cloud
        ? `<div class="field full"><label>E-mail (conta de acesso)</label><input class="input" id="u-login" value="${esc(u.login||"")}" readonly style="opacity:.65"></div>`
        : `<div class="field"><label>Login *</label><input class="input" id="u-login" value="${esc(u.login||"")}"></div>
           <div class="field"><label>Senha ${u.id?"(deixe em branco p/ manter)":"*"}</label><input class="input" id="u-senha" type="text" placeholder="${u.id?"••••••":""}"></div>`}
      <div class="field"><label>Função *</label><select class="input" id="u-nivel">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.nivel===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label>Salário mensal (R$)</label><input class="input" id="u-sal" type="number" step="0.01" value="${u.salario!=null?u.salario:0}"></div>
      <div class="field"><label>Telefone</label><input class="input" id="u-tel" value="${esc(u.tel||"")}"></div>
      <div class="field"><label class="inl"><input type="checkbox" id="u-ativo" ${u.ativo!==false?"checked":""}> Acesso ativo</label></div>
    </div>
    <div class="muted" style="font-size:12px" id="u-role-desc">${esc(ROLES_DESC[u.nivel]||"")}</div>`,
    ()=>{ const nome=$("#u-nome").value.trim();
      if(!nome){toast("Informe o nome.","err");return false;}
      if(cloud){
        if(!u.id){ toast("Novos usuários entram com a própria conta; eles aparecem aqui após o primeiro acesso.","err"); return false; }
        const ex=byId(db.usuarios,u.id); Object.assign(ex,{nome,nivel:$("#u-nivel").value,salario:num($("#u-sal").value),tel:$("#u-tel").value.trim(),ativo:$("#u-ativo").checked}); if(ex.id===state.user.id)state.user=ex;
        save(); toast("Acesso atualizado.","ok"); return true;
      }
      const login=$("#u-login").value.trim().toLowerCase(),senha=$("#u-senha").value;
      if(!login){toast("Informe o login.","err");return false;}
      if(db.usuarios.some(x=>(x.login||"").toLowerCase()===login&&x.id!==u.id)){toast("Já existe usuário com esse login.","err");return false;}
      if(!u.id&&!senha){toast("Defina uma senha.","err");return false;}

   ============================================================ */
let modalSave=null;
function openModal(title,body,onSave,size,readonly){
  const ex=$("#modal"); if(ex) ex.remove();
  modalSave=onSave;
  const foot = readonly
    ? `<button class="btn" data-act="modal-close">Fechar</button>`
    : `<button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="modal-save">Salvar</button>`;
  const wrap=document.createElement("div");
  wrap.className="backdrop"; wrap.id="modal";
  wrap.innerHTML=`<div class="modal ${size==="wide"?"wide":""}">
    <div class="modal-head"><h3>${esc(title)}</h3><div class="spacer"></div><button class="btn icon ghost" data-act="modal-close">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("mousedown",e=>{ if(e.target===wrap) closeModal(); });
  attachPasswordEyes(wrap);
  const first=wrap.querySelector("input,select,textarea"); if(first) setTimeout(()=>first.focus(),30);
}
/* Adiciona o olho (mostrar/ocultar) em todo campo de senha */
function attachPasswordEyes(root){
  (root||document).querySelectorAll('input[type="password"]').forEach(inp=>{
    if(inp.dataset.eye) return; inp.dataset.eye="1";
    const wrap=document.createElement("span"); wrap.className="pweye-wrap";
    if(inp.parentNode){ inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp); }
    const b=document.createElement("button"); b.type="button"; b.className="pweye"; b.setAttribute("aria-label","Mostrar/ocultar senha"); b.textContent="👁";
    b.addEventListener("click",()=>{ const hidden=inp.type==="password"; inp.type=hidden?"text":"password"; b.textContent=hidden?"🙈":"👁"; try{inp.focus();}catch(e){} });
    wrap.appendChild(b);
  });
}
function closeModal(){ const m=$("#modal"); if(m) m.remove(); modalSave=null; }
async function trySave(){ if(!modalSave){closeModal();return;} const btn=document.querySelector("#modal [data-act='modal-save']"); let prev; if(btn){ prev=btn.textContent; } let ok=modalSave(); if(ok&&typeof ok.then==="function"){ if(btn){ btn.disabled=true; btn.textContent="Aguarde…"; } try{ ok=await ok; }catch(e){ ok=false; } if(btn){ btn.disabled=false; if(prev!=null) btn.textContent=prev; } } if(ok!==false){ closeModal(); render(); } }

/* ---------- Toast ---------- */
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300);},2200); }

/* Sugestões de autocomplete na busca: nomes já cadastrados da tela atual */
function preencherSugestoesBusca(){
  const dl=$("#searchlist"); if(!dl) return;
  const nomes=new Set();
  document.querySelectorAll(".content .tbl tbody td.strong").forEach(td=>{
    const t=(td.textContent||"").trim().split("\n")[0].trim();
    if(t && t.length>1) nomes.add(t);
  });
  dl.innerHTML=[...nomes].slice(0,60).map(n=>`<option value="${esc(n)}"></option>`).join("");
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-view]");
  if(nav){ state.view=nav.getAttribute("data-view"); state.search=""; state.sidebarOpen=false; render(); return; }
  const seg=e.target.closest("[data-seg] button");
  if(seg){ const key=seg.parentElement.getAttribute("data-seg"); state.period[key]=seg.getAttribute("data-p"); render(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.getAttribute("data-act"); const id=a.getAttribute("data-id"); const idx=a.getAttribute("data-idx"); const setor=a.getAttribute("data-setor")||"cozinha";
  switch(act){
    case "login": doLogin(); break;
    case "sb-login": doSbAuth(); break;
    case "sb-toggle": state.authMode = (state.authMode==="signup"?"login":"signup"); renderAuth(); break;
    case "sb-esqueci": renderEsqueciSenha(); break;
    case "sb-reset": enviarReset(); break;
    case "sb-nova-senha": salvarNovaSenha(); break;
    case "sb-voltar-login": state.authMode="login"; renderAuth(); break;
    case "reload": if(typeof location!=="undefined") location.reload(); break;
    case "logout":
      if(typeof SB!=="undefined" && SB.on){ if(confirm("Sair da conta?")){ SB.client.auth.signOut().then(()=>{ state.user=null; renderAuth(); }).catch(()=>{ state.user=null; renderAuth(); }); } }
      else if(confirm("Sair do sistema?")){ state.user=null; render(); }
      break;
    case "theme": toggleTheme(); break;
    case "open-side": state.sidebarOpen=true; render(); break;
    case "close-side": state.sidebarOpen=false; render(); break;
    case "modal-close": closeModal(); break;
    case "modal-save": trySave(); break;

    /* fornecedores */

/* ---------- Exports ---------- */
function exportVendas(){
  const rows=[["Data","Itens","Pagamento","CMV","Total"]];
  [...db.vendas].sort((a,b)=>a.data.localeCompare(b.data)).forEach(v=>{
    rows.push([fmtDate(v.data),(v.itens||[]).map(it=>{const p=byId(db.produtos,it.produtoId);return `${it.qtd}x ${p?p.nome:""}`;}).join(" | "),v.pagamento||"",vendaCMV(v).toFixed(2),vendaTotal(v).toFixed(2)]);
  });
  download("vendas-"+todayISO()+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"));
  toast("CSV de vendas gerado.","ok");
}
function exportDRE(){
  const ym=state.dreMonth;
  const vendasM=db.vendas.filter(v=>inMonth(v.data,ym));
  const receita=vendasM.reduce((s,v)=>s+vendaTotal(v),0);
  const imposto=receita*num(db.config.impostoPercent)/100;
  const cmv=vendasM.reduce((s,v)=>s+vendaCMV(v),0);
  const despTot=db.despesas.filter(d=>inMonth(d.data,ym)).reduce((s,d)=>s+num(d.valor),0);
  const folha=db.usuarios.filter(u=>u.ativo&&num(u.salario)>0).reduce((s,u)=>s+num(u.salario),0);
  const rows=[["DRE",ym],["Receita bruta",receita.toFixed(2)],["Impostos",(-imposto).toFixed(2)],["Receita liquida",(receita-imposto).toFixed(2)],["CMV",(-cmv).toFixed(2)],["Lucro bruto",(receita-imposto-cmv).toFixed(2)],["Despesas operacionais",(-despTot).toFixed(2)],["Folha",(-folha).toFixed(2)],["Resultado",(receita-imposto-cmv-despTot-folha).toFixed(2)]];
  download("dre-"+ym+".csv",rows.map(r=>r.join(";")).join("\n"));
  toast("CSV do DRE gerado.","ok");
}
function exportDesvios(){
  const mode=state.period.analises;
  const lab=mode==="dia"?"dia":mode==="mes"?"mes":mode==="ano"?"ano":"total";
  const rows=[["Setor","Item","Unidade","Entradas/Enviado","Saidas/Consumo","Perdas","Desvio (qtd)","Desvio (R$)"]];
  desvioPeriodo(mode).rows.forEach(r=>{rows.push(["Cozinha",r.nome,r.unidade||"",NUM(r.enviado),NUM(r.teorico),NUM(r.perdas),NUM(r.desvio),r.desvioR.toFixed(2)]);});
  Object.keys(SETORES).filter(k=>SETORES[k].fechamento).forEach(setor=>{
    desvioPeriodoSetor(mode,setor).rows.forEach(r=>{rows.push([setorInfo(setor).label,r.nome,r.unidade||"",NUM(r.entradas),NUM(r.saidas),"",NUM(r.desvio),r.desvioR.toFixed(2)]);});
  });
  if(rows.length===1){ toast("Sem fechamentos no período para exportar.","err"); return; }
  download("desvios-"+lab+"-"+todayISO()+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"));
  toast("CSV de desvios gerado.","ok");
}
function exportVencimentos(){
  const rows=[["Setor","Item","Marca","Validade","Dias","Quantidade","Unidade","Situacao"]];
  const lista=[];
  db.insumos.forEach(i=>lotesDe(i).forEach(l=>{ if(l.validade){ const d=diasAte(l.validade); lista.push({i,l,d}); } }));
  lista.sort((a,b)=>a.d-b.d);
  lista.forEach(({i,l,d})=>{ const sit=d<0?"Vencido":d<=7?"Urgente":d<=30?"Proximo":"Ok"; rows.push([setorInfo(setorDe(i)).label,i.nome,i.marca||"",fmtDate(l.validade),d,NUM(l.qtd),i.unidade,sit]); });
  if(rows.length===1){ toast("Nenhum item com validade cadastrada.","err"); return; }

/* ---------- Baixa automática de vencidos (registra perda "Vencido") ---------- */
function processarVencidos(){
  if(db.config && db.config.baixaVencidoAuto===false) return 0;
  let n=0;
  (db.insumos||[]).forEach(i=>{
    if(i.lotes && i.lotes.length){
      const vivos=[];
      i.lotes.forEach(l=>{ const dd=diasAte(l.validade); if(l.validade && dd!==null && dd<0 && num(l.qtd)>0){
        db.perdas=db.perdas||[]; db.perdas.push({id:uid(),data:l.validade,tipo:"insumo",insumoId:i.id,qtd:num(l.qtd),motivo:"Vencido",obs:"Baixa automática por vencimento (lote)",usuarioId:(state.user&&state.user.id)||null}); n++;
      } else { vivos.push(l); } });
      i.lotes=vivos; syncEstoqueLotes(i);
    } else {
      const dd=diasAte(i.validade);
      if(dd!==null && dd<0 && num(i.estoque)>0){
        db.perdas=db.perdas||[]; db.perdas.push({id:uid(),data:i.validade,tipo:"insumo",insumoId:i.id,qtd:num(i.estoque),motivo:"Vencido",obs:"Baixa automática por vencimento",usuarioId:(state.user&&state.user.id)||null});
        i.estoque=0; i.validade=""; n++;
      }
    }
  });
  if(n) save();
  return n;
}

/* ============================================================
   NUVEM — banco compartilhado (db) + identidade (user)
   Modo nuvem quando publicado; senão, modo local (localStorage).
   ============================================================ */
function emptyDb(){ return {config:{},usuarios:[],fornecedores:[],insumos:[],produtos:[],compras:[],movimentacoes:[],producoes:[],perdas:[],contagens:[],cotacoes:[],vendas:[],despesas:[],comandas:[],caixas:[],entregas:[],notificacoes:[]}; }
function cloudActive(){ if(typeof SB!=="undefined" && SB.on) return SB; if(typeof CLOUD!=="undefined" && CLOUD.on) return CLOUD; return null; }
function syncIndicatorHTML(){
  const A=cloudActive(); if(!A) return "";
  const map={idle:["gray","☁︎ nuvem"],syncing:["amber","⟳ sincronizando…"],synced:["green","☁︎ sincronizado"],error:["red","⚠︎ falha ao sincronizar"],offline:["red","⚠︎ sem conexão"]};
  const st=map[A.status]||map.idle;
  return `<span id="sync-ind" class="pill ${st[0]}" title="Dados compartilhados entre os aparelhos" style="margin-right:6px">${st[1]}</span>`;
}
const CLOUD = {
  on:false, db:null, user:null, uid:null, isOwner:false, canWrite:true, myName:"",
  cols:["config","usuarios","fornecedores","insumos","produtos","compras","movimentacoes","producoes","perdas","contagens","cotacoes","vendas","despesas","comandas","caixas","entregas","notificacoes"],
  hashes:{}, subs:[], pushTimer:null, status:"idle",
  docPath(c){ return "state/"+c; },
  hash(x){ try{ const s=JSON.stringify(x); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return s.length+":"+h; }catch(e){ return "e"+Math.random(); } },
  pack(c){ return c==="config" ? {config:db.config||{}} : {rows:db[c]||[]}; },
  unpack(c,data){ if(!data) return; if(c==="config"){ db.config=data.config||{}; } else { db[c]=Array.isArray(data.rows)?data.rows:[]; } },
  async init(){
    let cdb=null;
    try{ cdb = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }catch(e){ cdb=null; }
    if(!cdb) return false;
    this.db=cdb; this.on=true;
    try{ this.user = await window.claude.use("user"); }catch(e){ this.user=null; }
    return true;
  },
  async whoami(){
    if(this.user){
      try{ this.uid = await this.user.id(); }catch(e){}
      try{ this.isOwner = await this.user.isOwner(); }catch(e){}
      try{ const cw = await this.user.can("data.write"); this.canWrite = (cw!==false); }catch(e){}
      try{ const me = await this.user.me(); this.myName = (me&&me.name)||""; }catch(e){}
    }
    return this.uid;
  },
  async loadAll(){
    const results={}; let any=false;
    for(const c of this.cols){ try{ const s=await this.db.doc(this.docPath(c)).get(); if(s.exists){ results[c]=s.data(); any=true; } }catch(e){} }
    if(!any){
      let lease={acquired:true};
      try{ lease = await this.db.doc("state/_seedlock").acquire({holder:(this.uid||"boot"),ttlMs:20000}); }catch(e){}
      let already=false; try{ already=(await this.db.doc(this.docPath("config")).get()).exists; }catch(e){}
      if(lease.acquired && !already){
        db=seed(); ensureSchema(); await this.pushAll();
      } else {
        for(const c of this.cols){ try{ const s=await this.db.doc(this.docPath(c)).get(); if(s.exists) results[c]=s.data(); }catch(e){} }
        db=emptyDb(); this.cols.forEach(c=>this.unpack(c,results[c])); ensureSchema();
      }
    } else {
      db=emptyDb(); this.cols.forEach(c=>this.unpack(c,results[c])); ensureSchema();
    }
    this.cols.forEach(c=>{ this.hashes[c]=this.hash(this.pack(c)); });
  },
  async pushAll(){ for(const c of this.cols){ try{ await this.db.doc(this.docPath(c)).set(this.pack(c)); this.hashes[c]=this.hash(this.pack(c)); }catch(e){} } },
  push(){
    if(!this.on) return;
    if(!this.canWrite){ return; }
    clearTimeout(this.pushTimer);
    this.setStatus("syncing");
    this.pushTimer=setTimeout(async ()=>{
      let err=false;
      for(const c of this.cols){ const h=this.hash(this.pack(c)); if(h!==this.hashes[c]){ try{ await this.db.doc(this.docPath(c)).set(this.pack(c)); this.hashes[c]=h; }catch(e){ err=true; } } }
      this.setStatus(err?"error":"synced");
    }, 450);
  },
  subscribeAll(){
    for(const c of this.cols){
      try{
        const un=this.db.doc(this.docPath(c)).onSnapshot(snap=>{
          if(!snap.exists) return;
          const data=snap.data();
          const h=this.hash(c==="config"?{config:data.config||{}}:{rows:Array.isArray(data.rows)?data.rows:[]});
          if(h===this.hashes[c]) return;               // eco do nosso próprio write / sem mudança
          this.unpack(c,data); this.hashes[c]=h; ensureSchema();
          this.setStatus("synced");
          if(state.user && !document.querySelector(".modal-back")){ try{ render(); }catch(e){} }
        }, e=>{});
        this.subs.push(un);
      }catch(e){}
    }
  },
  setStatus(s){ this.status=s; const el=document.getElementById("sync-ind"); if(el){ const t=document.createElement("div"); t.innerHTML=syncIndicatorHTML(); if(t.firstElementChild) el.replaceWith(t.firstElementChild); } }
};
const SB = {
  on:false, client:null, uid:null, email:"", canWrite:true, tenantId:null,
  cols:["config","usuarios","fornecedores","insumos","produtos","compras","movimentacoes","producoes","perdas","contagens","cotacoes","vendas","despesas","comandas","caixas","entregas","notificacoes"],
  hashes:{}, pushTimer:null, status:"idle",
  configured(){ return typeof SUPA_URL==="string" && SUPA_URL && typeof SUPA_KEY==="string" && SUPA_KEY && typeof supabase!=="undefined" && supabase.createClient; },
  async init(){ if(!this.configured()) return false; try{ this.client=supabase.createClient(SUPA_URL,SUPA_KEY); this.on=true; return true; }catch(e){ return false; } },
  async session(){ try{ const {data}=await this.client.auth.getSession(); return data.session||null; }catch(e){ return null; } },
  async fetchTenant(){ try{ const {data,error}=await this.client.from("memberships").select("tenant_id").eq("user_id",this.uid).maybeSingle(); this.tenantId=(!error&&data)?data.tenant_id:null; }catch(e){ this.tenantId=null; } await this.fetchModulos(); return this.tenantId; },

  async loadAll(){

    try{ const {data,error}=await this.client.from("app_state").select("k,data").eq("tenant_id",this.tenantId); if(!error&&data){ data.forEach(r=>{ results[r.k]=r.data; any=true; }); } }catch(e){}
    if(!any){ db=emptyDb(); ensureSchema(); await this.pushAll(); }
    else { db=emptyDb(); this.cols.forEach(c=>CLOUD.unpack(c,results[c])); ensureSchema(); }
    this.cols.forEach(c=>{ this.hashes[c]=CLOUD.hash(CLOUD.pack(c)); });
  },
  async pushAll(){ for(const c of this.cols){ try{ await this.client.from("app_state").upsert({tenant_id:this.tenantId,k:c,data:CLOUD.pack(c),updated_at:new Date().toISOString()},{onConflict:"tenant_id,k"}); this.hashes[c]=CLOUD.hash(CLOUD.pack(c)); }catch(e){} } },
  push(){
    if(!this.on) return;
    clearTimeout(this.pushTimer); this.setStatus("syncing");
    this.pushTimer=setTimeout(async ()=>{
      let err=false;
      for(const c of this.cols){ const h=CLOUD.hash(CLOUD.pack(c)); if(h!==this.hashes[c]){ try{ const {error}=await this.client.from("app_state").upsert({tenant_id:this.tenantId,k:c,data:CLOUD.pack(c),updated_at:new Date().toISOString()},{onConflict:"tenant_id,k"}); if(error){err=true;} else {this.hashes[c]=h;} }catch(e){err=true;} } }
      this.setStatus(err?((typeof navigator!=="undefined"&&navigator.onLine===false)?"offline":"error"):"synced");
    },450);
  },
  subscribeAll(){
    try{
      this.client.channel("app_state_"+(this.tenantId||"x")).on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"tenant_id=eq."+this.tenantId},payload=>{
        const row=payload.new||payload.old; if(!row||!row.k) return;
        if(row.tenant_id && row.tenant_id!==this.tenantId) return;
        const c=row.k; if(this.cols.indexOf(c)<0) return;
        const data=payload.new?payload.new.data:null; if(!data) return;
        const h=CLOUD.hash(c==="config"?{config:data.config||{}}:{rows:Array.isArray(data.rows)?data.rows:[]});
        if(h===this.hashes[c]) return;
        CLOUD.unpack(c,data); this.hashes[c]=h; ensureSchema(); this.setStatus("synced");
        if(state.user && !document.querySelector(".modal-back")){ try{render();}catch(e){} }
      }).subscribe(st=>{ if(st==="SUBSCRIBED"){ this.setStatus("synced"); } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ this.setStatus("offline"); } });
    }catch(e){}
  },
  setStatus(s){ this.status=s; const el=document.getElementById("sync-ind"); if(el){ const t=document.createElement("div"); t.innerHTML=syncIndicatorHTML(); if(t.firstElementChild) el.replaceWith(t.firstElementChild); } }
};

async function salvarNovaSenha(){
  const senha=$("#ns-senha")?$("#ns-senha").value:""; const btn=$("#ns-btn");
  if((senha||"").length<6){ renderNovaSenha("A senha precisa de pelo menos 6 caracteres."); return; }
  if(btn){ btn.textContent="Salvando…"; btn.disabled=true; }
  try{
    const {error}=await SB.client.auth.updateUser({password:senha});
    if(error) throw error;
    try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(_){}
    const {data}=await SB.client.auth.getSession();
    if(data&&data.session){ await sbProceed(data.session); }
    else { state.authMode="login"; renderAuth("Senha alterada com sucesso! Entre com a nova senha."); }
  }catch(e){ renderNovaSenha((e&&e.message)||"Não foi possível salvar a senha. Tente novamente."); }
}
async function cloudEnter(){
  await CLOUD.whoami();
  db.usuarios = db.usuarios || [];
  let u = CLOUD.uid ? db.usuarios.find(x=>x.id===CLOUD.uid) : null;
  if(!u){
    if(!CLOUD.uid){
      state.user = {id:"anon",nome:CLOUD.myName||"Visitante",nivel:"caixa",ativo:true,cloud:true};
    } else {
      u = {id:CLOUD.uid, login:(CLOUD.myName||"membro"), senha:"", nome:CLOUD.myName||"Novo membro", nivel:(CLOUD.isOwner?"admin":"operacao"), ativo:(CLOUD.isOwner?true:false), cloud:true};
      db.usuarios.push(u); save(); state.user=u;
    }
  } else {
    if(CLOUD.myName && u.nome!==CLOUD.myName){ u.nome=CLOUD.myName; save(); }
    state.user=u;
  }
  if(state.user && state.user.ativo===false){ renderNoAccess(); return; }
  state.view="dashboard"; render();
}
function renderNoAccess(){
  $("#root").innerHTML = `<div class="login-wrap"><div class="login-hero"><div class="brandmark"><img class="loginlogo" src="${LOGO_FULL}" alt="Kitchen Sync"></div>
    <div><h1>Acesso pendente</h1><p>Seu usuário ainda não tem acesso liberado. Peça a um administrador para ativar você em <b>Funcionários</b>.</p></div><div class="pie"></div></div>
    <div class="login-panel"><div class="login-card"><h2>Sem acesso</h2><div class="sub">Assim que o administrador liberar, recarregue a página.</div></div></div></div>`;
}
function renderConfigError(msg){
  $("#root").innerHTML = `<div class="login-wrap"><div class="login-hero"><div class="brandmark"><img class="loginlogo" src="${LOGO_FULL}" alt="Kitchen Sync"></div>
    <div><h1>Configuração do banco de dados</h1><p>${esc(msg||"Não foi possível conectar ao Supabase.")}</p></div><div class="pie"></div></div>
    <div class="login-panel"><div class="login-card">
      <h2>Verifique a conexão</h2>
      <div class="sub">Confira, no topo do arquivo, se as chaves do Supabase estão corretas:</div>
      <ul style="font-size:13px;color:var(--ink-2);line-height:1.7;margin:8px 0 4px;padding-left:18px">
        <li><b>SUPA_URL</b> — o <i>Project URL</i> (Settings → API)</li>
        <li><b>SUPA_KEY</b> — a chave <i>anon public</i></li>
        <li>A tabela <b>app_state</b> e as políticas criadas (SQL)</li>
        <li>Sua conexão com a internet</li>
      </ul>
      <button class="btn primary" data-act="reload" style="width:100%;justify-content:center;margin-top:8px">Tentar novamente</button>
    </div></div></div>`;
}

/* ---------- Boot ---------- */
/* ============================================================
   CARDÁPIO DIGITAL PÚBLICO (QR na mesa) — cliente pede pelo próprio celular.
   Abre com  ?m=<id do restaurante>&mesa=<n>  — não exige login.
   Fala com a Edge Function "cardapio" (menu + pedido). Só no modo Supabase.
   ============================================================ */
let cardapioPub={tenant:null,mesa:"",info:null,menu:[],cart:{},cat:"Todos",q:"",client:null,enviando:false};
async function renderCardapioPublico(tenant,mesa){
  try{ document.title="Cardápio"; }catch(e){}
  cardapioPub.tenant=tenant; cardapioPub.mesa=mesa||"";
  $("#root").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;color:var(--ink-3);font-family:'Bricolage Grotesque',sans-serif;padding:24px;text-align:center">☕︎ Carregando o cardápio…</div>`;
  if(!(typeof supabase!=="undefined" && SUPA_URL && SUPA_KEY)){
    $("#root").innerHTML=cardapioErroHTML("Cardápio indisponível neste endereço."); return;
  }
  try{
    cardapioPub.client=supabase.createClient(SUPA_URL,SUPA_KEY);
    const {data,error}=await cardapioPub.client.functions.invoke("cardapio",{body:{action:"menu",tenant}});
    if(error) throw error;
    if(!data||data.error) throw new Error((data&&data.error)||"erro");
    cardapioPub.info=data; cardapioPub.menu=Array.isArray(data.produtos)?data.produtos:[];
    if(!cardapioPubBound){ document.addEventListener("click",cardapioClick); cardapioPubBound=true; }
    drawCardapio();
  }catch(e){
    $("#root").innerHTML=cardapioErroHTML("Não foi possível carregar o cardápio agora. Chame um atendente ou tente novamente.");
  }
}
function cardapioErroHTML(msg){
  return `<div style="min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center">
    <div><div style="font-size:46px;margin-bottom:10px">🍽️</div>
    <h2 style="font-size:20px;margin-bottom:6px">Cardápio</h2>
    <div class="muted" style="max-width:34ch;margin:0 auto">${esc(msg)}</div></div></div>`;
}
let cardapioPubBound=false;
function cardapioCount(){ return Object.values(cardapioPub.cart).reduce((s,n)=>s+n,0); }
function cardapioTotal(){ return Object.entries(cardapioPub.cart).reduce((s,[pid,n])=>{ const p=cardapioPub.menu.find(x=>x.id===pid); return s+(p?num(p.preco)*n:0); },0); }
function drawCardapio(){
  const m=cardapioPub.menu;
  const cats=["Todos",...[...new Set(m.map(p=>p.categoria||"Outros"))]];
  const cat=cardapioPub.cat, q=(cardapioPub.q||"").toLowerCase();
  const list=m.filter(p=>(cat==="Todos"||(p.categoria||"Outros")===cat)&&(!q||p.nome.toLowerCase().includes(q)||(p.descricao||"").toLowerCase().includes(q)));
  const nome=(cardapioPub.info&&cardapioPub.info.restaurante)||"Cardápio";
  const n=cardapioCount();
  const sy=window.scrollY;
  $("#root").innerHTML=`
  <div style="max-width:620px;margin:0 auto;padding:0 0 92px">
    <div style="position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--brand-strong),var(--brand));color:#fff;padding:18px 18px 14px;border-radius:0 0 18px 18px;box-shadow:var(--shadow)">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1.1">${esc(nome)}</div>
      <div style="font-size:13px;opacity:.9;margin-top:2px">${cardapioPub.mesa?`Mesa ${esc(cardapioPub.mesa)} · `:""}Peça pelo seu celular</div>
    </div>
    <div style="padding:14px 16px 0">
      <input class="input" id="cdp-q" placeholder="Buscar no cardápio…" value="${esc(cardapioPub.q||"")}" autocomplete="off" style="margin-bottom:12px">
      <div class="hstack" style="flex-wrap:wrap;gap:6px;margin-bottom:12px">
        ${cats.map(k=>`<button class="btn sm ${cat===k?"primary":"ghost"}" data-ca="cat" data-k="${esc(k)}">${esc(k)}</button>`).join("")}
      </div>
      ${list.length?list.map(p=>{const qn=cardapioPub.cart[p.id]||0;return `
        <div class="card" style="margin-bottom:10px"><div class="card-body" style="padding:14px 15px">
          <div class="hstack" style="justify-content:space-between;align-items:flex-start;gap:12px">
            <div style="min-width:0;flex:1">
              <div class="strong" style="font-size:15px">${esc(p.nome)}</div>
              ${p.descricao?`<div class="muted" style="font-size:12.5px;margin-top:2px">${esc(p.descricao)}</div>`:""}
              <div style="color:var(--brand);font-weight:700;font-size:15px;margin-top:6px">${BRL(p.preco)}</div>
            </div>
            <div style="flex-shrink:0">
              ${qn>0?`<div class="hstack" style="gap:8px;align-items:center">
                <button class="btn sm ghost" data-ca="dec" data-id="${p.id}" style="font-size:18px;padding:4px 11px">−</button>
                <span class="strong" style="min-width:18px;text-align:center">${qn}</span>
                <button class="btn sm primary" data-ca="add" data-id="${p.id}" style="font-size:18px;padding:4px 11px">＋</button>
              </div>`:`<button class="btn sm primary" data-ca="add" data-id="${p.id}">Adicionar</button>`}
            </div>
          </div>
        </div>`;}).join(""):`<div class="muted" style="text-align:center;padding:30px">Nenhum item encontrado.</div>`}
      <div class="muted" style="text-align:center;font-size:11.5px;margin-top:18px">Kitchen Sync</div>
    </div>
    ${n>0?`<div style="position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)">
      <button class="btn primary" data-ca="rever" style="width:100%;justify-content:space-between;font-size:15px;padding:14px 18px">
        <span>🛒 Ver pedido (${n})</span><span>${BRL(cardapioTotal())}</span></button>
    </div>`:""}
  </div>`;
  const qi=$("#cdp-q"); if(qi){ qi.addEventListener("input",e=>{ cardapioPub.q=e.target.value; const pos=e.target.selectionStart; drawCardapio(); const nb=$("#cdp-q"); if(nb){ nb.focus(); try{nb.setSelectionRange(pos,pos);}catch(_){} } }); }
  window.scrollTo(0,sy);
}
function cardapioClick(e){
  const a=e.target.closest("[data-ca]"); if(!a) return;
  const ca=a.getAttribute("data-ca"), id=a.getAttribute("data-id");
  if(ca==="cat"){ cardapioPub.cat=a.getAttribute("data-k"); drawCardapio(); }
  else if(ca==="add"){ cardapioPub.cart[id]=(cardapioPub.cart[id]||0)+1; drawCardapio(); }
  else if(ca==="dec"){ cardapioPub.cart[id]=Math.max(0,(cardapioPub.cart[id]||0)-1); if(!cardapioPub.cart[id]) delete cardapioPub.cart[id]; drawCardapio(); }
  else if(ca==="rever"){ cardapioRever(); }
}
function cardapioRever(){
  const linhas=Object.entries(cardapioPub.cart).map(([pid,qn])=>{const p=cardapioPub.menu.find(x=>x.id===pid);if(!p)return "";return `
    <div class="hstack" style="justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)">
      <span style="flex:1"><b>${qn}×</b> ${esc(p.nome)}</span>
      <span class="strong">${BRL(num(p.preco)*qn)}</span></div>`;}).join("");
  openModal("Seu pedido"+(cardapioPub.mesa?` · Mesa ${esc(cardapioPub.mesa)}`:""),`
    ${linhas||`<div class="muted">Seu pedido está vazio.</div>`}
    <div class="hstack" style="justify-content:space-between;margin-top:10px"><span class="strong" style="font-size:16px">Total</span><span class="strong" style="font-size:18px;color:var(--brand)">${BRL(cardapioTotal())}</span></div>
    <div class="field" style="margin-top:14px"><label>Seu nome (opcional)</label><input class="input" id="cdp-nome" placeholder="Para o atendente identificar" autocomplete="off"></div>
    <div class="field"><label>Observações (opcional)</label><input class="input" id="cdp-obs" placeholder="Ex.: sem cebola, ponto da carne…"></div>
    <div class="muted" style="font-size:12px;margin-top:4px">O pedido vai direto para a cozinha. O pagamento é feito com o atendente.</div>`,
    ()=>{ cardapioEnviar(); return false; });
  setTimeout(()=>{ const btn=$("#modal .btn.primary"); if(btn) btn.textContent="Enviar pedido"; },30);
}
async function cardapioEnviar(){
  if(cardapioPub.enviando) return;
  const itens=Object.entries(cardapioPub.cart).map(([produtoId,qtd])=>({produtoId,qtd})).filter(x=>x.qtd>0);
  if(!itens.length){ toast("Adicione itens ao pedido.","err"); return; }
  cardapioPub.enviando=true;
  const nome=($("#cdp-nome")&&$("#cdp-nome").value.trim())||"";
  const obs=($("#cdp-obs")&&$("#cdp-obs").value.trim())||"";
  const btn=$("#modal .btn.primary"); if(btn){ btn.textContent="Enviando…"; btn.disabled=true; }
  try{
    const {data,error}=await cardapioPub.client.functions.invoke("cardapio",{body:{action:"pedido",tenant:cardapioPub.tenant,mesa:cardapioPub.mesa,cliente:nome,obs,itens}});
    if(error) throw error;
    if(!data||data.error) throw new Error((data&&data.error)||"erro");
    cardapioPub.cart={}; closeModal();
    $("#root").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center">
      <div><div style="font-size:52px;margin-bottom:12px">✅</div>
      <h2 style="font-size:22px;margin-bottom:6px">Pedido enviado!</h2>
      <div class="muted" style="max-width:32ch;margin:0 auto 20px">A cozinha já recebeu o seu pedido${cardapioPub.mesa?` da mesa ${esc(cardapioPub.mesa)}`:""}. Um atendente cuida do restante.</div>
      <button class="btn primary" data-ca="novo-cdp">Fazer outro pedido</button></div></div>`;
    if(!cardapioNovoBound){ document.addEventListener("click",e=>{ if(e.target.closest('[data-ca="novo-cdp"]')) drawCardapio(); }); cardapioNovoBound=true; }
  }catch(e){
    toast("Não foi possível enviar. Tente de novo ou chame um atendente.","err");
    if(btn){ btn.textContent="Enviar pedido"; btn.disabled=false; }
  }finally{ cardapioPub.enviando=false; }
}
let cardapioNovoBound=false;

(async function boot(){
  // Cardápio digital público (QR) — intercepta antes de tudo
  try{
    const qp=new URLSearchParams(location.search);
    const mt=qp.get("m")||qp.get("cardapio");
    if(mt){ applyTheme(); await renderCardapioPublico(mt, qp.get("mesa")||qp.get("t")||""); return; }
  }catch(e){}
  applyTheme();
  // chaves do Supabase pela metade → erro claro
  if((typeof SUPA_URL==="string"&&SUPA_URL&&!(typeof SUPA_KEY==="string"&&SUPA_KEY)) || (typeof SUPA_KEY==="string"&&SUPA_KEY&&!(typeof SUPA_URL==="string"&&SUPA_URL))){
    renderConfigError("Faltou preencher uma das chaves do Supabase — preencha SUPA_URL e SUPA_KEY no topo do arquivo."); return;
  }
  // 1) Supabase (hospedado no seu domínio) → 2) Claude db (publicado) → 3) local
  let mode="local";
  try{ if(SB.configured() && await SB.init()) mode="sb"; }catch(e){}
  if(mode==="local"){ try{ if(await CLOUD.init()) mode="cloud"; }catch(e){} }
  if(mode!=="local" && typeof window.addEventListener==="function"){
    window.addEventListener("offline",()=>{ const A=cloudActive(); if(A) A.setStatus("offline"); });
    window.addEventListener("online",()=>{ const A=cloudActive(); if(A){ A.setStatus("syncing"); if(A.push) A.push(); } });
  }

  if(mode==="sb"){
    $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--ink-3);font-family:'Bricolage Grotesque',sans-serif">☁︎ Conectando…</div>`;
    try{
      const isRecovery = /type=recovery/.test(location.hash||"");
      const sess=await SB.session();
      if(isRecovery){ renderNovaSenha(); }
      else if(!sess){ renderAuth(); }
      else { await sbProceed(sess); }
      try{ SB.client.auth.onAuthStateChange((ev,s2)=>{ if(ev==="PASSWORD_RECOVERY"){ renderNovaSenha(); } else if(ev==="SIGNED_OUT"){ state.user=null; renderAuth(); } }); }catch(e){}
    }catch(e){ renderConfigError("Não foi possível conectar ao Supabase. Verifique as chaves (SUPA_URL / anon key), se o SQL foi executado e sua internet."); }
  } else if(mode==="cloud"){
    $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--ink-3);font-family:'Bricolage Grotesque',sans-serif">☁︎ Conectando à nuvem…</div>`;
    try{
      await CLOUD.loadAll();
      if(CLOUD.isOwner && CLOUD.canWrite){ const nv=processarVencidos(); if(nv>0) setTimeout(()=>toast(nv+" item(ns) vencido(s) tiveram baixa automática (perda: Vencido).","err"),800); }
      CLOUD.subscribeAll(); CLOUD.setStatus("synced");
      await cloudEnter();
    }catch(e){ $("#root").innerHTML = `<div style="height:100vh;display:grid;place-items:center;color:var(--brand);padding:20px;text-align:center">Não foi possível conectar à nuvem. Recarregue a página.</div>`; }
  } else {
    load();
    { const nv=processarVencidos(); if(nv>0) setTimeout(()=>toast(nv+" item(ns) vencido(s) tiveram baixa automática (perda: Vencido).","err"),500); }
    render();
  }
})();
</script>
<script>
/* Service worker: habilita instalação no celular e funcionamento offline básico. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
