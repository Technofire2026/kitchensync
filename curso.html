<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Sync — Treinamento da Equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1a2e; --ink-2:#46566c; --ink-3:#7e8ea4;
  --bg:#eef3fb; --panel:#ffffff; --panel-2:#e9f1fc; --line:#dce6f4;
  --rail:#0a1f4d; --rail-2:#153c8a; --rail-ink:#eef4ff; --rail-ink-2:#a2b8e2; --rail-line:#294a92;
  --brand:#2b6bff; --brand-2:#5b8dff; --brand-strong:#1a4fd6; --brand-soft:#e3ecff; --on-brand:#fff;
  --basil:#12b07a; --basil-soft:#dcf6ee; --amber:#f59e0b; --amber-soft:#fdeecd; --red:#e5484d; --red-soft:#fde5e6;
  --ring:rgba(43,107,255,.30);
  --shadow-sm:0 1px 2px rgba(15,27,45,.05);
  --shadow:0 1px 2px rgba(15,27,45,.04), 0 10px 26px -14px rgba(15,27,45,.18);
  --shadow-lg:0 30px 70px -24px rgba(15,27,45,.34);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand-strong)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,var(--rail-2),var(--rail) 34%);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 40px}
.side-brand{padding:20px 18px 12px;display:flex;align-items:center;gap:12px}
.side-brand .logo{width:46px;height:46px;border-radius:12px;background:transparent;display:grid;place-items:center;overflow:hidden;padding:0;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.side-brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
.side-brand .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;line-height:1;color:#fff}
.side-brand .tg{font-size:11px;color:var(--rail-ink-2);margin-top:3px}
.side-search{padding:6px 14px 12px}
.side-search input{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--rail-line);color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;outline:none}
.side-search input::placeholder{color:var(--rail-ink-2)}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-ink-2);padding:14px 20px 6px;font-weight:700}
.side a.les{display:flex;align-items:center;gap:9px;padding:8px 20px;color:var(--rail-ink);text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
.side a.les:hover{background:rgba(255,255,255,.06)}
.side a.les.active{background:rgba(43,107,255,.18);border-left-color:var(--brand);color:#fff;font-weight:600}
.side a.les .ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--rail-line);display:grid;place-items:center;font-size:11px;flex:none}
.side a.les.done .ck{background:var(--basil);border-color:var(--basil);color:#fff}
.side a.les .t{flex:1;min-width:0}
/* Main */
.main{max-width:100%;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:34px 28px 90px}
.crumb{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px}
h1.les-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.role-tag{font-size:11px;font-weight:700;background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:3px 10px}
.content h2{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;margin:26px 0 8px}
.content h3{font-size:16px;margin:20px 0 6px}
.content p{margin:8px 0}
.content ul{margin:8px 0;padding-left:20px}
.content ul li{margin:5px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin:14px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
.steps>li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-bottom:1px dashed var(--line)}
.steps>li:last-child{border-bottom:0}
.steps>li::before{content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;display:grid;place-items:center;font-size:14px}
.callout{border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;border:1px solid}
.callout b{font-weight:700}
.tip{background:var(--basil-soft);border-color:#bfe6cf}
.warn{background:var(--amber-soft);border-color:#f4dca0}
.note{background:var(--panel-2);border-color:var(--line)}
.kbd,.ui{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:13px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--panel-2);color:var(--ink-2)}
.pill.green{background:var(--basil-soft);color:#1f7a49}.pill.amber{background:var(--amber-soft);color:#9a6a08}.pill.red{background:var(--red-soft);color:#b4231a}
table.t{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{background:var(--panel-2);font-weight:700}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);transition:transform .12s cubic-bezier(.2,.7,.3,1),box-shadow .16s,background .16s,filter .16s}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand-strong);color:#fff;box-shadow:0 8px 18px -8px var(--brand),inset 0 1px 0 rgba(255,255,255,.18)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.04);box-shadow:0 12px 24px -10px var(--brand),inset 0 1px 0 rgba(255,255,255,.22)}
.btn:active{transform:translateY(0) scale(.985);filter:brightness(.98)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn.done{background:var(--basil);border-color:var(--basil);color:#fff;box-shadow:0 8px 18px -8px var(--basil)}
.hero{background:radial-gradient(120% 120% at 12% 8%, #2f6bff 0%, #1c4fd6 32%, #122f86 64%, #0a1f4d 100%);color:#fff;border-radius:20px;padding:34px 30px;margin-bottom:20px}
.hero .lg{width:260px;max-width:76%;height:auto;background:transparent;border-radius:0;padding:0;margin-bottom:16px}
.hero h1{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;margin:0 0 8px;color:#fff}
.hero p{color:#cfe0f2;margin:0;max-width:52ch}
.prog{font-size:12px;color:var(--ink-3)}
.topbar{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-320px;width:300px;z-index:50;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side.open{left:0}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--rail);color:#fff;padding:12px 16px;z-index:40}
  .topbar .mb{background:rgba(255,255,255,.1);border:1px solid var(--rail-line);color:#fff;border-radius:8px;padding:6px 12px;font-size:20px;cursor:pointer;line-height:1}
  .topbar .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .scrim.show{display:block}
}
</style>
</head>
<body>
<div class="topbar"><button class="mb" id="mb">☰</button><span class="nm">Kitchen Sync · Treinamento</span></div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="side-brand"><div class="logo"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235b8dff%22%2F%3E%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%232f6bff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231a4fd6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22%20opacity%3D%220.92%22%3E%3Cpath%20d%3D%22M126%20196%20A150%20150%200%200%201%20360%20150%22%2F%3E%3Cpath%20d%3D%22M386%20316%20A150%20150%200%200%201%20152%20362%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M360%20150%20l-6%20-44%20l46%2024%20z%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M152%20362%20l6%2044%20l-46%20-24%20z%22%20fill%3D%22%23ffffff%22%2F%3E%3Ctext%20x%3D%22256%22%20y%3D%22322%22%20text-anchor%3D%22middle%22%20font-family%3D%22Bricolage%20Grotesque%2CInter%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%22200%22%20fill%3D%22%23ffffff%22%20letter-spacing%3D%22-6%22%3EKS%3C%2Ftext%3E%3C%2Fsvg%3E" alt="Kitchen Sync"></div><div><div class="nm">Kitchen Sync</div><div class="tg">Treinamento da equipe</div></div></div>
    <div class="side-search"><input id="q" placeholder="Buscar no curso…" autocomplete="off"></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main"><div class="wrap"><div id="root"></div>
    <div class="done-row">
      <button class="btn" id="btn-done"></button>
      <div class="prog" id="prog"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btn-prev">← Anterior</button>
        <button class="btn primary" id="btn-next">Próxima →</button>
      </div>
    </div>
  </div></main>
</div>
<script>
"use strict";
const LOGO_FULL="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8dff"/><stop offset="0.55" stop-color="#2f6bff"/><stop offset="1" stop-color="#1a4fd6"/></linearGradient></defs><g transform="translate(6,19)"><rect x="0" y="0" width="112" height="112" rx="26" fill="url(#g)"/><g transform="translate(56,56) scale(0.195) translate(-256,-256)"><g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.92"><path d="M126 196 A150 150 0 0 1 360 150"/><path d="M386 316 A150 150 0 0 1 152 362"/></g><path d="M360 150 l-6 -44 l46 24 z" fill="#ffffff"/><path d="M152 362 l6 44 l-46 -24 z" fill="#ffffff"/><text x="256" y="322" text-anchor="middle" font-family="Bricolage Grotesque,Inter,sans-serif" font-weight="800" font-size="200" fill="#ffffff" letter-spacing="-6">KS</text></g></g><text x="138" y="70" font-family="Bricolage Grotesque,Inter,sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-1">Kitchen</text><text x="138" y="116" font-family="Bricolage Grotesque,Inter,sans-serif" font-weight="800" font-size="44" fill="#9fc0ff" letter-spacing="-1">Sync</text></svg>`);
const LOGO_MARK="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8dff"/><stop offset="0.55" stop-color="#2f6bff"/><stop offset="1" stop-color="#1a4fd6"/></linearGradient></defs><rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/><g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.92"><path d="M126 196 A150 150 0 0 1 360 150"/><path d="M386 316 A150 150 0 0 1 152 362"/></g><path d="M360 150 l-6 -44 l46 24 z" fill="#ffffff"/><path d="M152 362 l6 44 l-46 -24 z" fill="#ffffff"/><text x="256" y="322" text-anchor="middle" font-family="Bricolage Grotesque,Inter,sans-serif" font-weight="800" font-size="200" fill="#ffffff" letter-spacing="-6">KS</text></svg>`);
/* ============ Conteúdo do curso ============ */
const R = { adm:"Administrador", ger:"Gerência", op:"Resp. Operação", est:"Estoque", com:"Compras", fin:"Financeiro", todos:"Todas as funções" };
const SECTIONS = [
{ g:"Começar aqui", lessons:[
  {id:"intro", t:"Bem-vindo ao Kitchen Sync", roles:["todos"], html:`
    <div class="hero"><img class="lg" src="${LOGO_FULL}" alt="Kitchen Sync"><h1>Treinamento da equipe</h1><p>Este curso ensina, passo a passo, a operar o Kitchen Sync — do login ao controle de margens. Faça na ordem ou vá direto à sua função.</p></div>
    <p>O <b>Kitchen Sync</b> é o sistema de gestão do nosso grupo (Bar + Petiscaria + Pizzaria). Ele controla <b>estoque, produção, vendas, compras, fechamento e indicadores</b> — tudo sincronizado entre os aparelhos em tempo real.</p>
    <h2>Como usar este curso</h2>
    <ul>
      <li>Use o menu à esquerda para navegar pelos módulos.</li>
      <li>Marque <span class="ui">✓ Concluída</span> ao terminar cada aula — seu progresso fica salvo neste aparelho.</li>
      <li>Pesquise por palavra no campo <span class="ui">Buscar no curso</span>.</li>
      <li>No fim há <b>trilhas por função</b>: o caminho essencial para cada cargo.</li>
    </ul>
    <div class="callout tip">💡 <b>Dica:</b> abra o Kitchen Sync numa aba ao lado e vá praticando cada passo enquanto lê.</div>`},
  {id:"acesso", t:"Acesso: login e primeiro acesso", roles:["todos"], html:`
    <p>O acesso é feito com <b>e-mail e senha próprios</b> de cada pessoa. Não compartilhe sua senha.</p>
    <h2>Entrar</h2>
    <ol class="steps">
      <li>Abra o endereço do Kitchen Sync no navegador (ou o atalho na tela inicial do aparelho).</li>
      <li>Digite seu <b>e-mail</b> e <b>senha</b> e toque em <span class="ui">Entrar</span>.</li>
    </ol>
    <h2>Primeiro acesso</h2>
    <ol class="steps">
      <li>Se ainda não tem conta, toque em <span class="ui">Criar conta</span>, informe e-mail e senha.</li>
      <li>No primeiro acesso, seu usuário entra como <b>pendente</b> — aparece a tela "Acesso pendente".</li>
      <li>Peça a um <b>administrador</b> para definir sua <b>função</b> e ativar seu acesso (em Funcionários).</li>
      <li>Depois de liberado, recarregue a página e entre normalmente.</li>
    </ol>
    <div class="callout warn">⚠️ <b>Atenção:</b> o <b>primeiro usuário do sistema</b> vira Administrador automaticamente. Os demais começam pendentes, por segurança.</div>
    <h2>Sair</h2>
    <p>Toque no botão <span class="ui">⏻</span> no rodapé do menu lateral para encerrar sua sessão (importante em aparelhos compartilhados).</p>`},
  {id:"papeis", t:"Funções e o que cada uma acessa", roles:["adm","ger"], html:`
    <p>Cada pessoa tem uma <b>função</b> que define quais telas ela vê. As funções seguem o fluxo da operação:</p>
    <table class="t"><thead><tr><th>Função</th><th>Responsabilidades</th></tr></thead><tbody>
      <tr><td><span class="pill">Administrador</span></td><td>Acesso total, inclusive Configurações e Funcionários.</td></tr>
      <tr><td><span class="pill">Gerência</span></td><td>Valida necessidades, aprova compras, acompanha custos e indicadores.</td></tr>
      <tr><td><span class="pill">Resp. da Operação</span></td><td>Confere estoque, identifica necessidade, registra perdas, emite requisição, acompanha consumo.</td></tr>
      <tr><td><span class="pill">Estoque / Almoxarifado</span></td><td>Entradas/saídas, recebimento, confere quantidade/lote/validade, fechamento.</td></tr>
      <tr><td><span class="pill">Compras</span></td><td>Cotação, mapa comparativo, pedido, fornecedores.</td></tr>
      <tr><td><span class="pill">Financeiro</span></td><td>Despesas, DRE, liberação de pagamento (só após o recebimento).</td></tr>
    </tbody></table>
    <div class="callout note">🔒 O menu mostra <b>apenas</b> as telas da sua função. Se precisar de algo que não aparece, fale com o administrador.</div>`},
  {id:"navegacao", t:"A tela: menu, busca e sincronização", roles:["todos"], html:`
    <h2>Menu lateral</h2>
    <p>À esquerda ficam os módulos agrupados em <b>Operação</b>, <b>Suprimentos</b>, <b>Financeiro</b> e <b>Sistema</b>. No celular, toque em <span class="ui">☰</span> para abrir.</p>
    <h2>Busca</h2>
    <p>Cada tela tem um campo <span class="ui">Buscar…</span> para filtrar a lista (produtos, insumos, vendas etc.).</p>
    <h2>Selo de sincronização</h2>
    <p>No topo aparece o estado da nuvem:</p>
    <ul>
      <li><span class="pill green">☁︎ sincronizado</span> — tudo salvo e igual em todos os aparelhos.</li>
      <li><span class="pill amber">⟳ sincronizando…</span> — salvando agora.</li>
      <li><span class="pill red">⚠︎ sem conexão</span> — a internet caiu; os dados não estão sincronizando. Reconecte para atualizar.</li>
    </ul>
    <div class="callout tip">💡 O <b>tema claro/escuro</b> alterna no botão 🌓 do topo.</div>
    <div class="callout warn">⚠️ Sem conexão, evite lançar dados importantes em dois aparelhos ao mesmo tempo — ao voltar a internet, vale a última gravação.</div>`},
]},
{ g:"Operação diária", lessons:[
  {id:"painel", t:"Painel (visão do dia)", roles:["todos"], html:`
    <p>É a primeira tela. Mostra a saúde do dia num relance.</p>
    <h2>O que você vê</h2>
    <ul>
      <li><b>Indicadores (KPIs):</b> vendas, valor em estoque, vencido no mês e itens vencendo.</li>
      <li><b>Alertas de estoque:</b> itens <b>abaixo do mínimo</b>, agrupados por setor (🔥 Cozinha, 🍹 Bar, 🧴 Limpeza, 📦 Descartáveis).</li>
      <li><b>Vencimentos próximos:</b> itens/lotes que vencem em até 30 dias, com selo de urgência.</li>
    </ul>
    <div class="callout tip">💡 Use o seletor <span class="ui">Dia / Mês / Ano</span> para mudar o período dos indicadores.</div>`},
  {id:"vendas", t:"Registrar vendas (canal e pessoas)", roles:["op","ger"], html:`
    <p>Lança as vendas do balcão, salão e iFood.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Vendas → ＋ Nova venda</span>.</li>
      <li>Escolha a <b>Data</b> e a forma de <b>Pagamento</b>.</li>
      <li>Escolha o <b>Canal</b>: <span class="pill">Balcão</span>, <span class="pill">Salão</span> ou <span class="pill">iFood</span>.</li>
      <li>Se for salão, informe o <b>nº de pessoas</b> (usado no ticket por pessoa).</li>
      <li>Toque em <span class="ui">＋ Adicionar item</span>, escolha o produto, a quantidade e confira o preço.</li>
      <li>Confira o total e toque em <span class="ui">Salvar</span>.</li>
    </ol>
    <div class="callout note">ℹ️ O <b>canal</b> importa para a margem: no iFood o sistema aplica as taxas do iFood; no cartão, a taxa de cartão. Isso deixa a margem por canal correta.</div>
    <div class="callout tip">💡 Bebidas/itens de revenda marcados para "baixa na venda" já <b>descontam do estoque</b> automaticamente.</div>`},
  {id:"comandas", t:"Mesas e comandas do salão", roles:["op","ger"], html:`
    <p>Controla o salão por mesa e alimenta os indicadores de <b>giro de mesa</b> e <b>permanência</b>.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Mesas / Comandas → ＋ Abrir comanda</span>.</li>
      <li>Informe a <b>mesa</b> e o <b>nº de pessoas</b>.</li>
      <li>Na comanda aberta, toque em <span class="ui">＋ Itens</span> para adicionar o que foi consumido (dá para voltar e adicionar mais depois).</li>
      <li>Ao final, toque em <span class="ui">Fechar</span>: a comanda vira automaticamente uma <b>venda de salão</b>, registra o tempo de permanência e dá baixa no estoque.</li>
    </ol>
    <p>As comandas fechadas no dia aparecem em "Fechadas hoje" com o tempo de permanência.</p>
    <div class="callout warn">⚠️ Só <span class="ui">Cancelar</span> uma comanda se ela foi aberta por engano — cancelar <b>não</b> gera venda.</div>`},
  {id:"producao", t:"Produção (o que a cozinha produziu)", roles:["op","est","ger"], html:`
    <p>Registra a produção do dia (ex.: massas, molhos, pizzas montadas). Serve para o cálculo do <b>consumo teórico</b> no fechamento.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Produção → ＋ Nova produção</span>.</li>
      <li>Escolha o <b>produto</b>, a <b>quantidade</b>, o <b>turno</b> e a data.</li>
      <li>Salve. O sistema usa a <b>ficha técnica</b> do produto para calcular quanto de insumo deveria ter sido consumido.</li>
    </ol>
    <div class="callout tip">💡 Quanto mais fiel a produção, mais preciso fica o desvio no fechamento.</div>`},
]},
{ g:"Cardápio & preços", lessons:[
  {id:"produtos", t:"Cadastro de produtos e ficha técnica", roles:["adm","ger","op"], html:`
    <p>Produtos são os itens do cardápio (pizzas, petiscos, bebidas, adicionais).</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Produtos & Cardápio → ＋ Novo produto</span>.</li>
      <li>Informe <b>nome</b>, <b>categoria</b> e o <b>conceito</b> (Pizzaria / Petiscaria / Bar) — o conceito é o "centro de receita" usado nos indicadores.</li>
      <li>Monte a <b>ficha técnica</b>: adicione os insumos e a quantidade usada por porção. O sistema calcula o custo de insumos automaticamente.</li>
      <li>Marque <span class="ui">Dar baixa no estoque ao vender</span> apenas para itens de revenda (ex.: refrigerante) — não marque pizzas.</li>
    </ol>
    <div class="callout tip">💡 Ficha técnica correta = CMV teórico correto = margem confiável.</div>`},
  {id:"precificacao", t:"Precificação automática (balcão e iFood)", roles:["adm","ger"], html:`
    <p>O Kitchen Sync sugere o preço para você bater a margem desejada, já considerando custos e taxas.</p>
    <ol class="steps">
      <li>No cadastro do produto, preencha os custos por unidade: <b>energia, embalagem, outros</b>.</li>
      <li>Defina a <b>margem de lucro (%)</b> e como aplicá-la (sobre o preço ou sobre o custo).</li>
      <li>Informe o <b>imposto</b>, a <b>taxa de cartão</b> e as <b>taxas do iFood</b> (comissão, transação, antecipação).</li>
      <li>Veja a <b>prévia</b>: custo total, preço sugerido de <b>balcão</b> e de <b>iFood</b>, com o lucro de cada.</li>
      <li>Toque em <span class="ui">Usar preços sugeridos</span> para preencher os preços.</li>
    </ol>
    <div class="callout note">ℹ️ A precificação não altera o DRE nem o CMV — ela serve para definir preço e enxergar o lucro por canal.</div>`},
]},
{ g:"Estoque & setores", lessons:[
  {id:"insumos", t:"Insumos & Estoque (marca, setor, validade)", roles:["adm","ger","op","est"], html:`
    <p>Insumos são tudo que você compra e estoca: ingredientes, bebidas, material de limpeza e embalagens.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Insumos & Estoque → ＋ Novo insumo</span>.</li>
      <li>Informe <b>nome</b>, <b>marca</b> e o <b>setor</b> (Cozinha / Bar / Limpeza / Descartáveis) — o setor separa cada estoque.</li>
      <li>Defina <b>unidade</b> (kg, un, L…), <b>estoque atual</b> e <b>estoque mínimo</b> (usado nos alertas).</li>
      <li>Para perecíveis, informe a <b>validade</b>.</li>
    </ol>
    <div class="callout tip">💡 O botão <span class="ui">⤓ CSV estoque</span> baixa uma planilha com todo o estoque por setor.</div>`},
  {id:"lotes", t:"Vários lotes e validades por item", roles:["est","ger"], html:`
    <p>Quando o mesmo item tem várias datas de validade, use <b>lotes</b>.</p>
    <ol class="steps">
      <li>No cadastro do insumo, seção <b>Lotes com validades diferentes</b>, toque em <span class="ui">＋ Adicionar lote</span>.</li>
      <li>Informe a <b>quantidade</b> e a <b>validade</b> de cada lote.</li>
      <li>Com lotes, o <b>estoque</b> passa a ser a soma dos lotes e a validade exibida é a mais próxima.</li>
    </ol>
    <ul>
      <li><b>Saídas</b> consomem primeiro o lote que vence antes (FIFO).</li>
      <li>Nas <b>entradas</b> você pode informar a validade do novo lote.</li>
      <li>Itens <b>vencidos</b> têm baixa automática registrada como <b>perda "Vencido"</b>, lote a lote.</li>
    </ul>`},
  {id:"movimentacoes", t:"Entradas e saídas por setor + lista de saída", roles:["op","est"], html:`
    <p>Cada setor tem sua tela de movimentação: <b>Cozinha</b>, <b>Bar</b>, <b>Limpeza</b>, <b>Descartáveis</b>.</p>
    <ol class="steps">
      <li>Abra o setor no menu (ex.: <span class="ui">Cozinha (Ent/Saída)</span>).</li>
      <li><b>Entrada:</b> registra reposição/ajuste (soma ao estoque; pode informar validade para criar lote).</li>
      <li><b>Saída:</b> registra o que saiu (subtrai do estoque; consome os lotes que vencem antes).</li>
      <li>Use <span class="ui">🖨 Lista de saída</span> para imprimir a folha do dia com espaço de assinatura (entregue / recebido).</li>

  {id:"perdas", t:"Perdas & ocorrências", roles:["op","est","ger"], html:`
    <p>Registre toda perda para o desvio ficar justo (o que foi perdido não vira "sumiço").</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Perdas & Ocorrências → ＋ Registrar perda</span>.</li>
      <li>Escolha o insumo (ou produto), a quantidade e o <b>motivo</b> (Quebra, Queima, Cortesia, Sobra, Vencido, Outro).</li>
      <li>Descreva no campo de observação, se precisar, e salve.</li>
    </ol>
    <div class="callout tip">💡 Perda registrada = desvio explicado. Isso protege a equipe e mostra onde melhorar.</div>`},
]},
{ g:"Compras & fornecedores", lessons:[
  {id:"cotacoes", t:"Requisição e cotação (mapa comparativo)", roles:["op","com","ger"], html:`
    <p>A cotação junta a lista de compras, envia aos fornecedores e compara os preços.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Cotações → ＋ Nova cotação</span> e dê um nome (ex.: "Reposição semanal").</li>
      <li>Use o filtro <b>Setor</b> para montar rápido (ex.: só do Bar) e <span class="ui">＋ Adicionar todos do setor</span> para puxar tudo que está baixo.</li>
      <li>Ajuste as quantidades e escolha os <b>fornecedores</b> que vão cotar.</li>
      <li>Ao abrir a cotação, envie por <span class="ui">✉️ E-mail a todos</span> ou <span class="ui">🟢 WhatsApp</span> (a mensagem já vai pronta, separada por setor).</li>
      <li>Digite os <b>preços recebidos</b> de cada fornecedor. O menor preço por item fica destacado e há <b>subtotal por setor</b> e total geral.</li>
      <li>Use <span class="ui">🖨 Relatório (mapa comparativo)</span> para imprimir a comparação.</li>
    </ol>
    <div class="callout note">ℹ️ O e-mail/WhatsApp abre o app do seu aparelho com a mensagem pronta — você confere e envia; o sistema não dispara sozinho.</div>`},
  {id:"fluxo", t:"Fluxo de aprovação de compras", roles:["com","ger","est","fin"], html:`
    <p>Cada compra segue etapas, e <b>cada função só executa a sua</b>. Isso garante a regra "sem recebimento, sem pagamento".</p>
    <table class="t"><thead><tr><th>Etapa</th><th>Quem faz</th></tr></thead><tbody>
      <tr><td>Enviar para cotação</td><td>Operação / Compras</td></tr>
      <tr><td>Escolher fornecedor vencedor e <b>Submeter à Gerência</b></td><td>Compras</td></tr>
      <tr><td><b>Aprovar</b> ou reprovar</td><td>Gerência</td></tr>
      <tr><td><b>Emitir pedido</b> ao fornecedor</td><td>Compras</td></tr>
      <tr><td><b>Registrar recebimento</b> (dá entrada no estoque e atualiza o custo)</td><td>Estoque</td></tr>
      <tr><td><b>Liberar pagamento</b> (só após o recebimento)</td><td>Financeiro</td></tr>
    </tbody></table>
    <p>O botão de cada etapa aparece na cotação apenas para quem tem a função. Todo o caminho fica no <b>histórico</b> (quem fez e quando).</p>
    <div class="callout warn">⚠️ O Financeiro só consegue liberar pagamento <b>depois</b> que o Estoque registrar o recebimento — é a trava contra pagar sem receber.</div>`},
  {id:"fornecedores", t:"Fornecedores", roles:["com","ger","fin"], html:`
    <p>Cadastro de quem fornece, com contato para as cotações.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Fornecedores → ＋ Novo fornecedor</span>.</li>
      <li>Informe <b>nome</b>, <b>e-mail</b> e <b>telefone/WhatsApp</b> (usados no envio das cotações), CNPJ e observações.</li>
    </ol>
    <div class="callout tip">💡 Preencha e-mail e WhatsApp corretamente — é por eles que a cotação é enviada com um toque.</div>`},
]},
{ g:"Fechamento & conferência", lessons:[
  {id:"fechamento", t:"Fechamento da Cozinha (desvio do dia)", roles:["op","est","ger"], html:`
    <p>É a conferência que revela desperdício/desvio. <b>O desvio sai do fluxo físico da cozinha — não da venda.</b> Ele compara o que <b>entrou e saiu do estoque</b> (o que foi enviado para a cozinha) com a <b>contagem física</b> (o que de fato sobrou na prateleira) — e não quanto foi vendido no caixa.</p>
    <div class="callout tip">🎯 <b>Conceito-chave.</b> Fórmula por insumo: <b>sobra anterior + enviado para a cozinha − consumo da produção − perdas registradas − sobra contada = desvio</b>. Se bateu, o desvio fica ≈ 0. Se faltou mais do que a produção e as perdas explicam, há <b>sumiço/desperdício</b> a investigar. A <b>venda não entra</b> nessa conta — quem usa a venda é o CMV e o DRE.</div>
    <ol class="steps">
      <li>Vá em <span class="ui">Fechamento Cozinha</span> e escolha o <b>dia</b>.</li>
      <li>Faça a <b>contagem física</b> de cada insumo e digite na coluna <b>Sobra contada</b>.</li>
      <li>O sistema mostra o <b>desvio</b> por item (verde = ok, vermelho = faltou → investigar).</li>
      <li>Toque em <span class="ui">💾 Salvar fechamento</span>. Fica registrado <b>quem fechou</b>.</li>
      <li>Use <span class="ui">🖨 Relatório</span> para imprimir.</li>
    </ol>
    <div class="callout note">ℹ️ A sobra contada de hoje vira a sobra anterior de amanhã. Feche todos os dias para o desvio ser confiável.</div>`},
  {id:"fechamento-bar", t:"Fechamento por setor (Bar / Limpeza / Descartáveis)", roles:["op","est","ger"], html:`
    <p>Mesma ideia da cozinha, para os outros setores — e também <b>pelo fluxo físico de cada setor, não pela venda</b>. Conta por item: <b>sobra anterior + entradas − saídas − sobra contada = desvio</b>. Cada setor (Bar, Limpeza, Descartáveis) tem seu próprio fluxo e seu próprio desvio.</p>
    <ol class="steps">
      <li>Vá em <span class="ui">Fechamento Bar/Setor</span>.</li>
      <li>No seletor, escolha o setor: <b>Bar</b>, <b>Limpeza</b> ou <b>Descartáveis</b>.</li>
      <li>Digite a <b>contagem</b> de cada item e confira o desvio.</li>
      <li>Salve. Cada setor tem seu histórico e relatório, separados da cozinha.</li>
    </ol>`},
]},
{ g:"Gestão & indicadores", lessons:[
  {id:"despesas", t:"Despesas", roles:["adm","ger","fin"], html:`
    <p>Lança as despesas fixas e variáveis (aluguel, energia, folha etc.) que entram no DRE.</p>
    <ol class="steps"><li>Vá em <span class="ui">Despesas → ＋ Nova despesa</span>.</li><li>Informe categoria, descrição, valor e data.</li></ol>`},
  {id:"dre", t:"DRE (resultado do mês)", roles:["adm","ger","fin"], html:`
    <p>Mostra o resultado do mês: receita → impostos → CMV → lucro bruto → despesas/folha → resultado.</p>
    <ol class="steps"><li>Vá em <span class="ui">DRE</span> e escolha o mês.</li><li>Leia o resultado e a margem; exporte em <span class="ui">CSV</span> se precisar.</li></ol>`},
  {id:"analises", t:"Análises (consumo e desvios)", roles:["ger","fin","com","op"], html:`
    <p>Aprofunda o consumo, a produção e os desvios do período.</p>
    <ul>
      <li>Mais vendidos, mais lucrativos e custos.</li>
      <li><b>Desvio consolidado</b> de todos os setores num número só.</li>
      <li><b>Desvios mensais por setor</b> (Bar, Limpeza, Descartáveis) com situação (ok/atenção/crítico).</li>
      <li><span class="ui">⤓ CSV desvios</span> exporta tudo para planilha.</li>
    </ul>`},
  {id:"kpis", t:"Margens & KPIs (a métrica-norte)", roles:["adm","ger","fin"], html:`
    <p>O painel de gestão. A métrica principal é a <b>Variação de CMV</b>.</p>
    <h2>Variação de CMV</h2>
    <p>É quanto do faturamento vaza <b>além da ficha técnica</b> (desperdício, desvio, porcionamento). <b>Meta: até 2 pontos percentuais.</b> Mostra <b>CMV Teórico</b> (pela ficha) × <b>CMV Real</b> (teórico + vazamento).</p>
    <div class="callout note">ℹ️ <b>Dois olhares que se completam.</b> O <b>desvio do fechamento</b> é <b>físico</b>: compara estoque enviado × contado, por setor, e aponta <i>onde</i> sumiu produto. A <b>Variação de CMV</b> aqui é <b>financeira</b>: usa o <b>faturamento</b> como base para medir <i>quanto</i> esse vazamento pesou no bolso. O desvio não depende da venda; o CMV sim.</div>
    <h2>Outros indicadores</h2>
    <ul>
      <li><b>Margem de contribuição</b> — receita menos CMV, impostos e comissões (meta ≥ 45%).</li>
      <li><b>Prime Cost</b> — CMV + folha (meta ≤ 60%).</li>
      <li><b>Ticket médio</b> — por pedido e por pessoa.</li>
      <li><b>Por conceito</b> e <b>por canal</b> (Balcão/Salão/iFood).</li>
      <li><b>Engenharia de cardápio</b> — classifica cada item em Estrela, Cavalo de batalha, Enigma ou Abacaxi.</li>
      <li><b>Salão</b> — giro de mesa, permanência média e RevPASH.</li>
    </ul>
    <div class="callout tip">💡 Se a Variação de CMV subir, procure a causa em <b>Perdas</b> e no <b>Fechamento</b> — geralmente é porcionamento, desperdício ou contagem furada.</div>`},
]},
{ g:"Administração", lessons:[

{ g:"Trilhas por função", lessons:[
  {id:"trilha-op", t:"Trilha — Resp. da Operação", roles:["op"], html:`

/* ============ App do curso ============ */
const LESSONS=[]; SECTIONS.forEach(s=>s.lessons.forEach(l=>{l.grupo=s.g; LESSONS.push(l);}));
const KEY="kitchensync_curso_done";
let done={}; try{ done=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ done={}; }
let cur=location.hash.replace("#","")||LESSONS[0].id;
if(!LESSONS.find(l=>l.id===cur)) cur=LESSONS[0].id;
const $=s=>document.querySelector(s);
function saveDone(){ try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){} }
function roleTags(roles){ return (roles||[]).map(r=>`<span class="role-tag">${R[r]||r}</span>`).join(""); }
function renderNav(filter){
  const f=(filter||"").toLowerCase();
  let html="";
  SECTIONS.forEach(s=>{
    const ls=s.lessons.filter(l=>!f || l.t.toLowerCase().includes(f) || (l.html.toLowerCase().includes(f)));
    if(!ls.length) return;
    html+=`<div class="grp">${s.g}</div>`;
    ls.forEach(l=>{ html+=`<a class="les ${l.id===cur?"active":""} ${done[l.id]?"done":""}" data-id="${l.id}"><span class="ck">${done[l.id]?"✓":""}</span><span class="t">${l.t}</span></a>`; });
  });
  $("#nav").innerHTML=html||`<div class="grp">Nada encontrado</div>`;
}
function total(){ return LESSONS.length; }
function nDone(){ return LESSONS.filter(l=>done[l.id]).length; }
function render(){
  const i=LESSONS.findIndex(l=>l.id===cur); const l=LESSONS[i];
  $("#root").innerHTML=`<div class="crumb">${l.grupo}</div><h1 class="les-title">${l.t}</h1><div class="roles">${roleTags(l.roles)}</div><div class="content">${l.html}</div>`;
  const bd=$("#btn-done"); bd.textContent=done[l.id]?"✓ Concluída":"Marcar como concluída"; bd.className="btn "+(done[l.id]?"done":"");
  $("#prog").textContent=`${nDone()} de ${total()} aulas concluídas`;
  const prev=LESSONS[i-1], next=LESSONS[i+1];
  $("#btn-prev").style.visibility=prev?"visible":"hidden";
  $("#btn-next").style.visibility=next?"visible":"hidden";
  $("#btn-next").textContent=next?("Próxima: "+next.t.split("(")[0].trim()+" →"):"Próxima →";
  renderNav($("#q").value);
  window.scrollTo(0,0);
  try{ location.hash=cur; }catch(e){}
}
function go(id){ if(LESSONS.find(l=>l.id===id)){ cur=id; closeSide(); render(); } }
function closeSide(){ $("#side").classList.remove("open"); $("#scrim").classList.remove("show"); }
document.addEventListener("click",e=>{
  const a=e.target.closest(".les"); if(a){ go(a.getAttribute("data-id")); return; }
  if(e.target.id==="btn-done"){ done[cur]=!done[cur]; saveDone(); render(); return; }
  if(e.target.id==="btn-prev"){ const i=LESSONS.findIndex(l=>l.id===cur); if(i>0) go(LESSONS[i-1].id); return; }
  if(e.target.id==="btn-next"){ const i=LESSONS.findIndex(l=>l.id===cur); if(i<LESSONS.length-1){ if(!done[cur]){done[cur]=true;saveDone();} go(LESSONS[i+1].id);} return; }
  if(e.target.id==="mb"){ $("#side").classList.toggle("open"); $("#scrim").classList.toggle("show"); return; }
  if(e.target.id==="scrim"){ closeSide(); return; }
});
$("#q").addEventListener("input",e=>renderNav(e.target.value));
render();
</script>
</body>
</html>
